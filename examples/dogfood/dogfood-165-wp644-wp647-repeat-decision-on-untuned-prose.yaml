        exit 1
      }
      grep -qE 'export function mergeDesignFindings' src/workflow/completion-review.ts || {
        echo "AC-3 FAIL: trap — dogfood-164's WP-648 deterministic acquittal was disturbed. Out of scope."
        exit 1
      }
      grep -qE 'export function scanDiffForLayeringViolations' src/judge/scan-layering.ts || {
        echo "AC-3 FAIL: trap — dogfood-164's WP-649 layering scan was disturbed. Out of scope."
        exit 1
      }
      grep -qE 'export const MAX_GATE_REPAIR_ATTEMPTS' src/heal/gate-repair.ts || {
        echo "AC-3 FAIL: trap — the gate-repair route lost its bound (WP-542/F-207)."
        exit 1

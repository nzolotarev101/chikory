      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: the normalisation is not at the shared runCliStep site — a summary produced by the real gemini-cli parser still carries the workspace's absolute location, or the agy envelope strip was broken. vitest exited $ST"
        exit 1

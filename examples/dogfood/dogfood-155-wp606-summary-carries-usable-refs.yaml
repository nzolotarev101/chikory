        exit 1
      }
      TARGET=test/executors/ac2-shared-site.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { execFile } from "node:child_process";
      import { mkdtemp, mkdir, writeFile } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { promisify } from "node:util";

      import { describe, expect, test } from "vitest";

      import { createLocalArtifactStore } from "../../src/artifacts/index.js";
      import { parseAgyOutput } from "../../src/executors/gemini-cli.js";
      import { runCliStep } from "../../src/executors/step.js";
      import type { StepInput } from "../../src/types.js";

      const execFileAsync = promisify(execFile);
      const REL = "packages/sdk-ts/src/workflow/agent-loop.ts";

      describe("every CLI adapter inherits the ref normalisation (WP-606)", () => {
        test("the real gemini-cli parser's summary comes back workspace-relative", async () => {
          const parent = await mkdtemp(join(tmpdir(), "chikory-ac2-"));
          const dir = join(parent, "ws");
          await mkdir(dir);
          await mkdir(join(parent, "artifacts"));
          const g = (args: string[]) => execFileAsync("git", ["-C", dir, ...args]);
          await g(["init", "-q"]);
          await g(["config", "user.email", "ac2@chikory.dev"]);
          await g(["config", "user.name", "chikory-ac2"]);
          await writeFile(join(dir, "seed.txt"), "seed\n");
          await g(["add", "-A"]);
          await g(["commit", "-q", "-m", "base"]);
          const store = createLocalArtifactStore(join(parent, "artifacts"));

          const input: StepInput = {
            workspaceDir: dir,
            instruction: "summarise",
            context: {
              goal: "Summarise.",
              acceptanceCriteria: [{ id: "AC-1", description: "d" }],
              planItem: "summarise",
              notes: {},
              recentSteps: [],
              injections: [],
              memoryRefs: [],
            },
            limits: { maxSeconds: 60, maxCostUsd: 1 },
          };

          // Real agy print output, emitted by a real subprocess: the envelope the
          // adapter strips, plus the workspace URLs the SHARED site must normalise.
          const agyStdout =
            "<notification><task_id>abc123</task_id></notification>\n" +
            "Rewired the loop at [`agentLoop`](file://" + dir + "/" + REL + "#L982).\n";
          const stdoutFile = join(parent, "agy-stdout.txt");
          await writeFile(stdoutFile, agyStdout);

          const record = await runCliStep({
            adapterName: "gemini-cli",

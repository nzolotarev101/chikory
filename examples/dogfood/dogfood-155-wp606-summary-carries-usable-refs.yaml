    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# MEASURE it at the launch commit rather than trusting this line (F-342, dogfood-140).
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE (what a step summary carries forward) AND DRIVES THE REAL ENTRY
      POINT AT THE CONSUMED SEAM. It runs the REAL runCliStep against a REAL temporary git
      workspace — no mocks, no calling a helper directly — at the MEASURED magnitude from the
      previous run (15 URLs, ~2.3 KB, in a ~6.6 KB summary) and asserts on the returned StepRecord:
      workspace refs became relative and kept their lines, a path outside the workspace is
      untouched, the transcript artifact still holds the raw text, and a summary with nothing to
      normalise comes back byte-identical.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/executors/ac1-summary-refs-resolve.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { execFile } from "node:child_process";
      import { mkdtemp, mkdir, writeFile } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { promisify } from "node:util";

      import { describe, expect, test } from "vitest";

      import { createLocalArtifactStore } from "../../src/artifacts/index.js";
      import { runCliStep } from "../../src/executors/step.js";
      import type { ArtifactStore, StepInput } from "../../src/types.js";

      const execFileAsync = promisify(execFile);

      const REL = "packages/sdk-ts/src/judge/harness.ts";
      const OUTSIDE_URL = "https://example.com/docs/harness.ts#L1-L2";
      const OUTSIDE_PATH = "/usr/local/lib/node_modules/pnpm/bin/pnpm.cjs";

      async function makeWorkspace(): Promise<{ dir: string; store: ArtifactStore }> {
        const parent = await mkdtemp(join(tmpdir(), "chikory-ac1-"));
        const dir = join(parent, "ws");
        await mkdir(dir);
        await mkdir(join(parent, "artifacts"));
        const g = (args: string[]) => execFileAsync("git", ["-C", dir, ...args]);
        await g(["init", "-q"]);
        await g(["config", "user.email", "ac1@chikory.dev"]);
        await g(["config", "user.name", "chikory-ac1"]);
        await writeFile(join(dir, "seed.txt"), "seed\n");
        await g(["add", "-A"]);
        await g(["commit", "-q", "-m", "base"]);
        return { dir, store: createLocalArtifactStore(join(parent, "artifacts")) };
      }

      function stepInput(dir: string): StepInput {
        return {
          workspaceDir: dir,
          instruction: "summarise",
          context: {
            goal: "Summarise the work.",
            acceptanceCriteria: [{ id: "AC-1", description: "refs resolve" }],
            planItem: "summarise",
            notes: {},
            recentSteps: [],
            injections: [],
            memoryRefs: [],
          },
          limits: { maxSeconds: 60, maxCostUsd: 1 },
        };
      }

      /** The MEASURED shape: 15 file:// URLs into the workspace, ~2.3 KB of them. */
      function measuredSummary(dir: string): string {
        const lines: string[] = ["### Summary of Changes", ""];
        for (let i = 0; i < 14; i += 1) {
          lines.push(
            "* In [`applyCheckOverrides`](file://" + dir + "/" + REL + "#L106-L147) the criterion",
          );
        }
        lines.push("* A bare absolute path: " + dir + "/" + REL + " was also edited.");
        lines.push("* Unrelated: " + OUTSIDE_URL + " and " + OUTSIDE_PATH + " are not ours.");
        return lines.join("\n");
      }

      const RAW_STDOUT_MARKER = "raw stdout the archive must keep";

      async function runWith(dir: string, store: ArtifactStore, summary: string) {
        // The fake CLI echoes a file, so the RAW text really flows through the
        // subprocess and into the transcript artifact — no stdout injection hook.
        const stdoutFile = join(dir, "..", "stdout.txt");
        await writeFile(stdoutFile, RAW_STDOUT_MARKER + "\n");
        return runCliStep({
          adapterName: "fake-summariser",
          store,
          input: stepInput(dir),
          bin: "cat",
          args: [stdoutFile],
          parse: () => ({
            ok: true,
            summary,
            toolCalls: 0,
            tokens: { input: 10, output: 10 },
            costUsd: 0,
            costEstimated: true,
          }),
        });
      }

      describe("step summary refs outlive the run (WP-606)", () => {
        test("workspace refs become relative and keep their lines; outside paths are untouched", async () => {
          const { dir, store } = await makeWorkspace();
          const raw = measuredSummary(dir);
          // The premise's magnitude, not a plausible-looking literal (F-384/F-388).
          expect(raw.length).toBeGreaterThan(1500);
          expect(raw.split(dir).length - 1).toBeGreaterThanOrEqual(15);

          const record = await runWith(dir, store, raw);
          const out = record.summary;

          expect(
            out,
            "the workspace's absolute location must not ride into the next step's prompt",
          ).not.toContain(dir);
          expect(out, "the file must still be named, relative to the workspace root").toContain(REL);
          expect(
            out,
            "the lines the writer put there are the point of the ref — a bare path is not enough",
          ).toMatch(/harness\.ts[:#]L?106/);
          expect(
            out,
            "trap: a URL to a real website is somebody else's path",
          ).toContain(OUTSIDE_URL);
          expect(
            out,
            "trap: an absolute path outside the workspace is somebody else's path",
          ).toContain(OUTSIDE_PATH);
          expect(out.length, "the point of the WP is that this gets smaller").toBeLessThan(
            raw.length,
          );
        });

        test("TRAP: the transcript artifact still holds the raw text (audit trail, not context)", async () => {
          const { dir, store } = await makeWorkspace();
          const record = await runWith(dir, store, measuredSummary(dir));
          const transcript = new TextDecoder().decode(await store.get(record.transcriptRef));
          expect(
            transcript,
            "normalising the summary is a context decision; normalising the archive is tampering",
          ).toContain(RAW_STDOUT_MARKER);
        });

        test("TRAP: a summary with nothing to normalise comes back byte-identical", async () => {
          const { dir, store } = await makeWorkspace();
          const clean = "Edited packages/sdk-ts/src/judge/harness.ts:106 and ran the suite.";
          const record = await runWith(dir, store, clean);
          expect(record.summary).toBe(clean);
        });

        test("TRAP: an empty summary gains no marker, header or newline", async () => {
          const { dir, store } = await makeWorkspace();
          const record = await runWith(dir, store, "");
          expect(record.summary).toBe("");
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: a step summary still carries the workspace's absolute location into the next step, or the normalisation dropped the line numbers, or it rewrote a path that is not ours, or it rewrote the transcript, or it charged the healthy path. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: the summary's workspace refs are relative, still carry their lines, and nothing else moved"

  - id: AC-2
    description: >
      THIS CHECK OWNS THE SECOND HALF — the normalisation is at the SHARED site, so every adapter
      inherits it without being edited. It drives the REAL gemini-cli adapter's parse function

      pnpm exec eslint src/runner/activities.ts src/chain/write-set.ts src/chain/write-boundary.ts || { echo "AC-3 FAIL: eslint is red on the modules this WP touches"; exit 1; }

      grep -qE 'inconclusive_check' src/chain/compaction-note.ts || {
        echo "AC-3 FAIL: trap — dogfood-157's successor note (src/chain/compaction-note.ts:40) lost its inconclusive marker. This WP does not touch the note."
        exit 1
      }
      grep -qE 'WRITE_BOUNDARY_NOTE' src/chain/write-boundary.ts || {

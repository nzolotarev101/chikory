# Plain: when the grader complains about something partway through a run and the agent then fixes it,
# the grader still remembers the old complaint at the end and fails the whole run over it. Fixing a
# problem mid-run is the normal way a run goes, so almost every multi-step run is being failed for
# work it already did. After this run, a complaint that a machine re-check has since answered stops
# counting against the final verdict — while a complaint only a human-style judgement could answer
# still does, because nothing has actually re-examined it.
# WP: WP-629 (a MACHINE-SETTLED finding a later judge pass cleared must not condemn the seal, F-361)
# Ladder-rung: 0 (off-ladder — see WHY; the remaining rung-5 half is WP-304, not agent-runnable)
# Thesis-KPI: seal fidelity (terminal state agrees with the delivery). MEASURED harm (dogfood-145,
#   run-1f2a02e0-4615-47fa-8847-ea37c4164cfb): both acceptance criteria green on disk, the declared
#   suite green at 1,510 tests, harvest byte-IDENTICAL 6/6 — and the run sealed FAILED. Seal fidelity
#   over the trailing 6 headline runs: 1/6 (five FAILED seals, five deliveries landed by hand).
# Format: loose — the outcomes and the named observables are fixed, the mechanism is the executor.
#
# Launch mode: RUN (single node — one deliverable, one seam).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-145 review, 2026-08-15):
#   `scripts/dogfood-progression.sh` reads OK PROGRESSING, so the default candidate is the next ladder
#   rung and a non-ladder candidate must beat it on thesis value AND pass every gate. It does, because
#   the rung is not runnable as a dogfood headline — unchanged since dogfood-140:
#     * P3-rung-5 (EXIT) = WP-303 + WP-304. WP-303 closed in dogfood-139.
#     * WP-304 needs the OpenHands arm plus a corpus wide enough to separate 19 requirements — a
#       quota-bound multi-hour suite the operator runs BY HAND (dogfood-122). No spec can headline it.
#   Among runnable candidates WP-629 wins over WP-628 (finish WP-625): the seal is the loop only
#   automatic signal, and right now it is wrong more often than it is right. Every future run,
#   WP-628 included, is graded by it.
#
# THE MEASURED PREMISE (measured on this tree 2026-08-15; do not re-litigate):
#   * `standingFindings` (`src/workflow/agent-loop.ts:268`) is APPEND-ONLY. The only operations on it
#     anywhere in the file are `.push` (`:1134-1146`) and reads (`:406`, `:1253`, `:1273`). Nothing
#     removes an entry when a later judge pass PASSES the same rubric id.
#   * MEASURED on `run-1f2a02e0-4615-47fa-8847-ea37c4164cfb`: judge pass #1 `tests_pass` ✗
#     ("1/2 judge-executed checks failed: AC-2") → pushed. Judge pass #2 `tests_pass` ✓ ("all 2
#     judge-executed checks exited 0") → the pass-#1 entry stayed. Judge pass #3 (the completion
#     review) was handed that stale text as an out-of-rubric concern, upheld it, and the run sealed
#     `FAILED — escalation_concerns_adjudicated` with both ACs green on disk.
#   * The stale entry does more than get adjudicated: a non-empty concern list is what makes
#     `escalation_concerns_adjudicated` be ADDED to the rubric at all
#     (`src/runner/activities.ts:1699-1704`, the F-340 fix). Settle it and the row is not asked.
#   * THE DISCRIMINATION THIS WP TURNS ON — measured, not theoretical. Two kinds of rubric row:
#       - MACHINE-SETTLED: `tests_pass` when the spec declares `check` commands. Every pass re-runs
#         those commands against the WHOLE current tree (`src/judge/evidence.ts:175-205`), so a later
#         PASS is authoritative evidence the earlier failure is gone. This is the F-361 case.
#       - MODEL-JUDGED: `design_serves_overall_goal` and friends are answered from the INCREMENTAL
#         diff of that pass. A later clean pass never looked at the code the objection was about, so
#         it settles nothing. WP-601/F-295 exists precisely because a run could otherwise outrun a
#         design concern by committing more steps, and
#         `test/runner/standing-findings-live.test.ts:165` pins it: an objection at pass #1 plus two
#         clean passes must STILL reach the completion review. MEASURED at this arming pass — a
#         reference that prunes any later-passing id turns that committed test RED.
#   * TWO call sites consume the array and BOTH must see the settled view: the completion review at
#     `src/workflow/agent-loop.ts:1273`, and `regressionGateBeforeSuccess` at `:406`, which unions
#     `standingFindings` with the ESCALATE verdict concerns. AC-1 drives both.
#   * FREE-TEXT CONCERNS HAVE NO RUBRIC ID (`:1142-1146`). They cannot be settled by id and must not
#     be dropped by anything else — WP-619 exists to adjudicate exactly those.
#   * NOT THE SAME BUG as F-344/WP-619. That fix wrote the clearing STANDARD into the judge charter
#     (`src/judge/prompt.ts:197-214`). This is about which findings are put to the judge at all.
#   * SCOPE — the second half of F-361 is deliberately OUT. The completion review is dispatched with
#     `criteria: []` (`:1269`), so it executes zero acceptance checks and carries no `test_results`
#     evidence; a genuinely-standing concern about check evidence therefore cannot be cleared by
#     showing green checks. That is correct once settling lands (a still-standing concern SHOULD be
#     adjudicated against the cumulative diff), and re-running every check in the review would double
#     the run cost and re-open F-349-class interference. Do not build it here.
#   * The suite this run must not break, MEASURED at the launch commit (F-342 — run
#     `pnpm --filter @chikory/sdk exec vitest run` yourself and read its own tail): at the dogfood-145
#     review it stood at 189 files / 1,510 tests (1,487 passed | 23 skipped) in 60.40 s, of which
#     `test/runner/` is 54 files / 384 tests. If your number differs, yours is right and this is stale.
#   * The `unattended:` block below is not decoration (F-322).
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. **Settling ANY row a later pass passed.** The single most likely delivery and the one that
#      reverts WP-601: a design objection raised at pass #1 would vanish the moment pass #2 came back
#      clean, letting a run outrun a design concern by committing more steps. AC-1 PRESERVED
#      (model-judged) pins the objection reaching the review AND still condemning the run; AC-2 keeps
#      `standing-findings-live.test.ts` green, and it goes RED on exactly this delivery.
#   B. **Clearing the array wholesale** (`standingFindings.length = 0` on a clean pass, or keeping
#      only what the newest pass raised). Same failure as A with a bigger blast radius.
#   C. **Matching by justification text instead of rubric id.** The justification wording changes
#      between passes; the id does not.
#   D. **Settling free-text concerns too.** They carry no id and dropping them silently reverts
#      WP-619. AC-1 PRESERVED (free text) pins that the concern still reaches the seal.
#   E. **Buying the clear by re-running the acceptance checks inside the completion review.** AC-1
#      counts check executions in a file the check itself appends to: exactly one per step-level
#      judge pass, never more.
#   F. **Fixing only the completion-review call site (`:1273`) and not `regressionGateBeforeSuccess`
#      (`:406`).** AC-1 PRESERVED (free text) drives the ESCALATE gate, not the PROCEED one.
#   G. **Proving it with a unit test over the array.** The observable is what the JUDGE IS SENT — the
#      completion-review request body — and the run terminal state. AC-1 asserts both.
#
# NOT PROVABLE BY THIS RUN ITSELF (F-197): the Temporal worker is built from HEAD at launch, so this
#   run executes the OLD loop and its own seal will very likely BE the defect being fixed. AC-1
#   therefore drives the loop IN-TEST against the scripted executor and the fake judge wire
#   (`test/runner/helpers.ts`) — the real workflow, the real judgeStep activity, real judge-executed
#   shell checks and a real ephemeral Temporal server, with only the LLM transport faked. The first
#   live datum is the NEXT run.
#
# NOT IN SCOPE: WP-628/F-360 (ignored-path isolation for modify + delete); F-362 (the trace step
#   table shows the completion-review verdict as the step verdict); WP-624/F-351; WP-626/F-358;
#   WP-606/F-306; the rubric item set; the judge prompt; `benchmarks/`.

name: dogfood-146-wp629-cleared-finding-pruning
wp: WP-629
goal: >
  A finding that a later judge pass RE-SETTLED against the whole delivery must not condemn the seal.
  A finding nothing has actually re-examined still must.

  Measured on this tree: the standing-findings array (src/workflow/agent-loop.ts:268) is append-only — every
  failing rubric row is pushed at :1134-1146 and nothing anywhere removes it when a later pass
  settles that same row. MEASURED on run-1f2a02e0-4615-47fa-8847-ea37c4164cfb: `tests_pass` failed at
  judge pass #1 ("1/2 judge-executed checks failed: AC-2"), PASSED at judge pass #2 ("all 2
  judge-executed checks exited 0"), and judge pass #3 was still handed the pass-#1 text as an
  out-of-rubric concern. It upheld it. The run sealed FAILED with both acceptance criteria green on
  disk and the declared suite green at 1,510 tests. Red-then-green is the normal shape of a
  multi-step run.

  The distinction is what makes this hard, and it is measurable, not a matter of taste. When the spec
  declares `check` commands, `tests_pass` is re-derived on every pass by re-running those commands
  against the WHOLE current tree — a later PASS is authoritative. Every model-judged row is answered
  from that pass's INCREMENTAL diff, which no longer contains the code an earlier objection was
  about — a later clean pass settles nothing, and WP-601/F-295 exists precisely so a run cannot
  outrun a design concern by committing more steps.

  Make these true:

    * **A re-settled finding leaves.** When a later pass settles a standing row against the whole
      delivery, that finding no longer stands. It is not put to the completion review, and with
      nothing left standing the adjudication row is not asked at all.

    * **A merely-unrepeated finding stays.** A model-judged objection raised at an earlier pass must
      still reach the completion review and must still be able to condemn the run, no matter how
      many clean passes follow it.

    * **A free-text concern is never dropped.** Concerns carry no rubric id (:1142-1146). WP-619
      exists to adjudicate exactly those, and they must still reach the seal.

    * **Both consumers see the same view.** The completion review (:1273) and
      regressionGateBeforeSuccess (:406) must both be given the settled set.

    * **No extra cost.** The clear must not be bought by re-running acceptance checks in the review
      pass, and a run that never raised anything must cost exactly what it costs today.

  How you do it is yours: settle at the push site, keep a per-id record instead of a string array, or
  compute the standing set at the seal — whichever, the two consumers must agree, the key must be the
  rubric id rather than the justification text, and the machine-settled/model-judged distinction must
  be derived from something real rather than a hardcoded guess about one id. Say in your step summary
  which you chose and — explicitly — what it still does NOT cover.

  Nothing else changes. The judge charter (src/judge/prompt.ts:197-214), the F-340 rule that the
  adjudication row appears only when a concern exists (src/runner/activities.ts:1699-1704), WP-627's
  one bounded design-fix repair, MAX_COMPLETION_REVIEWS, the rubric item set, sealFromRubricFails's
  deterministic condemnations, the TaskSpec contract and every chain semantic are untouched. Do NOT
  make the completion review execute acceptance criteria — its empty criteria list (:1269) stays. No new
  dependency, no provider SDK, no API key. TypeScript stays strict ESM with named exports and no
  `any`. This code DOES run inside the Temporal workflow: keep it deterministic — no clocks, no
  randomness, no I/O outside activities.

  Pin your work with a test that lives in the repo, under packages/sdk-ts/test/runner/, beside
  standing-findings-live.test.ts. A behaviour proved only by the acceptance check that grades this
  run is not pinned at all (F-356), and a repo test copied verbatim from that check inherits its
  blind spots (F-360) — cover something the grading check does not.

  If an existing test pins a shape this change must alter, update its expectation and say plainly in
  the step summary that you did — do not delete it, and do not weaken it into a tautology. Be warned:
  `standing-findings-live.test.ts:165` is NOT such a test. It pins WP-601, it must stay exactly as it
  is, and a delivery that needs it changed is trap A.

  Verify your work with FAST checks only: the package typecheck (tsc with noEmit), eslint over the
  files you touched, and vitest over only the test files you touched. Do NOT run the full vitest
  suite inside a step — it does not fit the step time cap (F-345) — this run's declared regression
  suite plus the judge-executed checks are the trusted full-suite verification whatever your summary
  says.


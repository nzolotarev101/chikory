      Temporal substrate is asserted present rather than skipped, so the check cannot pass vacuously.
    check: |
      cd packages/sdk-ts && node --input-type=module -e '
      import {writeFileSync,rmSync} from "node:fs";
      import {spawnSync} from "node:child_process";
      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const target=join(process.cwd(),"test/runner/ac1-cleared-finding.generated.test.ts");
      rmSync(target,{force:true});
      const SRC=[
      "import { randomUUID } from \"node:crypto\";",
      "import { mkdtemp, rm, readFile } from \"node:fs/promises\";",
      "import { existsSync } from \"node:fs\";",
      "import { tmpdir } from \"node:os\";",
      "import { join } from \"node:path\";",
      "",
      "import { afterEach, describe, expect, inject, test } from \"vitest\";",
      "",
      "import {",
      "  createRunnerWorker,",
      "  createTemporalRunner,",
      "  Journal,",
      "  journalPath,",
      "  RUBRIC_DESIGN_SERVES_OVERALL_GOAL,",
      "  type JudgeForm,",
      "  type RunHandle,",
      "  type RunStatusReport,",

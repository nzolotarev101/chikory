      "      marker,",
      "    );",
      "    expect(",
      "      body.includes(STALE_CHECK_ENTRY),",
      "      \"the settled check-failure justification still reached the seal\",",
      "    ).toBe(false);",
      "    expect(report.status, \"an upheld design objection must still condemn\").toBe(\"FAILED\");",
      "    expect(terminal.reason ?? \"\").toContain(RUBRIC_DESIGN_SERVES_OVERALL_GOAL);",
      "    expect(terminal.resumable).toBe(true);",
      "  }, 300_000);",
      "});",
      ""].join("\n");
      writeFileSync(target, SRC);
      const res=spawnSync("pnpm",["exec","vitest","run",
        "test/runner/ac1-cleared-finding.generated.test.ts"],{stdio:"inherit"});
      rmSync(target,{force:true});
      A(res.status===0,
        "a rubric row a later judge pass RE-SETTLED against the whole delivery must stop standing "+
        "against the seal — no concern section in the review prompt, no re-run of the acceptance "+
        "checks, SUCCESS in two steps — while a free-text concern still reaches the ESCALATE gate "+
        "and a model-judged objection followed by a clean pass still reaches the review and still "+
        "condemns the run to FAILED (resumable). vitest exited "+res.status);
      console.log("AC-1 OK: re-settled findings leave, unexamined findings stay");
      '

  - id: AC-2
    description: >
      The delivery compiles as strict TypeScript, the two modules it is expected to change are
      lint-clean, the WHOLE committed `test/runner/` tree passes, and that tree has GROWN. The suite
      is load-bearing here, not ceremony: `standing-findings-live.test.ts:165` pins WP-601 and goes
      RED on trap A — MEASURED at this arming pass, a reference implementation that settles any
      later-passing rubric id fails 2 committed tests. The growth floor is a DURABILITY floor, not a
      proof of correctness — AC-1 carries the whole gating burden for behaviour. It exists because a
      repo test transcribed from the grading check inherits its blind spots (F-360) and a
      generate-run-delete check leaves no residue at all (F-356). MEASURED baseline at the launch
      commit: 54 files / 384 tests.
    check: |
      cd packages/sdk-ts || exit 1
      pnpm run typecheck || { echo "AC-2 FAIL: strict typecheck is red"; exit 1; }
      pnpm exec eslint src/workflow/agent-loop.ts src/runner/activities.ts || { echo "AC-2 FAIL: eslint is red on the modules this WP touches"; exit 1; }
      OUT=$(pnpm exec vitest run test/runner/ 2>&1)
      ST=$?
      echo "$OUT" | tail -30
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: the committed test/runner tree is RED (vitest exited $ST). If standing-findings-live.test.ts failed, you took trap A: a model-judged objection is NOT settled by a later clean pass (WP-601/F-295). That test must stay exactly as it is."
        exit 1
      fi
      N=$(echo "$OUT" | grep -oE "Tests +[0-9]+ passed" | grep -oE "[0-9]+" | head -1)
      echo "committed test/runner tests: ${N:-UNPARSEABLE} (floor 387, measured baseline 384)"
      if [ -z "$N" ]; then
        echo "AC-2 FAIL: could not read a test count out of the vitest summary"
        exit 1
      fi
      if [ "$N" -lt 387 ]; then
        echo "AC-2 FAIL: durability floor not met — the committed runner tree did not grow by 3 tests. A behaviour proved only by the generated grading check is not pinned at all (F-356), and a repo test transcribed from it inherits its blind spots (F-360)."
        exit 1
      fi
      echo "AC-2 OK: strict TS, lint clean, the committed runner tree is green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

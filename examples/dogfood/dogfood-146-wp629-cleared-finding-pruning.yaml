      executor, fake judge TRANSPORT — over three scenarios that differ only in what the judge says.
      CLEARED: an acceptance check that exits 1 at step 1 and 0 at step 2 must leave NOTHING standing,
      so the completion-review prompt carries no out-of-rubric concern section at all and the run
      seals SUCCESS in two steps; the check appends one line per execution to a counter file and
      exactly two lines must exist, so the clear cannot be bought by re-running the checks (trap E).
      PRESERVED (free text): the same red-then-green shape with a free-text concern raised at the
      converging pass must still deliver that concern to the ESCALATE gate, regressionGateBeforeSuccess

# Plain: when our reviewer flags something outside its checklist and the run has otherwise
# converged, we currently write the flag into the outcome text and ship anyway. Last run that
# cost us two real defects in a published artifact. This run makes the flag a question the run
# must ANSWER before it may finish green.
# WP: WP-619 (adjudicate escalation concerns before the converged seal)
# Ladder-rung: 0 (off-ladder — see WHY; the remaining rung-5 half is WP-304, not agent-runnable)
# Thesis-KPI: judge true-positives that GATE. dogfood-139 scored 2 judge true-positives and
#   shipped both defects anyway; this run makes a named concern change the outcome. Second KPI:
#   the F-334 hand-fix live-proven — this spec declares `regression_suite:`, so a converged
#   escalation must show a completion-review pass, and a non-deterministic finding on it must now
#   condemn rather than fall through to SUCCESS (F-197: a run cannot prove the fix it delivers).
# Format: loose — the outcome is fixed, the mechanism and its wiring are the executor's
#
# Launch mode: RUN (single node — one deliverable, one seam).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-139 review, 2026-08-14):
#   The progression gate reads ✅ PROGRESSING (the ledger `rung` column moved 0 → 4 as the campaign
#   returned to the ladder), so the default candidate is the next ladder rung — and a non-ladder
#   candidate must beat it on thesis value AND pass every gate. It does, because the rung is not
#   runnable as a dogfood headline:
#     * P3-rung-5 (EXIT) = WP-303 + WP-304. **WP-303 closed in dogfood-139** — the leaderboard site
#       and methodology are published at `benchmarks/publications/leaderboard/index.html`.
#     * WP-304's remaining half needs the OpenHands arm plus a corpus wide enough to separate 19
#       requirements: a quota-bound multi-hour benchmark suite. dogfood-122 proved an LLM executor
#       must not supervise one, and the operator runs those arms BY HAND. No spec can headline it.
#   So the rung's agent-runnable work is done, and the highest-value remaining work is the 🔴 that
#   let dogfood-139 ship two named defects green.
#
# THE MEASURED PREMISE (re-measure before building; do not re-litigate):
#   * **A converged escalation seals green with its concerns unanswered.** dogfood-139
#     (`run-ab72b901-4f3f-4b98-b6e1-ca00324ff0a6`): judge pass #1 returned ESCALATE with 3
#     out-of-rubric concerns; judge pass #2 ran a smaller rubric over the **byte-identical diff**
#     (`3bb7b4d56554`, 27,395 bytes — cited by BOTH passes), never re-tested them, and the run
#     sealed 🟢 SUCCESS. Two of the three named real, reproducible defects in the delivered code
#     (fabricated corpus counts; markup injection defeating the no-network trap). Both landed.
#   * **The seal fires on `allCriteriaPass && allRubricPass`** (`src/workflow/agent-loop.ts:1328`),
#     justified in-comment on the premise that a converged concern is about *evidence the diff
#     cannot carry* — "there is nothing left for the executor to produce". That premise is false
#     for a concern that names the diff.
#   * **The concerns are carried, never consulted.** They reach the terminal `reason` string and
#     nothing else. `grep -n "escalateReason" src/workflow/agent-loop.ts` — no consumer decides
#     anything from them.
#   * **The sibling hole is already closed, and this run must not regress it (F-334/WP-621,
#     hand-fixed in the dogfood-139 review):** `regressionGateBeforeSuccess`
#     (`src/workflow/agent-loop.ts:397`) now condemns a NON-deterministic completion-review finding
#     (`:424`) instead of returning `undefined` into a SUCCESS seal. Proven RED-then-GREEN by
#     Scenario 8 (`test/runner/regression-suite-repair-live.test.ts:423`); sdk suite **1380** green.
#   * **The suite this run must not break** is `pnpm --filter @chikory/sdk exec vitest run` —
#     timed at HEAD 2026-08-14: **175 files / 1357 passed | 23 skipped (1380)** in ~52 s.
#   * **The `unattended:` block below is not decoration** (F-322): without it a converged
#     out-of-rubric escalation parks for a human instead of auto-sealing.
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. **Condemning on the PRESENCE of a concern.** The single most tempting fix, and it re-seals
#      dogfood-121's fate: a converged step re-raising an evidence-shaped concern forever killed a
#      5-node chain whose delivery was already committed. AC-1 drives an evidence-shaped concern
#      and REQUIRES it to still seal SUCCESS with the F-229/F-271 wording intact.
#   B. **Deciding it in the runner by string-matching the concern text.** A heuristic ("mentions a
#      file path -> defect") is not adjudication; it is a regex pretending to be a judge. AC-1
#      drives the two directions with **byte-identical concern text**, flipping only the judge's
#      answer — so any text-derived decision produces the same outcome twice and fails.
#   C. **Never sealing green again.** The inverse squeeze. A run whose adjudication comes back
#      clean must reach exactly today's SUCCESS, and a run with NO concerns must be untouched.
#   D. **Re-entering the loop to fix the concern.** The gate is terminal-or-nothing by design.
#      AC-1 pins the completion-review pass count at exactly ONE in both directions.
#   E. **Asking the judge and ignoring the answer.** The F-180 shape, three times over. AC-1
#      requires the FAILED outcome to NAME what condemned it, in the terminal reason.
#   F. **Adjudicating without showing the judge the concern.** A pass that never sees the text
#      cannot answer it. AC-2 reads the raw completion-review request off the wire and requires
#      the concern verbatim inside it.
#   G. **Riding only the `regression_suite` path.** `regressionGateBeforeSuccess` returns early
#      when no suite is declared, so a suite-less run would keep shipping concerns unadjudicated.
#      AC-2 drives a converged escalation on a run that declares NO suite and still requires the
#      adjudication to happen.
#   H. **Weakening the F-334 guard to make room.** AC-2 re-drives a non-deterministic completion
#      review finding and requires it to still condemn.
#
# NOT IN SCOPE: WP-620/F-339 (the stale-spec guard oracle); WP-616/F-328; WP-618/F-332;
#   WP-606/F-306; anything in `benchmarks/` (dogfood-139 closed WP-303).

name: dogfood-140-wp619-adjudicate-escalation-concerns
wp: WP-619
goal: >
  A judge concern raised outside the rubric must be ANSWERED before a converged step may seal green.

  Today it is only recorded. When a run converges — every acceptance criterion passing, every rubric
  item passing — and the judge escalates with free-text concerns, the runner copies those concerns
  into the terminal reason and seals SUCCESS. dogfood-139 did exactly this while two of its three
  concerns named real defects in the code it was shipping, and both defects landed.

  Make these true:

    * **The concerns become a question the judge answers, once.** When a converged out-of-rubric
      escalation is about to seal, the run's own completion-review pass must adjudicate the
      escalation's concerns against the diff and return a settled, machine-readable answer — not
      prose. The runner decides from THAT answer.

    * **The outcome follows the answer, in both directions.** An answer that clears the concerns
      seals SUCCESS exactly as today, with the existing converged wording intact. An answer that
      upholds a concern condemns the run — a resumable FAILED whose reason NAMES what was upheld,
      so the outcome says what was wrong without anyone reading a journal.

    * **The decision is the judge's, never the text's.** Two runs carrying the identical concern
      text must be able to reach opposite outcomes, because the only thing that differs is the
      judge's answer. Nothing may infer "is this a real defect" by pattern-matching the wording.

    * **The judge is actually shown the concerns.** The adjudicating pass must carry the concern
      text it is being asked about.

    * **It happens whether or not the run declares a regression suite.** The existing gate returns
      early when no suite is declared; a run with no suite must still have its concerns adjudicated.

    * **Exactly one extra judge pass, and never a return to the loop.** The gate stays
      terminal-or-nothing: adjudicate once, then seal. A converged step re-judged repeatedly
      re-raises the same concern forever — that is what killed a five-node chain in dogfood-121.

  Nothing else changes: a run with no concerns, a PROCEED run, a rollback, and a rubric-failing run
  all keep exactly today's behavior and cost. A non-deterministic completion-review finding must
  still condemn a converged seal (this landed one review ago — do not weaken it).

  If an existing test pins a shape this change must alter, update its expectation and say plainly in
  the step summary that you did — do not delete it, and do not weaken it into a tautology. One of
  them will need it: a converged escalation on a suite-less run currently buys zero judge passes.

  Constraints: TypeScript stays strict ESM with named exports and no `any`; the workflow stays
  Temporal-replay-safe (no new nondeterminism, no wall-clock branch); no new dependency, no provider
  SDK, no API key. The terminal status type stays the frozen pair it is today — SUCCESS or FAILED,
  no third value. Project commands run
  sequentially inside the already-activated Devbox environment, so invoke pinned tools directly and
  never nest `devbox run`.

  VERIFY YOUR OWN WORK: before you finish, run the SDK package's build, lint, typecheck and full
  vitest suite through its own pnpm scripts, and report the ACTUAL command you ran and the ACTUAL
  counts it printed. Run each of those FOUR commands once and read its own output — do not re-run
  one command four times under four different names (F-325). This run also declares its own
  regression suite, so a red SDK test will block the seal whatever your summary says.

repos:
  - url: /Users/nikitazolotarev/repos/chikory
    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# Timed at HEAD 2026-08-14: `175 files · 1357 passed | 23 skipped (1380 tests)` in ~52 s.
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE, AND IT DRIVES REAL TEMPORAL RUNS. Two converged out-of-rubric
      escalations carrying BYTE-IDENTICAL concern text, differing only in how the judge answers the
      adjudication. The cleared one must seal SUCCESS with the F-229/F-271 wording intact (trap A,
      trap C); the upheld one must seal FAILED naming what was upheld (trap E). Because the text is
      identical, any decision derived from the wording produces the same outcome twice and fails
      (trap B). Both runs are pinned to exactly ONE completion-review pass (trap D).
    check: |
      cd packages/sdk-ts && node --input-type=module -e '
      import {writeFileSync,rmSync} from "node:fs";
      import {spawnSync} from "node:child_process";
      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const target=join(process.cwd(),"test/runner/ac1-adjudicate.generated.test.ts");
      rmSync(target,{force:true});
      const SRC=`
      import { randomUUID } from "node:crypto";
      import { mkdtemp, rm } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { afterEach, describe, expect, inject, test } from "vitest";
      import {
        createRunnerWorker, createTemporalRunner, Journal, journalPath,
        COMPLETION_REVIEW_RUBRIC, RUBRIC_PRE_EXISTING_SUITE_GREEN,
        type RunHandle, type RunStatusReport,
      } from "../../src/index.js";
      import {
        completionReviewForm, initSourceRepo, judgeForm, makeJudgedSpec,
        scriptedRegistry, startFakeJudgeWire, TERMINAL_STATUSES, waitFor,
        type FakeJudgeWire,
      } from "./helpers.js";

      const address = inject("temporalAddress");
      const bundlePath = inject("workflowBundlePath");

      // The rubric ids the completion review carried BEFORE this work package. Any id the review
      // asks about that is not one of these is the adjudication row — so this test never
      // hardcodes the new name, it derives it.
      const KNOWN_TODAY = [
        "no_architecture_violations",
        "design_serves_overall_goal",
        "cumulative_design_coherent",
        RUBRIC_PRE_EXISTING_SUITE_GREEN,
      ];
      const adjudicationIds = (): string[] =>
        COMPLETION_REVIEW_RUBRIC.map((r) => r.id).filter((id) => !KNOWN_TODAY.includes(id));

      // ONE concern string, used by BOTH directions. Nothing about the wording may decide the
      // outcome (trap B).
      const CONCERN =
        "the helper introduced in this diff mishandles the empty case and the tests do not cover it";

      describe.skipIf(address === null)("AC-1: a converged escalation is adjudicated", () => {
        const cleanups: Array<() => Promise<void>> = [];
        afterEach(async () => {
          while (cleanups.length > 0) await cleanups.pop()!();
        });

        async function setup(wire: FakeJudgeWire) {
          const tmp = await mkdtemp(join(tmpdir(), "chikory-ac1-adj-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const repoUrl = await initSourceRepo(join(tmp, "src"), {
            echoJudgeFeedback: true,
            claimsCompleteSteps: [1],
          });
          const dataDir = join(tmp, "data");
          const taskQueue = "tq-" + randomUUID();
          const worker = await createRunnerWorker({
            adapters: scriptedRegistry,
            address: address!,
            taskQueue,
            dataDir,
            workflowBundlePath: bundlePath!,
            routerOptions: { baseUrls: { "openai-compat": wire.url } },
          });
          const workerDone = worker.run();
          const runner = createTemporalRunner({ address: address!, taskQueue, dataDir });
          cleanups.push(async () => {
            worker.shutdown();
            await workerDone;
            await runner.close();
          });
          return { repoUrl, dataDir, runner };
        }

        async function drive(upheld: boolean) {
          const ids = adjudicationIds();
          const escalating = () => judgeForm({ criteria: { "AC-1": true }, concerns: [CONCERN] });
          const review = () =>
            completionReviewForm({
              hasRegressionSuite: true,
              rubricFails: upheld ? ids : [],
            });
          const wire = await startFakeJudgeWire([escalating(), escalating()], {
            reviewForms: [review(), review()],
          });
          cleanups.push(() => wire.close());

          const { repoUrl, dataDir, runner } = await setup(wire);
          const spec = makeJudgedSpec({
            repoUrl,
            cadence: 1,
            maxSteps: 4,
            regressionSuite: "exit 0",
            unattended: { escalation: "seal_resumable_failed" },
          });
          const handle: RunHandle = await runner.start(spec);
          const report: RunStatusReport = await waitFor(
            async () => {
              const r = await handle.status();
              return TERMINAL_STATUSES.includes(r.status) ? r : undefined;
            },
            { what: "run to reach a terminal status" },
          );
          const journal = new Journal(journalPath(dataDir, handle.runId));
          const terminal = journal.entries("terminal").at(-1)!.payload as {
            status: string;
            reason?: string;
          };
          journal.close();
          return { report, terminal, wire, ids };
        }

        test("the run asks a question at all — the review carries an adjudication row", () => {
          expect(adjudicationIds().length).toBeGreaterThanOrEqual(1);
        });

        test("an answer that CLEARS the concerns seals SUCCESS, wording intact (traps A + C)", async () => {
          const { report, terminal, wire } = await drive(false);
          expect(report.status).toBe("SUCCESS");
          expect(terminal.reason).toContain("converged out-of-rubric escalation");
          expect(terminal.reason).toContain(CONCERN);
          expect(wire.reviewHits).toBe(1);
        }, 300_000);

        test("an answer that UPHOLDS a concern condemns, naming it (traps B + E)", async () => {
          const { report, terminal, wire, ids } = await drive(true);
          expect(report.status).toBe("FAILED");
          expect(ids.some((id) => (terminal.reason ?? "").includes(id))).toBe(true);
          expect(wire.reviewHits).toBe(1);
        }, 300_000);
      });
      `;
      writeFileSync(target, SRC);
      const res=spawnSync("pnpm",["exec","vitest","run",
        "test/runner/ac1-adjudicate.generated.test.ts"],{stdio:"inherit"});
      rmSync(target,{force:true});
      A(res.status===0,
        "two converged escalations carrying IDENTICAL concern text must reach OPPOSITE outcomes "+
        "when only the judge answer differs: cleared -> SUCCESS with the converged wording, "+
        "upheld -> FAILED naming the upheld item, each buying exactly one review pass. "+
        "vitest exited "+res.status);
      console.log("AC-1 OK: a converged out-of-rubric escalation is adjudicated once by the judge, "+
        "the outcome follows the ANSWER and not the wording, an evidence-shaped concern still "+
        "seals SUCCESS, and an upheld concern condemns with the item named");
      '

  - id: AC-2
    description: >
      The wiring the outcome test cannot see, plus the non-regressions. Reads the RAW
      completion-review request off the wire and requires the concern verbatim inside it (trap F);
      drives a converged escalation on a run that declares NO regression suite and still requires
      the adjudication to happen (trap G); and re-drives a non-deterministic completion-review
      finding to prove the F-334/WP-621 guard still condemns (trap H).
    check: |
      cd packages/sdk-ts && pnpm run typecheck && node --input-type=module -e '
      import {writeFileSync,rmSync} from "node:fs";
      import {spawnSync} from "node:child_process";
      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const target=join(process.cwd(),"test/runner/ac2-adjudicate-wiring.generated.test.ts");
      rmSync(target,{force:true});
      const SRC=`
      import { randomUUID } from "node:crypto";
      import { mkdtemp, rm } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { afterEach, describe, expect, inject, test } from "vitest";
      import {
        createRunnerWorker, createTemporalRunner, Journal, journalPath,
        COMPLETION_REVIEW_RUBRIC, RUBRIC_PRE_EXISTING_SUITE_GREEN,
        type RunHandle, type RunStatusReport,
      } from "../../src/index.js";
      import {
        completionReviewForm, initSourceRepo, judgeForm, makeJudgedSpec,
        scriptedRegistry, startFakeJudgeWire, TERMINAL_STATUSES, waitFor,
        type FakeJudgeWire,
      } from "./helpers.js";

      const address = inject("temporalAddress");
      const bundlePath = inject("workflowBundlePath");
      const KNOWN_TODAY = [
        "no_architecture_violations",
        "design_serves_overall_goal",
        "cumulative_design_coherent",
        RUBRIC_PRE_EXISTING_SUITE_GREEN,
      ];
      const adjudicationIds = (): string[] =>
        COMPLETION_REVIEW_RUBRIC.map((r) => r.id).filter((id) => !KNOWN_TODAY.includes(id));
      const CONCERN =
        "the helper introduced in this diff mishandles the empty case and the tests do not cover it";

      describe.skipIf(address === null)("AC-2: adjudication wiring and non-regressions", () => {
        const cleanups: Array<() => Promise<void>> = [];
        afterEach(async () => {
          while (cleanups.length > 0) await cleanups.pop()!();
        });

        async function setup(wire: FakeJudgeWire) {
          const tmp = await mkdtemp(join(tmpdir(), "chikory-ac2-adj-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const repoUrl = await initSourceRepo(join(tmp, "src"), {
            echoJudgeFeedback: true,
            claimsCompleteSteps: [1],
          });
          const dataDir = join(tmp, "data");
          const taskQueue = "tq-" + randomUUID();
          const worker = await createRunnerWorker({
            adapters: scriptedRegistry,
            address: address!,
            taskQueue,
            dataDir,
            workflowBundlePath: bundlePath!,
            routerOptions: { baseUrls: { "openai-compat": wire.url } },
          });
          const workerDone = worker.run();
          const runner = createTemporalRunner({ address: address!, taskQueue, dataDir });
          cleanups.push(async () => {
            worker.shutdown();
            await workerDone;
            await runner.close();
          });
          return { repoUrl, dataDir, runner };
        }

        async function drive(opts: {
          suite?: string;
          reviewFails: string[];
          concerns: string[];
        }) {
          const step = () =>
            opts.concerns.length > 0
              ? judgeForm({ criteria: { "AC-1": true }, concerns: opts.concerns })

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing. F-331 (dogfood-138): that seal now runs the declared
# `regression_suite` first. F-334 (dogfood-139): a non-deterministic finding on that pass now
# condemns instead of falling through to SUCCESS. This run adds the missing altitude — the
# escalation's OWN concerns.
unattended:
  escalation: seal_resumable_failed

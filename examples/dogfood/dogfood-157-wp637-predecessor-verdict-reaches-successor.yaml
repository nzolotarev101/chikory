# Plain: when a chain hands work from one agent to the next, the second agent gets a short written
# note about what the first one did. That note says "outcome: SUCCESS" even when the first agent's
# test suite was killed by the clock and nobody ever found out whether the code was good. The chain
# already writes that fact down and prints it for a human (WP-618, last run). It still never tells
# the next agent. After this run, the note the next agent reads names the check that never ran.
# WP: WP-637 (a dependent node's prompt must say its predecessor's gate never ran; F-396)
#     + WP-636 (the live chain record and the disk-restored one must agree; F-395) — entailed, see PRECEDENCE
# Ladder-rung: 0 (off-ladder - P3 rung-5's remaining half is WP-304, operator-run; see WHY)
# Thesis-KPI: compounding error (CLAUDE.md) - 95% per-step becomes ~5% end-to-end over 60 steps.
#   Measured as: does an unearned predecessor verdict reach the DEPENDENT AGENT's context, which is
#   the only altitude at which the next agent can act on it.
#
# THE MEASURED PREMISE - read out of the code at THIS review (F-203/F-342: measured, not
#   transcribed). Reproduce with:
#     grep -c inconclusive packages/sdk-ts/src/chain/compaction-note.ts      # -> 0
#     grep -n 'advanceChain(' packages/sdk-ts/src/chain/chain-loop.ts        # -> 349
#   WHAT WP-618 BUILT LAST RUN AND IT WORKS: the marker reaches the PERSISTED node_sealed entry
#   (src/chain/activities.ts:307) and THREE operator renderers name it (src/chain/read-trace.ts:45,
#   src/chain/trace.ts:17, src/cli/chain.ts:470). Do not undo any of it.
#   WHAT IS STILL FALSE, at two altitudes:
#     A. THE SUCCESSOR'S NOTE. `buildStructuredCompactionNote`
#        (src/chain/compaction-note.ts:29), called at src/chain/chain-loop.ts:254, is the ONLY
#        channel carrying a predecessor's outcome into the dependent node's prompt. It renders
#        exactly three fields: `outcome` (:37), `verdict` (:38), `changed_paths` (:39). A
#        successor's brief is BYTE-IDENTICAL whether its predecessor's suite passed or was killed
#        at the cap.
#     B. THE SOURCE THAT NOTE READS IS EMPTY IN A LIVE CHAIN. chain-loop.ts:254 passes
#        `record.nodeOutcomes[predecessor.id]`. That map has TWO truths today. Restored from disk,
#        `chainRecordFrom` merges the marker INTO the outcome (src/chain/store.ts:301). In the live
#        loop it never arrives: src/chain/chain-loop.ts:349 folds via `advanceChain(record, id,
#        outcome)` where `outcome` is `deriveNodeOutcome(status, verdict)`
#        (src/chain/activities.ts:254) and the marker rides BESIDE it on `NodeResult` (:262),
#        straight to the journal. So the field is populated after a `chikory chain resume` and
#        `undefined` on a chain that never resumed.
#
#   * THIS IS THE TRAP, AND IT IS THE WHOLE POINT OF THE RUN. The obvious one-line fix - read
#     `record.nodeOutcomes[pred.id].inconclusiveCheck` in the note - COMPILES, TYPECHECKS, and
#     PASSES any test that builds its record with `chainRecordFrom`. It is dead on every live
#     chain. B must be fixed for A to be real. AC-1 drives BOTH constructors and requires them to
#     agree; a delivery that fixes only the restored path fails it.
#   * FOURTH INSTANCE OF ONE FAMILY: F-380 (a re-constructor deleted the field), F-388 (a tail kept
#     then head-clamped), F-392 (the 4th adapter never crossed the shared seam), F-395 (two
#     reconstructors, one got the field). Assert where the value is CONSUMED, and when a durable
#     system has a live reducer AND a replay reconstructor, assert THEY AGREE.
#   * NOT IN SCOPE: `NodeOutcome`'s value set does not change (still no fourth status). The
#     run-level plumbing WP-615 built is untouched. The three WP-618 renderers keep working.
#     `reason` keeps carrying what it carries. No planner, plan gate, reducer status arithmetic,
#     budget arithmetic, Python mirror or TaskSpec change.
#   * THE SUITE THIS RUN MUST NOT BREAK, MEASURED at the launch commit by running it under devbox
#     (F-342 - run it yourself and read its own tail): 195 files passed | 2 skipped,
#     1603 passed | 23 skipped (1626 total).
#
# PRECEDENCE - two rules below can disagree about one node. When they do:
#   1. THE NOTE MUST NAME THE CHECK EVEN WHEN THE NOTE IS FULL. The note is BOUNDED
#      (DEFAULT_STRUCTURED_COMPACTION_NOTE_MAX_CHARS = 1_200, src/chain/compaction-note.ts:3) and
#      `changed_paths` is unbounded input. A marker appended AFTER a long path list is truncated
#      away and the fix is inert. The bound wins over completeness; the marker wins over
#      `changed_paths`. AC-2 collides them with a >1,200-char path list.
#   2. SILENCE STAYS SILENT. A predecessor whose checks all really ran produces a note that is
#      BYTE-IDENTICAL to today's five lines - no new key, no empty value, no "none". AC-1 pins that
#      note exactly, character for character.
#   3. THE DURABLE REPRESENTATION STAYS CANONICAL; THE IN-MEMORY ONE MAY MERGE. WP-618's judge
#      already ruled on this once: the marker has ONE durable home, top-level on the node_sealed
#      payload, and `test/chain/activities-inconclusive.test.ts` pins that the PERSISTED
#      `outcome` object does NOT carry it. `chainRecordFrom` (src/chain/store.ts:301) then merges
#      it INTO the outcome when rebuilding the in-memory record. Rule 1 of the goal makes the live
#      fold match that in-memory shape - so a delivery that reaches it by widening what
#      `readNodeResult` puts on `NodeResult.outcome` must ALSO keep it off the persisted payload's
#      outcome, or the committed WP-618 test goes RED. Two representations, one durable, one
#      reconstructed, and they must not be confused.
#
# Format: loose - the outcome (the successor's note names the check that never ran, on a chain that
#   never resumed) is fixed; where the marker sits in the note, how it is worded, and how the live
#   fold learns it are the executor's call. No AC greps a new symbol or field name (F-393).
#
# Launch mode: RUN (one value, two altitudes, one package).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-156 review, 2026-08-18):
#   `scripts/dogfood-progression.sh` reads **PROGRESSING** (max steps 3 vs 2), so the default
#   candidate is the current phase ladder rung - P3's ladder is WP-530 (plan.md section 7) and its
#   next rung is rung-5, whose remaining half is WP-304's OpenHands arm plus a corpus wide enough
#   to separate 19 requirements at 95 percent confidence. Re-checked against plan.md section 7 at
#   this review and still true. That is a quota-bound multi-hour benchmark suite the OPERATOR runs
#   by hand (dogfood-122's lesson - an LLM executor may not supervise it), so it cannot be a spec,
#   and has not been since dogfood-139. WP-637 beats it on runnable thesis value: it is product
#   code on the chain pillar (durable multi-run execution, WP-219), its premise was measured from
#   the code at this review, and it closes the compounding-error claim WP-618's own goal scoped out
#   - the seam the last spec forgot to enumerate. Rejected: WP-592 (F-268 - the capability entry
#   declares the executor `subscription-linked` with `zero-wire-cost`, so "$0.00 is wrong" is NOT
#   measured true) - WP-634 (F-382, harness-meta, section 1.5 track-B) - WP-633 (F-378, latent
#   behind an unreachable predicate) - F-397/F-398 (both informational, track-B).

name: dogfood-157-wp637-predecessor-verdict-reaches-successor
wp: WP-637

goal: |
  A chain node that depends on another node must be TOLD when its predecessor's verdict was never
  earned — when a check the predecessor declared never actually finished. Today it is not told, and
  the source it would be told from is empty on any chain that never resumed.

  Measured from the code at this review. WP-618 (last run) made the fact durable and
  operator-visible and it works — the marker reaches the persisted `node_sealed` entry
  (`src/chain/activities.ts:307`) and three renderers name it (`src/chain/read-trace.ts:45`,
  `src/chain/trace.ts:17`, `src/cli/chain.ts:470`). Two things are still false:

  - `buildStructuredCompactionNote` (`src/chain/compaction-note.ts:29`), called at
    `src/chain/chain-loop.ts:254`, is the ONLY channel carrying a predecessor's outcome into the
    dependent node's prompt, and it renders three fields: `outcome` (`:37`), `verdict` (`:38`),
    `changed_paths` (`:39`). `grep -c inconclusive` over that file returns **0**.
  - The map that note reads from has two truths. `chainRecordFrom` merges the marker into the
    outcome when a chain is restored from disk (`src/chain/store.ts:301`), but the live loop folds
    through `advanceChain(record, id, outcome)` (`src/chain/chain-loop.ts:349`) with the bare
    `{status, verdict}` that `deriveNodeOutcome` returns (`src/chain/activities.ts:254`), while the
    marker rides beside it on `NodeResult` (`:262`) straight to the journal.

  Make two things true.

  1. **The live chain record and the disk-restored chain record agree.** For the same sealed node,
     `ChainRecord.nodeOutcomes[id]` folded live through `advanceChain` and reconstructed from the
     chain journal through `chainRecordFrom` must be **equal** — including the inconclusive marker.
     A chain that never resumed must not know less about its own nodes than one that did.
  2. **The successor's structured note names the check that never ran.** The note
     `buildStructuredCompactionNote` produces for a predecessor whose declared check never finished
     names that check. A dependent agent reading its brief must be able to tell that the ground it
     is building on was never actually verified.

  Three things must NOT change, and each is a trap this run is graded on:

  1. **Silence stays silent, byte for byte.** A predecessor whose checks all really ran produces a
     note IDENTICAL to today's five lines — `node:`, `goal:`, `outcome:`, `verdict:`,
     `changed_paths:` — with no new key, no empty value and no "none". Its `nodeOutcomes` entry
     gains nothing either.
  2. **The note stays bounded, and the marker survives the bound.** The note is capped
     (`DEFAULT_STRUCTURED_COMPACTION_NOTE_MAX_CHARS`, `src/chain/compaction-note.ts:3`) and
     `changed_paths` is unbounded caller input. A marker appended after a long path list is
     truncated away and the whole fix is inert. The cap holds AND the marker is still named.
  3. **WP-618 is not undone, including its canonical durable representation.** The marker still
     reaches the persisted `node_sealed` entry and
     `chikory chain trace` still names it, and it stays **top-level on that payload**: the
     committed test pins that the PERSISTED `outcome` object does not carry it, while
     `chainRecordFrom` merges it in on the way back out. `NodeOutcome`'s value set still does not change — this
     is a marker on a sealed outcome, not a fourth status. `reason` keeps carrying what it carries
     (`src/chain/activities.ts:252`); the run-level plumbing WP-615 built
     (`src/runner/activities.ts:2976`, `src/journal/journal.ts:319`, `src/cli/trace.ts:437`) is out
     of scope.

  TypeScript stays strict ESM with named exports and no `any`. Do not touch the planner, the plan
  gate, the reducer's status arithmetic, the budget arithmetic, the Python mirror, or the TaskSpec
  contract.

  Pin your work with tests that live in the repo, beside the files they cover. A behaviour proved
  only by the acceptance checks that grade this run is not pinned at all (F-356), and a repo test
  copied verbatim from a grading check inherits its blind spots (F-360).

  **The obvious fix is dead code, and rejecting it is the point of this run.** Reading the marker
  off `record.nodeOutcomes[predecessor.id]` inside the note compiles, typechecks, and passes any
  test whose record came from `chainRecordFrom` — and does nothing on every live chain, because the
  live fold never put it there. This is the fourth instance of one family: F-380 (a re-constructor
  deleted an additive field), F-388 (a tail preserved then clamped one seam later), F-392 (the
  fourth adapter never crossed the shared seam), F-395 (two reconstructors, one got the field).
  When a durable system has a **live reducer** and a **replay reconstructor**, the invariant is not
  "each path works" — it is **"the two agree"**.

  Verify your work with FAST checks only: the package typecheck (`pnpm run typecheck` — NOT bare
  tsc --noEmit, which does not cover the test/ tree, F-382), eslint over the files you touched,
  and vitest over the directories you actually wrote into. Do NOT run the full vitest suite inside
  a step — it does not fit the step time cap (F-345).


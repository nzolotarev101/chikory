  - url: /Users/nikitazolotarev/repos/chikory
    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# MEASURE it at the launch commit rather than trusting this line (F-342, dogfood-140).
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE (does the next agent's note say the ground was never verified) AND
      ASSERTS AT THE CONSUMED SEAM. It seeds two REAL child-run journals on disk — one sealed with
      an inconclusive check, one clean — drives the REAL `readNodeResult` and `recordNodeSealed`,
      then builds the chain record BOTH WAYS: live through `advanceChain` exactly as
      `chain-loop.ts:349` does, and restored through `chainRecordFrom`. It requires the two to be
      EQUAL, then drives the REAL `buildStructuredCompactionNote` off each and requires both notes
      to name the check. A delivery that fixes only the restored path fails here. Traps: the clean
      node's note is asserted byte-exact against today's five lines, and both nodes still seal with
      their original status.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/chain/ac1-successor-note.generated.test.ts
      mkdir -p test/chain
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { mkdtemp } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { join } from "node:path";

      import { describe, expect, test } from "vitest";

      import { createChainActivities } from "../../src/chain/activities.js";
      import { advanceChain } from "../../src/chain/advance.js";
      import { buildStructuredCompactionNote } from "../../src/chain/compaction-note.js";
      import { ChainJournal, chainRecordFrom } from "../../src/chain/store.js";
      import { Journal } from "../../src/journal/journal.js";
      import { chainJournalPath, journalPath } from "../../src/runner/paths.js";
      import type { ChainRecord, Plan, TaskSpec } from "../../src/types.js";

      const MARKER = "pre_existing_suite_still_green";
      const TASK = { name: "t", goal: "g", budgetUsd: 10 } as unknown as TaskSpec;

      function node(id: string, dependsOn: string[]) {
        return {
          id,
          goal: "do " + id,
          acceptanceCriteria: [{ id: "AC-1", description: "d" }],
          dependsOn,
          budgetUsd: 5,
        };
      }

      function seedChild(dataDir: string, runId: string, inconclusive?: string): void {
        const j = new Journal(journalPath(dataDir, runId));
        j.createRun(runId, TASK);
        j.append({
          kind: "terminal",
          payload: {
            status: "SUCCESS",
            reason: "sealed",
            ...(inconclusive === undefined ? {} : { inconclusiveCheck: inconclusive }),
          },
          costDeltaUsd: 0,
          artifactRefs: [],
        });
        j.sealRun("SUCCESS");
        j.close();
      }

      describe("a dependent node is told its predecessor's gate never ran (WP-637/WP-636)", () => {
        test("the live and restored records agree, and the successor's note names the check", async () => {
          const dataDir = await mkdtemp(join(tmpdir(), "chikory-ac1-succnote-"));
          const chainId = "chain-ac1";
          const plan: Plan = {
            id: "plan-ac1",
            goal: "two nodes",
            nodes: [node("N-1", []), node("N-2", ["N-1"])],
            createdAt: new Date().toISOString(),
          };
          seedChild(dataDir, "run-killed", MARKER);
          seedChild(dataDir, "run-clean", undefined);

          const acts = createChainActivities({ dataDir });
          await acts.initChain({ chainId, plan });
          const killed = await acts.readNodeResult({ childRunId: "run-killed" });
          const clean = await acts.readNodeResult({ childRunId: "run-clean" });

          // Spread the WHOLE NodeResult: the check must not care what the field
          // is called, only that the fact travels (F-393).
          await acts.recordNodeSealed({ chainId, nodeId: "N-1", ...killed });
          await acts.recordNodeSealed({ chainId, nodeId: "N-2", ...clean });

          // LIVE fold — exactly the shape chain-loop.ts:349 uses.
          const empty: ChainRecord = {
            planId: plan.id,
            plan,
            nodeRuns: {},
            nodeOutcomes: {},
            nodeHandoffs: {},
            status: "RUNNING",
          };
          const live = advanceChain(
            advanceChain(empty, "N-1", killed.outcome),
            "N-2",
            clean.outcome,
          );

          // RESTORED fold — what a `chikory chain resume` rebuilds.
          const cj = new ChainJournal(chainJournalPath(dataDir, chainId));
          const restored = chainRecordFrom(cj);
          cj.close();
          expect(restored, "the chain journal must reconstruct").toBeDefined();

          // WP-636: one typed field, one truth.
          expect(
            live.nodeOutcomes["N-1"],
            "the LIVE fold must know exactly what the RESTORED fold knows about N-1 — a chain that never resumed must not know less about its own nodes",
          ).toEqual(restored?.nodeOutcomes["N-1"]);
          expect(
            live.nodeOutcomes["N-2"],
            "the two folds must also agree about a node with nothing to report",
          ).toEqual(restored?.nodeOutcomes["N-2"]);

          // WP-637: the note the DEPENDENT AGENT reads, from both records.
          const noteFor = (rec: ChainRecord | undefined, id: string): string =>
            buildStructuredCompactionNote({
              node: plan.nodes.find((n) => n.id === id)!,
              outcome: rec!.nodeOutcomes[id]!,
            });

          const liveNote = noteFor(live, "N-1");
          const restoredNote = noteFor(restored, "N-1");
          expect(
            liveNote,
            "the successor's note must name the check that never ran, on a chain that NEVER RESUMED: " +
              liveNote,
          ).toContain(MARKER);
          expect(
            restoredNote,
            "and on a chain rebuilt from its journal: " + restoredNote,
          ).toContain(MARKER);

          // TRAP: silence stays silent, byte for byte.
          expect(
            noteFor(live, "N-2"),
            "a predecessor whose checks really ran produces the note it produces today, unchanged",
          ).toBe(
            [
              "node: N-2",
              "goal: do N-2",
              "outcome: SUCCESS",
              "verdict: PROCEED",
              "changed_paths: (none recorded)",
            ].join("\n"),
          );

          // TRAP: a marker, not a fourth status.
          expect(live.nodeOutcomes["N-1"]?.status).toBe("SUCCESS");
          expect(live.nodeOutcomes["N-2"]?.status).toBe("SUCCESS");
          // TRAP: `reason` still carries what WP-521's retry brief reads.
          expect(killed.reason).toBe("sealed");
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: the live and restored chain records disagree, or the successor's note does not name the check that never ran, or a clean predecessor's note changed, or the outcome status set changed, or reason stopped being populated. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: both folds agree, and the note a dependent node reads says its predecessor's gate never ran"

  - id: AC-2
    description: >
      THIS CHECK COLLIDES THE TWO PRECEDENCE RULES. The note is bounded and `changed_paths` is
      unbounded caller input, so a marker appended AFTER the path list is truncated away and the fix
      is inert while every other check stays green. It drives the REAL
      `buildStructuredCompactionNote` with a handoff carrying well over the default cap of changed
      paths, and requires BOTH that the note respects the cap it is given AND that it still names
      the check. It also proves WP-618 is not undone: the marker still reaches the persisted
      `node_sealed` entry.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/chain/ac2-note-bound.generated.test.ts
      mkdir -p test/chain
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { mkdtemp } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { join } from "node:path";

      import { describe, expect, test } from "vitest";

      import { createChainActivities } from "../../src/chain/activities.js";
      import {
        DEFAULT_STRUCTURED_COMPACTION_NOTE_MAX_CHARS,
        buildStructuredCompactionNote,
      } from "../../src/chain/compaction-note.js";
      import { ChainJournal, chainRecordFrom } from "../../src/chain/store.js";
      import { Journal } from "../../src/journal/journal.js";
      import { chainJournalPath, journalPath } from "../../src/runner/paths.js";
      import type { ChainNodeHandoff, Plan, TaskSpec } from "../../src/types.js";

      const MARKER = "pre_existing_suite_still_green";
      const TASK = { name: "t", goal: "g", budgetUsd: 10 } as unknown as TaskSpec;

      describe("the successor's note stays bounded AND still names the check (WP-637)", () => {
        test("a path list far over the cap does not truncate the marker away", async () => {
          const dataDir = await mkdtemp(join(tmpdir(), "chikory-ac2-notebound-"));
          const chainId = "chain-ac2";
          const plan: Plan = {
            id: "plan-ac2",
            goal: "one node",
            nodes: [
              {
                id: "N-1",
                goal: "do N-1",
                acceptanceCriteria: [{ id: "AC-1", description: "d" }],
                dependsOn: [],
                budgetUsd: 5,
              },
            ],
            createdAt: new Date().toISOString(),
          };

          const j = new Journal(journalPath(dataDir, "run-killed"));
          j.createRun("run-killed", TASK);
          j.append({
            kind: "terminal",
            payload: { status: "SUCCESS", reason: "sealed", inconclusiveCheck: MARKER },
            costDeltaUsd: 0,
            artifactRefs: [],
          });
          j.sealRun("SUCCESS");
          j.close();

          const acts = createChainActivities({ dataDir });
          await acts.initChain({ chainId, plan });
          const killed = await acts.readNodeResult({ childRunId: "run-killed" });
          await acts.recordNodeSealed({ chainId, nodeId: "N-1", ...killed });

          // WP-618 must not be undone: the fact still reaches the DISK.
          const cj = new ChainJournal(chainJournalPath(dataDir, chainId));
          const sealed = cj.entries("node_sealed");
          const persisted = JSON.stringify(sealed.find(
            (e) => (e.payload as { nodeId?: string }).nodeId === "N-1",
          )?.payload ?? {});
          const restored = chainRecordFrom(cj);
          cj.close();
          expect(
            persisted,
            "TRAP: WP-618 is not undone — the persisted node_sealed entry still carries which check never ran",
          ).toContain(MARKER);

          // 400 paths of ~40 chars each = ~16,000 chars of unbounded caller input,
          // more than 13x the default cap.
          const changedPaths = Array.from(
            { length: 400 },
            (_unused, i) => "packages/sdk-ts/src/generated/file-" + String(i).padStart(4, "0") + ".ts",
          );
          const handoff = {
            summary: "did the thing",
            repos: [{ name: "chikory", changedPaths }],
          } as unknown as ChainNodeHandoff;

          const outcome = restored!.nodeOutcomes["N-1"]!;
          const note = buildStructuredCompactionNote({ node: plan.nodes[0]!, outcome, handoff });

          expect(
            note.length,
            "the note must respect its own default cap even with a huge path list: " + note.length,
          ).toBeLessThanOrEqual(DEFAULT_STRUCTURED_COMPACTION_NOTE_MAX_CHARS);
          expect(
            note,
            "TRAP: the marker must survive the bound — a fact appended after an unbounded path list is truncated away and the whole fix is inert: " +
              note.slice(0, 400),
          ).toContain(MARKER);

          // And with an explicit tighter cap, both properties still hold.
          const tight = buildStructuredCompactionNote({
            node: plan.nodes[0]!,
            outcome,
            handoff,
            maxChars: 300,
          });
          expect(tight.length, "an explicit cap is honored: " + tight.length).toBeLessThanOrEqual(300);
          expect(
            tight,
            "TRAP: the marker outranks changed_paths when space is short: " + tight,
          ).toContain(MARKER);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: the note busts its bound, or the marker is truncated away by an unbounded changed_paths list, or WP-618's persisted entry lost the marker. vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: the note stays bounded and the check that never ran outranks the path list"


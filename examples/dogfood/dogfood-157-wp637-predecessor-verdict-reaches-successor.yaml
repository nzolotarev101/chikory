      grep -qE 'report\.inconclusiveCheck = payload\.inconclusiveCheck' src/journal/journal.ts || {
        echo "AC-3 FAIL: trap — the run report no longer reads the terminal payload's inconclusive marker (src/journal/journal.ts:319). This WP does not touch the run level."
        exit 1
      }
      grep -qE 'inconclusive check' src/cli/trace.ts || {
        echo "AC-3 FAIL: trap — the chikory trace command's RUN-level inconclusive line (src/cli/trace.ts:437) moved or was deleted."
        exit 1
      }
      grep -qi 'inconclusive' src/chain/read-trace.ts || {
        echo "AC-3 FAIL: trap — WP-618's operator-facing chain trace line (src/chain/read-trace.ts:45) no longer names the inconclusive check. This WP ADDS the successor's note; it does not replace the operator's view."
        exit 1
      }
      grep -qE 'if \(terminal\?\.reason !== undefined\) result\.reason' src/chain/activities.ts || {
        echo "AC-3 FAIL: trap — readNodeResult stopped populating reason (src/chain/activities.ts:252). WP-521's retry brief reads it; the marker is an ADDITION, not a replacement."
        exit 1
      }
      grep -qE 'changed_paths' src/chain/compaction-note.ts || {
        echo "AC-3 FAIL: trap — changed_paths was removed from the structured note. The marker must fit ALONGSIDE the predecessor's changed paths, not replace them."
        exit 1
      }
      if grep -qE '"INCONCLUSIVE"' src/chain/activities.ts src/chain/store.ts src/chain/advance.ts src/types.ts; then
        echo "AC-3 FAIL: trap — NodeOutcome gained an INCONCLUSIVE status. This WP is a MARKER on a sealed outcome, not a fourth status: a new status reshapes advanceChain, the reducer, the gate and every fold."
        exit 1
      fi

      OUT=$(pnpm --filter @chikory/sdk exec vitest run 2>&1)
      ST=$?
      echo "$OUT" | tail -25
      if [ "$ST" -ne 0 ]; then
        echo "AC-3 FAIL: the DECLARED regression suite is RED (vitest exited $ST)"
        exit 1
      fi
      N=$(echo "$OUT" | grep -oE "Tests +[0-9]+ passed" | grep -oE "[0-9]+" | head -1)
      echo "committed suite tests passing: ${N:-UNPARSEABLE} (floor 1607, measured baseline 1603)"
      if [ -z "$N" ]; then
        echo "AC-3 FAIL: could not read a test count out of the vitest summary"
        exit 1
      fi
      if [ "$N" -lt 1607 ]; then
        echo "AC-3 FAIL: durability floor not met — the committed suite did not grow by at least 4 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356)."
        exit 1
      fi
      echo "AC-3 OK: strict typecheck and lint green, WP-615/WP-618 plumbing and the outcome value set untouched, DECLARED suite green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const target=join(process.cwd(),"test/runner/ac2-infra-kill.generated.test.ts");
      // Written and removed by THIS check; a leftover from a killed run is stale, not state.
      rmSync(target,{force:true});
      const SRC=`
      import { randomUUID } from "node:crypto";
      import { mkdir, mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { dirname, join } from "node:path";
      import { afterEach, describe, expect, inject, test } from "vitest";
      import {
        createRunnerWorker, createTemporalRunner, Journal, journalPath, STANDING_RUBRIC,
        COMPLETION_REVIEW_RUBRIC, RUBRIC_PRE_EXISTING_SUITE_GREEN,
        type AdapterRegistry, type JudgeForm, type RunStatusReport,
      } from "../../src/index.js";
      import {
        initSourceRepo, makeJudgedSpec, startFakeJudgeWire, TERMINAL_STATUSES, waitFor,
      } from "./helpers.js";

      const address = inject("temporalAddress");
      const bundlePath = inject("workflowBundlePath");
      const DECLARED_CAP_MS = 3000;

      // The command APPENDS to a marker file, so executions are counted from outside the run.
      // The failing text is CATted from a file: the justification already quotes the command
      // verbatim, so a token spelled inside the command would ride into the brief without a
      // single byte of OUTPUT having been carried (measured on dogfood-136 while arming).
      function countingCommand(
        markerPath: string, printPath: string | undefined, tail: string,
      ): string {
        const print = printPath === undefined ? "" : "cat " + printPath + "; ";
        return "echo x >> " + markerPath + "; " + print + tail;
      }

      function writingRegistry(seen: string[]): AdapterRegistry {
        return {
          scripted: (ctx) => ({
            name: "scripted",
            modelFamily: "anthropic" as const,
            async runStep(input) {
              seen.push(input.context.judgeFeedback ?? "");
              const file = join(input.workspaceDir, "src/feature.ts");
              await mkdir(dirname(file), { recursive: true });
              await writeFile(file, "export const feature = 1;\\n");
              const [diffRef, transcriptRef] = await Promise.all([
                ctx.store.put("adapter diff", { kind: "diff", summary: "adapter diff" }),
                ctx.store.put("adapter transcript", { kind: "transcript", summary: "t" }),
              ]);
              return {
                status: "SUCCESS" as const, diffRef, transcriptRef, claimsComplete: true,
                summary: "wrote src/feature.ts", toolCalls: 1,
                tokens: { input: 100, output: 50 },
                costUsd: 0.01, costEstimated: false, durationMs: 0,
              };
            },
          }),
        };
      }

      // Every item answered PASS on purpose — the suite row included — so only a delivery that
      // lets the COMMAND settle it, and the SEAL read its infra flag, can change the outcome.
      const stepForm = (): JudgeForm => ({
        criterionResults: [{ id: "AC-1", pass: true, justification: "scripted judge" }],
        rubricResults: [
          ...STANDING_RUBRIC.map((r) => ({
            id: r.id, pass: true, justification: "scripted — the model says this is fine",
          })),
          { id: RUBRIC_PRE_EXISTING_SUITE_GREEN, pass: true, justification: "model says fine" },
        ],
        concerns: [],
      });
      const reviewForm = (): JudgeForm => ({
        criterionResults: [],
        rubricResults: [
          ...COMPLETION_REVIEW_RUBRIC.map((r) => ({
            id: r.id, pass: true, justification: "scripted review",
          })),
          { id: RUBRIC_PRE_EXISTING_SUITE_GREEN, pass: true, justification: "model says fine" },
        ],
        concerns: [],
      });

      describe.skipIf(address === null)("AC-2 — the infra kill and the reserved brief", () => {
        const cleanups: Array<() => Promise<void>> = [];
        afterEach(async () => { while (cleanups.length > 0) await cleanups.pop()!(); });

        async function runOne(command: string) {
          const seen: string[] = [];
          const wire = await startFakeJudgeWire(
            [stepForm(), stepForm(), stepForm(), stepForm()],
            { reviewForms: [reviewForm(), reviewForm()] },
          );
          cleanups.push(() => wire.close());
          const tmp = await mkdtemp(join(tmpdir(), "ac2-infra-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const repoUrl = await initSourceRepo(join(tmp, "src"), {});
          const dataDir = join(tmp, "data");
          const taskQueue = "tq-" + randomUUID();
          const worker = await createRunnerWorker({
            adapters: writingRegistry(seen), address: address!, taskQueue, dataDir,
            workflowBundlePath: bundlePath!,
            routerOptions: { baseUrls: { "openai-compat": wire.url } },
          });
          const workerDone = worker.run();
          const runner = createTemporalRunner({ address: address!, taskQueue, dataDir });
          cleanups.push(async () => {
            worker.shutdown(); await workerDone; await runner.close();
          });
          const spec = {
            ...makeJudgedSpec({ repoUrl, cadence: 1, maxSteps: 4 }),
            regressionSuite: command,
            checkTimeoutMs: DECLARED_CAP_MS,
          } as unknown as Parameters<typeof runner.start>[0];
          const startedAt = Date.now();
          const handle = await runner.start(spec);
          const report = await waitFor(async () => {
            const r: RunStatusReport = await handle.status();
            return TERMINAL_STATUSES.includes(r.status) ? r : undefined;
          }, { what: "terminal status", timeoutMs: 180_000, intervalMs: 1000 });
          const elapsedMs = Date.now() - startedAt;
          const j = new Journal(journalPath(dataDir, handle.runId));
          let entries: { verdicts: string[]; steps: number };
          try {
            entries = {
              verdicts: j.entries("verdict").map((e) => JSON.stringify(e.payload)),
              steps: j.entries("step").length,
            };
          } finally { j.close(); }
          return { report, ...entries, seen, elapsedMs, runId: handle.runId, dataDir };
        }

        test("scenario 1 — a cap-killed suite is killed at the DECLARED cap and does not condemn the code", async () => {
          const tmp = await mkdtemp(join(tmpdir(), "ac2-marker-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const marker = join(tmp, "runs.txt");
          const r = await runOne(countingCommand(marker, undefined, "sleep 90; exit 0"));

          // trap C: if the declared cap never reached the check, the 120 s default governed and
          // the whole run cannot have finished this fast. Wall-clock is the oracle.
          expect(r.elapsedMs).toBeLessThan(110_000);
          // the record keeps the evidence: a non-pass, flagged infra.
          const infra = r.verdicts.filter((v) => v.includes("infraFailed"));
          expect(infra.length).toBeGreaterThan(0);
          // trap A: the row is NOT scored green.
          for (const v of infra) {
            expect(v).not.toMatch(
              new RegExp('"id":"' + RUBRIC_PRE_EXISTING_SUITE_GREEN + '","pass":true'));
          }
          // the seal must not read as a code red.
          expect(JSON.stringify(r.report)).not.toContain("deterministic rubric failure");
          expect(TERMINAL_STATUSES).toContain(r.report.status);
          expect(r.verdicts.some((v) => v.includes("\\"ROLLBACK\\""))).toBe(false);
          const kept = await readFile(
            join(r.dataDir, "runs", r.runId, "workspace", "src", "feature.ts"), "utf8");
          expect(kept).toContain("feature");
        }, 300_000);

        test("scenario 2 — a genuine red still condemns, and the repair still sees the output", async () => {
          const tmp = await mkdtemp(join(tmpdir(), "ac2-marker-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const marker = join(tmp, "runs.txt");
          const token = "SUITEFAIL" + randomUUID().replace(/-/g, "");
          const failFile = join(tmp, "suite-output.txt");
          await writeFile(
            failFile, "FAILED test/widget.test.ts > it does the thing\\n" + token + "\\n");
          const r = await runOne(countingCommand(marker, failFile, "exit 1"));

          // trap B: an ordinary nonzero exit is still a code red and still blocks.
          expect(r.report.status).not.toBe("SUCCESS");
          expect(JSON.stringify(r.report)).toContain("deterministic rubric failure");
          // WP-611 unregressed: the repair sees the OUTPUT, not just the exit code.
          const carrying = r.seen.filter((b) => b.includes(token));
          expect(carrying.length).toBeGreaterThan(0);
          for (const brief of carrying) expect(/only design/i.test(brief)).toBe(false);
          expect(r.verdicts.some((v) => v.includes("\\"ROLLBACK\\""))).toBe(false);
          const runs = (await readFile(marker, "utf8")).trim().split("\\n").filter(Boolean);
          expect(runs.length).toBeLessThanOrEqual(2);
        }, 300_000);

        test("scenario 3 — a green suite still seals SUCCESS, once, scored only at the review", async () => {
          const tmp = await mkdtemp(join(tmpdir(), "ac2-marker-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const marker = join(tmp, "runs.txt");
          const r = await runOne(countingCommand(marker, undefined, "exit 0"));
          expect(r.report.status).toBe("SUCCESS");
          const runs = (await readFile(marker, "utf8")).trim().split("\\n").filter(Boolean);
          expect(runs).toHaveLength(1);
          const scored = r.verdicts.filter((v) => v.includes(RUBRIC_PRE_EXISTING_SUITE_GREEN));
          expect(scored).toHaveLength(1);
        }, 300_000);

      });
      `;
      writeFileSync(target, SRC);
      const res=spawnSync("pnpm",["exec","vitest","run",
        "test/runner/ac2-infra-kill.generated.test.ts"],{stdio:"inherit"});
      // Clean up BEFORE asserting — A() exits the process, which would skip a finally block
      // and leave the generated file behind to poison the next pass.
      rmSync(target,{force:true});
      A(res.status===0,
        "trap C: scenario 1 times the REAL run against the cap it DECLARED — a spec field the "+
        "runner never plumbs leaves the 120 s default in force and blows the wall-clock "+
        "assertion. Scenarios 2-3 read the seal reason and the brief off the REAL journal of a "+
        "REAL Temporal run. vitest exited "+res.status);
      console.log("AC-2 OK: a killed suite is killed at the spec cap and does not condemn the "+
        "code, a real red still condemns and still briefs the repair with its output, and a "+
        "green one still seals SUCCESS with exactly one execution and one scored row");
      '

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): a converged out-of-rubric escalation — every criterion and every rubric item
# passing — auto-seals SUCCESS with this policy present, instead of parking overnight for a human.
unattended:
  escalation: seal_resumable_failed

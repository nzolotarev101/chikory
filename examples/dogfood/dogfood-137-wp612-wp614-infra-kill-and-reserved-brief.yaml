# Plain: the last two runs built a gate that runs the repository's own tests before a delivery is
# allowed to succeed. Two things about it are still wrong. If the test command is KILLED for taking
# too long, the run is sealed FAILED exactly as if the code were broken — and the 120-second limit
# it is killed at cannot be changed by the spec, so a project with a slow suite can never use the
# gate at all. And when the gate does block, the failing-test text it hands the repair step gets cut
# off the end of the brief as soon as two design complaints share the page. This run fixes both.
# WP: WP-612 (an infra kill is not a code red at the seal) + WP-614 (a repair brief RESERVES room
#     for the failing tests)
# Ladder-rung: 0 (OFF-LADDER by necessity — rung 5 is operator-gated today; see WHY)
# Thesis-KPI: judge true-positives pre-land, and the SECOND live proof of the WP-609 gate — this
#   spec declares `regression_suite:`, so its own journal must again show the row settled from a real
#   exit code, AND (WP-613, live for the first time) NO per-step judge pass may carry that row at all.
# Format: loose — the outcomes are fixed, the wiring is the executor's
#
# Launch mode: RUN (single node — two defects in one gate, the shape dogfood-136 proved in 1 step).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-136 review, 2026-08-12):
#   Progression gate: ✅ PROGRESSING. The default headline is P3-rung-5, the phase exit gate. Its two
#   blockers were RE-MEASURED AGAIN this review (not re-litigated) and both still stand, both
#   OPERATOR work rather than product gaps:
#     1. `brownfield-001`'s zod v3 → v4 gold patch. MEASURED 2026-08-12: `find benchmarks/tasks -name
#        '*brownfield-001*'` returns ONLY
#        `benchmarks/tasks/brownfield-001-dependency-major-upgrade.yaml`, whose only status line is
#        `status: pinned` (:24) with no `fix_ref` and no gold artifact. 3–6 h of operator research.
#     2. A re-run of BOTH arms so stored per-task results carry `repoRef`. MEASURED 2026-08-12:
#        `grep -rl repoRef benchmarks/results/ | wc -l` = **0**. Hours of quota, and dogfood-122
#        proved an LLM executor must not supervise a quota-bound multi-hour suite.
#
#   SEVENTH consecutive off-ladder headline, and the last one owed to this detour. Rung 5 exists to
#   publish a reliability number. The gate that decides whether a run is allowed to call itself
#   reliable currently (a) fails a run because its own test command was slow, and (b) throws away the
#   evidence it just collected. Both are MEASURED below; both are the last two open defects opened by
#   dogfood-135/136 against WP-609.
#
# THE MEASURED PREMISE (re-measure before building; do not re-litigate):
#   * **F-320 — a cap kill seals FAILED as a code red.** `deterministicFails` filters ONLY on
#     `DETERMINISTIC_RUBRIC_IDS.has(f.id)` (`src/workflow/agent-loop.ts:1102-1104` and the sealing
#     path `:1121-1123`); the row's `infraFailed` flag is never consulted, so a killed suite returns
#     `seal("FAILED", "completion review: deterministic rubric failure — …")`. The WP-263(b)
#     infra-skip that already encodes the right rule reads `form.criterionResults` ONLY
#     (`src/judge/verdict.ts:99-103`) — RUBRIC rows have no equivalent.
#   * **The record is already correct; only the SEAL is wrong.** `applyCheckOverrides` sets
#     `infraFailed: true` and a justification saying `DID NOT COMPLETE (killed at the per-check cap)
#     — infra failure, not a code red` (`src/judge/harness.ts:203-216`). The information exists. The
#     seal ignores it.
#   * **The cap cannot be chosen by a spec.** MEASURED 2026-08-12:
#     `grep -rn 'checkTimeoutMs|check_timeout' src/taskspec.ts src/types.ts src/schemas.ts
#     src/chain/node-spec.ts` returns **nothing**. `checkTimeoutMs` exists on `RunJudgePassInput`
#     (`src/judge/harness.ts:275`) and threads to `collectEvidence` (`:297`), which falls back to
#     `DEFAULT_CHECK_TIMEOUT_MS = 120_000` (`src/judge/evidence.ts:37,326,339`) — but NOTHING in
#     `src/runner/activities.ts` ever sets it. The parameter is a wire with no source: the classic
#     F-283 unfed pipeline, already half-built.
#   * **F-323 — the excerpt is bounded, not reserved.** `COMPLETION_BRIEF_MAX_CHARS` is 2000
#     (`src/workflow/completion-review.ts:19`) and the clamp truncates the TAIL (`:137-139`); the
#     excerpt is bounded at 1000 (`src/judge/harness.ts:208`) and `effectiveRubric` appends the suite
#     row LAST (`src/runner/activities.ts:1690`), so the excerpt is FIRST against the cut. MEASURED
#     against the built `dist/` with realistic ~353-char design justifications: 0 co-occurring design
#     findings → 1491 chars, intact · 1 → 1844, intact · **2 → clamped at exactly 2000, losing the
#     `Test Files 2 failed` summary line, half of a failing test name, and the closing instruction.**
#   * **F-324 — both oracles that looked at F-323 were blind, and the same blindness must not
#     repeat.** `test/runner/completion-review.test.ts:282-292` asserts only `brief.length <= 2000` —
#     it proves the clamp FIRES, never that a finding SURVIVES it. dogfood-136's AC-2 scenario 1 drove
#     `reviewForm(designPass = true)`, so a red suite and a design finding never co-occurred. AC-1
#     below therefore drives the CO-OCCURRENCE family explicitly, at 0/1/2/3 design findings.
#   * **Raising a cap is not a fix.** Both caps here are context-discipline budgets (CM-3). The brief
#     must RESERVE room within 2000; the per-check cap must become SPEC-CHOSEN, not larger by default.
#     A delivery that changes `COMPLETION_BRIEF_MAX_CHARS` or `DEFAULT_CHECK_TIMEOUT_MS` fails AC-1.
#   * **The `unattended:` block below is not decoration** (F-322): without it a converged
#     out-of-rubric escalation parks for a human instead of auto-sealing
#     (`src/workflow/agent-loop.ts:1213-1224`). dogfood-135 parked 11h 59m 31s for want of it.
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. **Making an infra-killed row PASS.** The cheapest way to stop it sealing FAILED is to score it
#      green — which resurrects the unmeasured green WP-613 just abolished. AC-1 requires the row to
#      stay `pass: false` WITH `infraFailed: true` in the record, and only the SEAL to change.
#   B. **Skipping every failing deterministic row at the seal.** A genuine code red (`exitCode 1`,
#      `infraFailed` absent) must STILL seal FAILED. AC-1 and AC-2 both re-assert it.
#   C. **A spec-settable cap that never reaches the check** — declared in `src/taskspec.ts` and never
#      plumbed to `collectEvidence`, so the 120 s default still governs (the F-283 shape, and the
#      exact half-built state the field is in today). AC-2 drives a REAL run whose suite would take
#      far longer than the cap it declares and requires the kill to happen at the DECLARED cap.
#   D. **Raising a cap instead of reserving/plumbing.** AC-1 pins `COMPLETION_BRIEF_MAX_CHARS === 2000`
#      and `DEFAULT_CHECK_TIMEOUT_MS === 120_000` as unchanged constants.
#   E. **Reserving room by dropping the design findings.** The inverse squeeze. AC-1 requires EVERY
#      failing item id, the suite output TAIL, and the closing instruction to all survive together.
#   F. **Reserving room by shortening the excerpt to nothing.** A 20-character excerpt always fits and
#      names no test. AC-1 requires the failing test NAMES from the tail of a 4 KB output to survive
#      at 3 co-occurring design findings.
#   G. **Proving it with `length <= 2000` again** (the F-324 defect wearing the fix as a costume), or
#      with a test the executor authors. AC-1 owns its oracle against the real built artifact and
#      asserts SURVIVAL, not size; AC-2 reads the REAL journal of a REAL Temporal run.
#
# NOT IN SCOPE: making `regression_suite` required (track-B); the WP-606/F-306 executor-summary
# telemetry (a separate run); a launcher precheck for a missing `unattended:` block (track-B, F-322);
# `tests_pass` and its JD-4 override (`src/judge/harness.ts:148-171` unchanged); the WP-607 items;
# the WP-611 framing branch, which must keep exactly today's behavior.

name: dogfood-137-wp612-wp614-infra-kill-and-reserved-brief
wp: WP-612
goal: >
  A gate must not fail a run for being slow, and must not throw away the evidence it just collected.

  dogfood-135 built the regression-suite gate and dogfood-136 taught it to brief its own repair. Two
  defects in it remain, both measured. First, when the declared command is KILLED at the per-check
  cap, the run seals FAILED with the reason "deterministic rubric failure" — the same seal a genuinely
  broken build gets — even though the rubric row already records `infraFailed: true` and says in words
  that this is "an infra failure, not a code red". And the cap itself is a fixed 120 seconds that no
  spec can change, so any project whose suite runs longer simply cannot use the gate. Second, the
  failing-test excerpt the repair step is handed is bounded at 1000 characters against a 2000-character
  brief that is truncated from the END, and the suite row is rendered LAST — so two ordinary design
  findings on the same page push the failing tests off the bottom.

  Make these true:

    * **A killed check is inconclusive at the seal, not a verdict.** A failing deterministic rubric
      row that is marked `infraFailed` must not produce the `FAILED` seal that a code-red row
      produces. The run's outcome must say the check DID NOT COMPLETE rather than that the code is
      broken, and the row must still appear in the record as a non-pass carrying `infraFailed: true` —
      the evidence is preserved, only its authority to condemn the code is withdrawn. This is the
      WP-263(b) rule that already governs criterion rows (src/judge/verdict.ts:99-103), extended to
      the rubric rows that now carry machine-settled evidence.

    * **A genuine red still seals FAILED.** A deterministic rubric row failing on a real nonzero exit
      code, with no infra kill, keeps exactly today's behavior on both seal paths.

    * **A spec chooses the cap its own checks are measured against.** The per-check timeout becomes a
      declarable spec field that reaches the check that actually runs — parsing on the public surface,
      surviving the workflow schema round-trip and chain-node templating the way `regression_suite`
      does, and arriving at the evidence collector so both the acceptance checks and the regression suite
      are measured against it. Absent, today's 120 s default is unchanged.

    * **The repair brief RESERVES room for the failing tests.** The suite excerpt's budget is computed
      from the room actually left after the header, the other failing findings and the closing line —
      so that with several design findings on the page the brief still names the failing item, still
      carries the TAIL of the command's own output (where the test names are), still lists every other
      failing finding, and still ends with its closing instruction. Neither cap may be raised:
      `COMPLETION_BRIEF_MAX_CHARS` stays 2000 and `DEFAULT_CHECK_TIMEOUT_MS` stays 120000.

  Everything WP-609/WP-611/WP-613 proved stays proven, and the acceptance criteria re-assert it: the
  command runs at the seal and never on a per-step pass, exactly once on a clean run and at most twice
  with the repair; `pre_existing_suite_still_green` belongs to NEITHER default rubric and joins the
  effective rubric only on the completion review of a run that declares a suite; the override still
  ERRORS when the item is declared with no evidence; a red suite still blocks SUCCESS non-destructively
  with no ROLLBACK verdict and the files left on disk; the REPAIR BRIEF still omits the design-only
  instruction while an ordinary design finding keeps today's wording exactly; a failing DESTRUCTIVE
  standing item still returns ROLLBACK (CONTRACTS.md §4 rule 1).

  If an existing test pins a shape this change must alter, update its expectation and say plainly in
  the step summary that you did — do not delete it, and do not weaken it into a tautology.

  Constraints: TypeScript stays strict ESM with named exports and no `any`; no new dependency, no
  provider SDK, no API key, no global install. Workflow code stays deterministic and replay-safe.
  src/types.ts is the CORE layer — it must not import from src/judge/, src/workflow/ or src/runner/.
  Project commands run sequentially inside the already-activated Devbox environment, so invoke pinned
  tools directly and never nest `devbox run`.

  VERIFY YOUR OWN WORK: before you finish, run `pnpm run build`, `pnpm run lint`, `pnpm run typecheck`
  (which compiles the TEST project too) and the FULL test suite, and report the ACTUAL command you ran
  and the ACTUAL counts it printed. The full sdk-ts suite takes ~50 s. Do not write that the suite
  passed unless you invoked it and read its total line. Run each of those FOUR commands once and read
  its own output — do not re-run one command four times under four different names (F-325). This run
  also declares its own `regression_suite`, so a red judge/workflow test will block the seal whatever
  your summary says.


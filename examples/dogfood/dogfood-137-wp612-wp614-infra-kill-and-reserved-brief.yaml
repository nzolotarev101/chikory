        JSON.stringify(designOnly));

      // 5. the SEAL decision — infra is inconclusive, a real red still condemns (traps A + B).
      const sealForm=(infra)=>({criterionResults:[{id:"AC-1",pass:true,justification:"ok"}],
        rubricResults:rubric.map((r)=>({id:r.id,pass:r.id!==NEW,justification:"scripted",
          ...(r.id===NEW&&infra?{infraFailed:true}:{})})),concerns:[]});
      for(const infra of [false,true]){
        const v=computeVerdict(sealForm(infra),{},rubric);
        A(v.kind!=="ROLLBACK","a failing "+NEW+" must NEVER roll back (infra="+infra+"), got "+
          JSON.stringify(v));
      }
      A(computeVerdict({criterionResults:[{id:"AC-1",pass:true,justification:"ok"}],
        rubricResults:STANDING_RUBRIC.map((r)=>({id:r.id,
          pass:r.id!=="no_secrets_introduced",justification:"scripted"})),concerns:[]},
        {},STANDING_RUBRIC).kind==="ROLLBACK",
        "a failing DESTRUCTIVE standing item must still return ROLLBACK (CONTRACTS.md §4 rule 1)");

      // 6. the spec field parses, round-trips, and is NOT the default (trap C, half of it).
      const base=["name: probe","goal: do a thing","repos:","  - url: /tmp/probe-repo",
        "    writable: true","acceptance_criteria:","  - id: AC-1","    description: d",
        "    check: \"true\"","budget_usd: 1","max_steps: 1","agent_classes:",
        "  executor: executor-default","  judge: judge-default","judge:","  cadence: 1"];
      const spec=parseTaskSpec([...base,"regression_suite: echo probe",
        "check_timeout_ms: 7000"].join("\n"));
      const asJson=JSON.stringify(spec);
      A(asJson.includes("7000"),
        "the per-check cap must be declarable in the spec — parseTaskSpec dropped it. Got "+asJson);
      A(JSON.stringify(TaskSpecSchema.parse(JSON.parse(asJson))).includes("7000"),
        "it must survive the src/schemas.ts WORKFLOW round-trip, or a Temporal run never sees it");
      A(!JSON.stringify(parseTaskSpec(base.join("\n"))).includes("120000"),
        "an ABSENT field must stay absent, not be materialised as an explicit 120000 default");
      const det=new Set(Array.from(DETERMINISTIC_RUBRIC_IDS));
      A(det.has(NEW)&&det.has("no_architecture_violations")&&det.has("no_secrets_introduced")&&
        !det.has("tests_pass"),
        "WP-607/609 regression: the machine-settled set is unchanged. Got "+
        JSON.stringify([...det]));

      console.log("AC-1 OK: a cap-killed row stays a flagged non-pass and never rolls back, the "+
        "repair brief keeps the failing test names AND every other finding AND its closing line "+
        "at 0/1/2/3 co-occurring design findings inside an unchanged 2000-char budget, and the "+
        "per-check cap is spec-declarable without moving the 120 s default");
      '

  - id: AC-2
    description: >
      THE REAL LOOP, THE REAL SEAL, THE REAL JOURNAL — three live Temporal scenarios written from the
      repo test infrastructure. Scenario 1: a run declaring `check_timeout_ms: 3000` and a suite that
      sleeps far past it — the check must be killed AT THE DECLARED CAP (trap C: a field the runner
      never plumbs leaves the 120 s default in force, and the scenario's own wall-clock proves which
      one governed), the journaled row must carry `infraFailed`, and the run must NOT seal with the
      code-red reason; it must reach terminal unattended with no ROLLBACK and its files on disk.
      Scenario 2: the identical run whose suite exits nonzero after printing a unique marker still
      seals non-SUCCESS with the code-red reason, and the repair brief the EXECUTOR is handed still
      carries that marker — trap B, plus WP-611 unregressed. Scenario 3: the suite exits 0 and the run

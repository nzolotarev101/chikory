# WP-609, live, for the second time. The pre-existing judge + workflow tests are the suite this run
# must not break, and the exact surface it edits. Timed at HEAD 2026-08-12:
# `20 passed | 1 skipped (21 files) · 138 passed | 12 skipped (150 tests)` in **4.32 s** against the
# fixed 120 s cap — 27x margin, and F-320 (a cap kill seals FAILED) is exactly what this run removes.
#
# DELIBERATELY ABSENT: `check_timeout_ms:`. `parseTaskSpec` is `.strict()`, so a spec that BUILDS a
# new input field cannot also DECLARE it in the YAML that launches the run — the launch would be a
# parse error at HEAD before a single step ran. The field is proven where a not-yet-existing field
# can be proven: AC-1 §6 (parse + workflow round-trip + absent-stays-absent) and AC-2 scenario 1,
# which sets it on a live run and times the kill against it.
regression_suite: pnpm --filter @chikory/sdk exec vitest run test/judge test/workflow

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE — RED on HEAD, green only once an infra-killed deterministic row
      stops condemning the code and the brief reserves room for its evidence. Every input family and
      every expected answer is written HERE. The brief is driven at 0, 1, 2 and 3 co-occurring design
      findings against a 4 KB suite output (the F-324 fix: dogfood-136 drove only the 0 case), and at
      every count the brief must name the failing item, carry the TAIL of the output where the test
      names live, list EVERY other failing finding, keep the closing instruction, and stay within an
      UNCHANGED 2000-char cap. Both caps are pinned as constants so trap D cannot pass. The infra/red
      distinction is asserted on the settled row and on the seal decision; the WP-609/611/613
      guarantees are re-asserted whole. Runs in seconds against the real built artifact.
    check: |
      cd packages/sdk-ts && pnpm run typecheck && pnpm exec tsc && \
      OPENAI_COMPAT_BASE_URL=http://127.0.0.1:9 node --input-type=module -e '
      import {pathToFileURL} from "node:url";
      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const here=process.cwd();
      const load=(p)=>import(pathToFileURL(join(here,p)).href);
      const mod=await load("dist/index.js");
      const cr=await load("dist/workflow/completion-review.js");
      const ev=await load("dist/judge/evidence.js");
      const {parseTaskSpec,computeVerdict,STANDING_RUBRIC,COMPLETION_REVIEW_RUBRIC,
             DETERMINISTIC_RUBRIC_IDS,TaskSpecSchema,applyCheckOverrides,
             RUBRIC_PRE_EXISTING_SUITE_GREEN,RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM}=mod;
      const {buildCompletionReviewBrief}=cr;
      const NEW=RUBRIC_PRE_EXISTING_SUITE_GREEN;
      A(typeof buildCompletionReviewBrief==="function"&&typeof applyCheckOverrides==="function"&&
        typeof computeVerdict==="function"&&NEW==="pre_existing_suite_still_green",
        "the WP-609/611/613 public surface must stay intact");

      // 0. trap D — neither budget may be raised. Both are CM-3 context discipline.
      A(ev.DEFAULT_CHECK_TIMEOUT_MS===120000,
        "trap D: the per-check DEFAULT must stay 120000 — the fix is a SPEC-CHOSEN cap, not a "+
        "bigger one. Got "+JSON.stringify(ev.DEFAULT_CHECK_TIMEOUT_MS));
      const CAP=2000;

      // 1. WP-613 regression — the item belongs to NEITHER default rubric.
      A(!STANDING_RUBRIC.some((r)=>r.id===NEW)&&!COMPLETION_REVIEW_RUBRIC.some((r)=>r.id===NEW),
        "WP-613 regression: no default rubric may carry "+NEW+". Got "+
        JSON.stringify([STANDING_RUBRIC.map((r)=>r.id),COMPLETION_REVIEW_RUBRIC.map((r)=>r.id)]));
      const rubric=[...COMPLETION_REVIEW_RUBRIC,RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM];
      const crit=[{id:"AC-1",description:"d",check:"true"}];
      const modelForm=()=>({criterionResults:[{id:"AC-1",pass:true,justification:"m"}],
        rubricResults:rubric.map((r)=>({id:r.id,pass:true,justification:"model says fine"})),
        concerns:[]});
      A("error" in applyCheckOverrides(modelForm(),crit,rubric,[],[],[],undefined),
        "WP-613 regression: the item declared with NO evidence must still be a wiring ERROR");

      // 2. the settled row: a cap kill is a NON-pass that is flagged infra (trap A).
      const settle=(run)=>{
        const out=applyCheckOverrides(modelForm(),crit,rubric,[],[],[],run);
        A(!("error" in out),"applyCheckOverrides must accept the run, got "+JSON.stringify(out));
        return out.form.rubricResults.find((r)=>r.id===NEW);
      };
      const CMD="pnpm --filter @chikory/sdk exec vitest run test/judge test/workflow";
      const TAIL="FAILED test/judge/harness.test.ts > settles the row\n"+
        "FAILED test/workflow/completion-review.test.ts > reserves room\n"+
        " Test Files  2 failed | 173 passed (177)";
      const BIG="noise line\n".repeat(380)+TAIL;
      A(BIG.length>4000,"the probe output must exceed 4 KB, got "+BIG.length);
      const red=settle({criterionId:NEW,command:CMD,exitCode:1,output:BIG,durationMs:4000,
        infraFailed:false});
      A(red!==undefined&&red.pass===false,"WP-609 regression: a nonzero suite must settle FAILED");
      const killed=settle({criterionId:NEW,command:CMD,exitCode:1,
        output:"[check timed out after 90000ms]",durationMs:90000,infraFailed:true});
      A(killed!==undefined&&killed.pass!==true&&killed.infraFailed===true,
        "trap A: a cap-killed row must stay a NON-pass carrying `infraFailed: true` — scoring it "+
        "green resurrects the unmeasured green WP-613 abolished. Got "+JSON.stringify(killed));

      // 3. THE F-323 FIX — the excerpt must SURVIVE, not merely fit, at every finding count.
      const DESIGN="The cumulative diff introduces a second composition seam for rubric items that "+
        "duplicates the responsibility of the existing per-run rubric builder, leaving two places a "+
        "future item can be registered and no single owner of the ordering. The repair-brief branch "+
        "additionally couples workflow code to a judge-layer constant.";
      A(DESIGN.length>300,"the probe design justification must be realistic, got "+DESIGN.length);
      const DESIGN_IDS=["design_serves_overall_goal","cumulative_design_coherent",
        "no_architecture_violations"];
      for(const n of [0,1,2,3]){
        const failing=DESIGN_IDS.slice(0,n);
        const form=applyCheckOverrides(
          {criterionResults:[{id:"AC-1",pass:true,justification:"m"}],
           rubricResults:rubric.map((r)=>({id:r.id,pass:!failing.includes(r.id),
             justification:failing.includes(r.id)?DESIGN:"fine"})),concerns:[]},
          crit,rubric,[],[],failing.includes("no_architecture_violations")?["seeded"]:[],
          {criterionId:NEW,command:CMD,exitCode:1,output:BIG,durationMs:4000,infraFailed:false});
        A(!("error" in form),"n="+n+": overrides must settle, got "+JSON.stringify(form));
        const brief=buildCompletionReviewBrief(form.form);
        const w=(c,m)=>A(c,"n="+n+" co-occurring design findings: "+m+"\n--- brief ---\n"+brief);
        w(brief.length<=CAP,"trap D: COMPLETION_BRIEF_MAX_CHARS must stay "+CAP+" — the brief must "+
          "RESERVE room, not raise its budget. Got "+brief.length);
        w(brief.includes(NEW),"the brief must NAME the failing suite item");
        w(brief.includes("FAILED test/judge/harness.test.ts"),
          "trap F: the failing TEST NAMES from the tail of a "+BIG.length+"-byte output must "+
          "survive — an excerpt short enough to always fit names nothing");
        w(brief.includes("Test Files  2 failed"),
          "F-323: the SUMMARY LINE at the very tail of the output is the first casualty of a "+
          "tail-truncating clamp and must survive");
        w(!/only design/i.test(brief),
          "WP-611 regression: a suite failure must not be briefed as a design review");
        for(const id of failing){
          w(brief.includes(id),"trap E: reserving room for the excerpt must not squeeze out the "+
            "OTHER failing finding "+id);
        }
        w(brief.includes("a fix must resolve these findings"),
          "the closing instruction must survive — it is what keeps the repair from breaking an AC");
      }

      // 4. WP-611 regression — a pure DESIGN finding keeps today wording and shape.
      const designOnly=buildCompletionReviewBrief({criterionResults:[],
        rubricResults:[{id:"design_serves_overall_goal",pass:false,justification:DESIGN}],
        concerns:[]});
      A(/only design/i.test(designOnly)&&designOnly.includes("DESIGN REVIEW BRIEF"),

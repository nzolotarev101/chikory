# Plain: We built three layers of machinery to prove a benchmark task is worth scoring, and not one
# task in the corpus can feed it. Four of the five already know where their upstream fix lives — the
# commit sha is sitting in a header COMMENT no tool can read. This run moves that knowledge into the
# field the probe reads, writes the rule down for future authors, and makes the product say out loud
# when a task can never be probed instead of reporting it as a crash.
# WP: WP-597 (probeable corpus) — the missing INPUT to WP-593/595/596
# Ladder-rung: 5 (prerequisite — see WHY below)
# Thesis-KPI: the number of corpus tasks whose discrimination can be proven at all, 0 → ≥4
# Format: loose — the outcome, the CLI surface and the field are fixed; internals are the executor's
#
# Launch mode: RUN (single node — one deliverable).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE RUNG ITSELF (dogfood-127 review, 2026-08-08):
#   Progression gate: ⛔ STALLED + ⚠️ LADDER-PACE (rung 4 across the trailing 3 headlines), which binds
#   the next headline to the P3 ladder rung. **Rung 5 is the P3 exit gate** — published ranges over a
#   corpus wide enough for the intervals to SEPARATE, plus the leaderboard. The rung cannot run, and
#   the reason is measured rather than cautious: dogfood-123 published Chikory [83.2%, 100.0%] vs raw
#   Claude Code [75.4%, 99.1%] over 19 requirements — OVERLAPPING — and separation needs more
#   requirements (ST-1's own 60–100-task target), which is a hand-run research lift dogfood-120/121/122
#   each proved an LLM executor may not supervise.
#
#   What this run fixes is the blocker under that lift. WP-593 probes a task, WP-595 makes the verdict
#   binding, WP-596 sweeps a whole directory durably — and **zero tasks under `benchmarks/tasks/` carry
#   `repo.fix_ref`** (grep-verified 2026-08-08), so a sweep over the real corpus probes nothing and the
#   gate has no input. `benchmarks/tasks/AUTHORING.md` never mentions the field, so no author was ever
#   asked for one. Every task authored from here inherits that hole.
#
#   And the gate must NOT simply be armed over today's corpus: dogfood-123's separation comes from
#   `brownfield-001` alone, a SELF-PERFORMED zod v3→v4 migration for which no upstream fix commit
#   exists by construction. Arming the gate today would exclude the only task distinguishing the arms.
#   `brownfield-001` needs an authored gold patch or an explicit exemption — it must never be given a
#   fabricated ref to make the count go up.
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. Inventing a sha that looks right. A 40-hex string passes the existing validator (`task.ts:206`)
#      and proves nothing. AC-2 resolves EVERY declared `fix_ref` against the task's OWN declared
#      `repo.url` and requires the pinned `ref` to be an ancestor of it.
#   B. Making `fix_ref` mandatory in the validator. That invalidates all five tasks at once and breaks
#      `run`/`bench` on the spot. AC-1 and AC-2 both assert plain `validate` still exits 0.
#   C. Documentation only. Writing the rule in AUTHORING.md while no command behaves differently is
#      the cheapest way to look done. AC-1 drives the new reporting flag and the sweep.
#   D. Reporting an unprobeable task as a crash. `probe --tasks` today counts a task with no `fix_ref`
#      as `failed` alongside a genuinely broken probe, so the operator cannot tell "nobody wrote the
#      gold patch yet" from "this probe blew up". AC-1 requires it to be recorded as its own outcome,
#      naming the missing field.
#   E. Regressing the WP-596 sweep or the WP-595 gate. The sweep keeps persisting each verdict as it
#      lands, keeps skipping only proof taken at the current ref pair, and keeps its exit contract.
#
# PRECONDITIONS, ALL MEASURED 2026-08-08 (do not re-litigate; re-measure if stale):
#   * `repo.fix_ref` parses, is optional, and is 40-hex-validated for a pinned task
#     (`task.ts:102,206-207`); `BenchmarkTask.repo.fixRef` reaches `runProbe` (`probe.ts:85-91`).
#   * NO task file under `benchmarks/tasks/` contains `fix_ref`; `AUTHORING.md` never mentions it.
#   * `brownfield-004` and `brownfield-005` already record the upstream fix commit sha in a header
#     COMMENT (`69da9545…` / `dfbafa8e…`); `brownfield-002` and `brownfield-003` name the upstream PR
#     (#3036 / #5855) but not the sha. `brownfield-001` states no upstream fix exists.
#   * `parseFlags` (`main.ts:137-161`) accepts any `--flag`, so an unrecognized flag is silently
#     ignored today — a new flag changes behavior only once the command reads it.
#   * `git fetch --depth 50 --filter=tree:0 <url> <sha>` resolves an arbitrary commit from GitHub in
#     under a second, and `git merge-base --is-ancestor` then answers over the shallow history —
#     hand-measured against `react-hook-form` and `gitify` on 2026-08-08.
#   * `loadTaskDir` returns `{tasks, invalid, sources}` (F-281) and `isRunnable(task)` is
#     `status === "pinned"` (`task.ts:77-79`).

name: dogfood-128-wp597-probeable-corpus
wp: WP-597
goal: >
  Make the benchmark corpus able to produce the evidence the scoring gate consumes, and make the
  product say so when it cannot.

  Three things must become true.

    * **A task declares where its fix lives.** At least four of the five pinned brownfield tasks
      under `benchmarks/tasks/` carry a real `repo.fix_ref`: a commit that exists in that task's own
      declared `repo.url`, that the pinned `repo.ref` is an ancestor of, and whose tree differs from
      it. Four of the five already name their upstream fix in prose — two by sha in a header comment,
      two by PR number — so this is transcription and lookup, not invention. A sha that cannot be
      resolved in the declared repo is worse than no sha at all: it would let the probe report a
      confident verdict about the wrong commit. `brownfield-001` is the exception and must stay one —
      it is a self-performed migration with no upstream fix, so it keeps NO `fix_ref` and its file
      states why in prose. Do not fabricate one to make a count go up.

    * **The rule is written down where authors read it.** `benchmarks/tasks/AUTHORING.md` gains the
      gold-patch rule: what `fix_ref` is, that it belongs in the frozen Format v1 block, that a pinned
      brownfield task is expected to carry one, what to do when upstream never made the fix (author
      the commit yourself and pin it, or state the exemption in the task file as `brownfield-001`
      does), and the fact that the pin step's existing "verified green on at least one known-good
      solution (yours)" already produces this commit — today it is thrown away.

    * **The product reports probeability instead of crashing on it.**
      `chikory-bench validate <dir> --require-probeable` exits 1 when any RUNNABLE task in the
      directory can never be probed, naming each one and the field it is missing; without the flag
      `validate` keeps its exact current behavior and exit codes. And `probe --tasks` records a task
      with no `fix_ref` as its OWN outcome — named, with the missing field in the line that names it,
      counted separately from a probe that genuinely failed, and absent from the ledger — rather than
      folding it into the failure count as it does today.

  Everything WP-596 established holds unchanged: each verdict is still persisted the moment it lands,
  a task is still skipped only when its ledger entry matches BOTH refs the task declares today, a
  moved ref still forces a re-probe, and the sweep still exits 0 only when every selected task holds a
  current `discriminating` verdict.

  Constraints: TypeScript stays strict ESM with named exports and no `any`; no new dependency, no
  provider SDK, no API key, no global install, no HTML output. Do not change any task's `goal`,
  `requirements`, `status`, `repo.url`, or `repo.ref` — `fix_ref` and prose comments are the only
  task-file edits allowed. Do not edit `summarize`, any artifact under benchmarks/results or
  benchmarks/publications, or the WP-595 ledger gate. A published or reported path goes through the
  publishable-path helper (WP-591), never a raw argument. Project commands run sequentially inside the
  already-activated Devbox environment, so invoke pinned tools directly and never nest devbox run.
  Every existing test remains green.

repos:
  - url: /Users/nikitazolotarev/repos/chikory
    writable: true

acceptance_criteria:
  - id: AC-1
    description: >
      THIS NODE'S OWN ORACLE — RED on HEAD, green only once probeability is something the product
      reports and acts on. Against a local git fixture this check builds itself: plain `validate` must
      still exit 0 over a corpus containing a task with no fix ref (trap B), `--require-probeable`
      must exit 1 and name it and the missing field (trap C), and a sweep must record it as its own
      outcome — named, absent from the ledger, and NOT counted as a probe failure (trap D) — while the
      probeable task in the same directory is still probed and recorded (trap E). Executor-authored
      tests are not the oracle; the inputs and the expected decisions are written here.
    check: |
      cd benchmarks/harness && pnpm exec tsc && node --input-type=module -e '
      import {mkdtempSync,mkdirSync,writeFileSync,readFileSync,existsSync} from "node:fs";
      import {execFileSync,spawnSync} from "node:child_process";
      import {tmpdir} from "node:os";
      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const root=mkdtempSync(join(tmpdir(),"probeable-"));
      const origin=join(root,"origin"); mkdirSync(origin,{recursive:true});
      const git=(...a)=>execFileSync("git",["-C",origin,...a],{stdio:"pipe"}).toString().trim();
      const w=(p,s)=>writeFileSync(join(origin,p),s);
      execFileSync("git",["init","-q","-b","main",origin],{stdio:"pipe"});
      git("config","user.email","probe@chikory.local"); git("config","user.name","probe");
      w("value.txt","BROKEN\n"); w("verify.sh","echo \"Tests  3 passed (3)\"\nexit 0\n");
      git("add","-A"); git("commit","-q","-m","base"); const base=git("rev-parse","HEAD");
      w("value.txt","FIXED\n");
      git("add","-A"); git("commit","-q","-m","fix"); const fix=git("rev-parse","HEAD");
      const tasks=join(root,"tasks"); mkdirSync(tasks,{recursive:true});
      const R1="  - id: R1\n    description: discriminating\n    check: grep -q FIXED value.txt\n";
      const task=(id,{fixRef=fix,status="pinned"}={})=>writeFileSync(join(tasks,id+".yaml"),
        "id: "+id+"\nclass: brownfield\nstatus: "+status+"\nrepo:\n"+
        "  url: "+JSON.stringify(origin)+"\n  ref: "+base+
        (fixRef?"\n  fix_ref: "+fixRef:"")+"\n"+
        "base_verification_command: sh verify.sh\nhorizon: 1h\ngoal: |\n  fixture\n"+
        "requirements:\n"+R1);
      // 900 = probeable · 901 = pinned, NO fix ref · 902 = draft, no fix ref (not runnable)
      task("brownfield-900");
      task("brownfield-901",{fixRef:null});
      task("brownfield-902",{fixRef:null,status:"draft"});
      const cli=(...a)=>spawnSync("node",["dist/bin.js",...a],{encoding:"utf8"});
      const text=(r)=>(r.stdout??"")+(r.stderr??"");
      // ── trap B: the corpus still validates. A mandatory field would break all five today. ──
      const plain=cli("validate",tasks);
      A(plain.status===0,"plain validate must still exit 0 over a corpus with an unprobeable task, "+
        "got "+plain.status+"\n"+text(plain));
      // ── trap C: probeability is REPORTED, and the report names the field to add ──
      const strict=cli("validate",tasks,"--require-probeable");
      A(strict.status===1,"--require-probeable must exit 1 when a runnable task can never be probed, "+
        "got "+strict.status+"\n"+text(strict));
      const st=text(strict);
      const line901=st.split("\n").find((l)=>l.includes("brownfield-901"));
      A(line901!==undefined,"--require-probeable must NAME the unprobeable task, got:\n"+st);
      A(/fix_ref/.test(line901),
        "the line naming it must say which field is missing, got: "+JSON.stringify(line901));
      A(!/brownfield-900/.test(st),"a probeable task must not be reported, got:\n"+st);
      A(!/brownfield-902/.test(st),
        "a DRAFT is not runnable and must not be reported as unprobeable, got:\n"+st);
      // ── trap D: the sweep records it as its own outcome, not as a probe failure ──
      const ledger=join(root,"discrimination.json");
      const sweep=cli("probe","--tasks",tasks,"--record",ledger,"--out",join(root,"out"));
      const sw=text(sweep);
      A(sweep.status===1,"a sweep with an unproven task still exits 1, got "+sweep.status+"\n"+sw);
      const swept=JSON.parse(readFileSync(ledger,"utf8"));
      const all=Array.isArray(swept)?swept:Object.values(swept);
      const e900=all.find((e)=>e&&e.taskId==="brownfield-900");
      A(e900&&e900.verdict==="discriminating"&&e900.baseRef===base&&e900.fixRef===fix,
        "the probeable task is still probed and recorded (trap E), got "+JSON.stringify(e900));
      A(!all.some((e)=>e&&e.taskId==="brownfield-901"),
        "an unprobeable task must never reach the ledger, got "+
        JSON.stringify(all.map((e)=>e.taskId)));
      const swLine=sw.split("\n").find((l)=>l.includes("brownfield-901"));
      A(swLine!==undefined,"the sweep must NAME the unprobeable task, got:\n"+sw);
      A(/fix_ref/.test(swLine),
        "the sweep line naming it must say which field is missing, got: "+JSON.stringify(swLine));
      A(!/\bfailed\b/i.test(swLine),
        "trap D: a missing gold patch is not a probe failure — the operator must be able to tell "+
        "them apart, got: "+JSON.stringify(swLine));
      const summary=sw.split("\n").filter((l)=>/\bfailed\b/i.test(l)).join("\n");
      A(/(^|\D)0\s*failed/i.test(summary),
        "trap D: nothing genuinely FAILED in this sweep, so the failure count must be 0, got:\n"+
        summary);
      A(!/brownfield-902/.test(sw),"a draft is not selected by the sweep, got:\n"+sw);
      // ── a second sweep still skips the proven task untouched (WP-596 unchanged) ──
      const before=JSON.stringify(JSON.parse(readFileSync(ledger,"utf8")));
      const again=cli("probe","--tasks",tasks,"--record",ledger,"--out",join(root,"out2"));
      A(again.status===1,"still exits 1 while 901 is unproven, got "+again.status);
      A(JSON.stringify(JSON.parse(readFileSync(ledger,"utf8")))===before,
        "WP-596 unchanged: a settled sweep must re-probe nothing at all");
      A(existsSync(join(root,"out","brownfield-900","probe.json")),
        "F-277 unchanged: each task keeps its OWN probe output dir");
      console.log("AC-1 OK: an unprobeable task is reported by name with the field it lacks, kept out "+
        "of the ledger, and distinguished from a probe that actually failed");
      '

  - id: AC-2
    description: >
      The declared gold-patch refs are REAL, not plausible (trap A). Every `fix_ref` in the corpus is
      resolved against that task's OWN declared `repo.url`, the pinned `ref` must be an ancestor of
      it, and their trees must differ — a fabricated or wrong-repo sha fails all three. At least four
      of the five pinned brownfield tasks must carry one; `brownfield-001` must carry NONE and say
      why. The corpus must still validate (trap B) and the rule must be documented (trap C).
    check: |
      cd benchmarks/harness && pnpm exec tsc && node --input-type=module -e '
      import {mkdtempSync,mkdirSync,readdirSync,readFileSync} from "node:fs";
      import {execFileSync,spawnSync} from "node:child_process";
      import {tmpdir} from "node:os";
      import {join,resolve} from "node:path";
      import {pathToFileURL} from "node:url";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const corpus=resolve(process.cwd(),"../tasks");
      const T=pathToFileURL(join(process.cwd(),"dist/task.js")).href;
      const {validateAuthoredTask,isRunnable}=await import(T);
      const declared=[];
      for (const name of readdirSync(corpus).sort()) {
        if (!/\.ya?ml$/.test(name)) continue;
        const raw=readFileSync(join(corpus,name),"utf8");
        const {task,issues}=validateAuthoredTask(raw,name);
        A(task,"every corpus file must still parse: "+name+" — "+JSON.stringify(issues));
        if (task.class!=="brownfield"||!isRunnable(task)) continue;
        declared.push({id:task.id,raw,url:task.repo?.url,ref:task.repo?.ref,fix:task.repo?.fixRef});
      }
      A(declared.length>=5,"expected the 5 pinned brownfield tasks, found "+declared.length);
      const withFix=declared.filter((t)=>t.fix!==undefined);
      A(withFix.length>=4,
        "at least 4 of the 5 pinned brownfield tasks must declare a gold-patch fix_ref, got "+
        withFix.length+" ("+withFix.map((t)=>t.id).join(", ")+")");
      const one=declared.find((t)=>t.id==="brownfield-001");
      A(one!==undefined,"brownfield-001 must still be a pinned brownfield task");
      A(one.fix===undefined,
        "trap A: brownfield-001 has NO upstream fix by construction and must not be given a "+
        "fabricated one, got "+one.fix);
      A(/no upstream|never did this migration|self-performed|exempt/i.test(one.raw),
        "brownfield-001 must STATE why it carries no fix ref");
      // ── every declared ref must resolve in ITS OWN repo and descend from the pinned base ──
      for (const t of withFix) {
        A(/^[0-9a-f]{40}$/.test(t.fix),t.id+": fix_ref must be a full 40-hex sha, got "+t.fix);
        A(t.fix!==t.ref,t.id+": fix_ref must differ from the pinned ref");
        const work=mkdtempSync(join(tmpdir(),"goldpatch-"));
        mkdirSync(work,{recursive:true});
        execFileSync("git",["init","-q","-b","main",work],{stdio:"pipe"});
        const g=(...a)=>spawnSync("git",["-C",work,...a],{encoding:"utf8"});
        A(g("remote","add","origin",t.url).status===0,t.id+": could not set remote "+t.url);
        for (const sha of [t.ref,t.fix]) {
          const f=g("fetch","--depth","50","--filter=tree:0","origin",sha);
          A(f.status===0,
            t.id+": "+sha+" does not resolve in its own declared repo "+t.url+
            " — a sha that cannot be fetched is not evidence, it is a guess\n"+(f.stderr??""));
        }
        const anc=g("merge-base","--is-ancestor",t.ref,t.fix);
        A(anc.status===0,
          t.id+": the pinned ref must be an ANCESTOR of fix_ref — "+t.fix+" is not a descendant of "+
          t.ref+", so it is not the fix for this base");
        const diff=g("diff","--name-only",t.ref,t.fix);
        A(diff.status===0&&(diff.stdout??"").trim().length>0,
          t.id+": the fix tree must DIFFER from the base tree");
      }
      // ── trap B: the corpus still validates through the real CLI ──
      const v=spawnSync("node",["dist/bin.js","validate",corpus],{encoding:"utf8"});
      A(v.status===0,"the real corpus must still validate, got "+v.status+"\n"+
        ((v.stdout??"")+(v.stderr??"")));
      // ── trap C: the rule is written where authors read it ──
      const guide=readFileSync(join(corpus,"AUTHORING.md"),"utf8");
      A((guide.match(/fix_ref/g)??[]).length>=2,
        "AUTHORING.md must document fix_ref, found "+(guide.match(/fix_ref/g)??[]).length+" mention(s)");
      A(/```yaml[\s\S]*fix_ref[\s\S]*```/.test(guide),
        "fix_ref must appear in the frozen Format v1 example block");
      A(/upstream/i.test(guide)&&/fix_ref/.test(guide),
        "AUTHORING.md must say what to do when upstream never made the fix");
      console.log("AC-2 OK: "+withFix.length+" corpus tasks carry a gold-patch ref that resolves in "+
        "its own repo and descends from the pinned base; brownfield-001 stays exempt and says why");
      '

budget_usd: 15
max_steps: 12

step_limits:
  max_turns: 40
  # 840 is the hard ceiling (MAX_STEP_MAX_SECONDS): above it the executeStep
  # activity's Temporal startToCloseTimeout kills the step first.
  max_seconds: 840

pacing:
  mode: auto
  autoCalibrate: true

unattended:
  escalation: seal_resumable_failed


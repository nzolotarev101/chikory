    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/cli/ac2-minor-concern-visible.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import { renderStepDetail } from "../../src/cli/trace.js";
      import type { JournalEntry } from "../../src/types.js";

      const ref = { id: "a".repeat(64), kind: "diff" as const, bytes: 12, summary: "s" };
      const COSMETIC = "stray text 开启 before PASS; a minor documentation-quality defect.";
      const REAL_DEFECT = "the committed test changes do not assert the tool.calls attribute is absent.";

      function entries(): JournalEntry[] {
        const record = {
          status: "SUCCESS" as const,
          diffRef: ref,
          summary: "did the work",
          toolCalls: 2,
          tokens: { input: 1000, output: 500 },
          costUsd: 0.5,
          costEstimated: false,
          durationMs: 60_000,
          transcriptRef: { ...ref, kind: "transcript" as const },
        };
        return [
          {
            idx: 0,
            ts: "2026-08-18T00:00:00.000Z",
            kind: "step",
            payload: { stepIndex: 0, instruction: "do it", planItem: "do it", record },
            costDeltaUsd: 0.5,
            artifactRefs: [],
          },
          {
            idx: 1,
            ts: "2026-08-18T00:01:00.000Z",
            kind: "judge",
            payload: {
              judgeIndex: 0,
              atStep: 0,
              form: {
                criterionResults: [{ id: "AC-1", pass: true, justification: "ok" }],
                rubricResults: [{ id: "tests_pass", pass: true, justification: "ok" }],
                concerns: [COSMETIC, REAL_DEFECT],
                concernSeverities: ["minor", "blocking"],
              },
              judgeModel: { provider: "openai-compat", model: "m" },
              evidenceRefs: [],
              costUsd: 0.01,
            },
            costDeltaUsd: 0.01,
            artifactRefs: [],
          },
        ] as unknown as JournalEntry[];
      }

      describe("AC-2 WP-548/F-219: below the floor is not invisible", () => {
        test("the minor concern is still rendered, and is identifiable as minor", () => {
          const out = renderStepDetail(entries(), 1);
          expect(
            out.includes(COSMETIC),
            "implementing the floor by dropping minor concerns from the form makes the judge's " +
              "own observation unreadable to the operator. 'Does not stop the run' is not " +
              "'did not happen' — that is F-180 inverted.",
          ).toBe(true);
          const line = out.split("\n").find((l) => l.includes(COSMETIC)) ?? "";
          expect(
            /minor/i.test(line),
            "the operator must be able to tell WHY this one did not stop the run, on the line " +

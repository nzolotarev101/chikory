      if [ "$N" -lt 175 ]; then
        echo "AC-3 FAIL: durability floor not met — the committed trees did not grow by at least 3 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356), and the standingConcerns case is not covered by any check above."
        exit 1
      fi
      echo "AC-3 OK: contract additive on all three mirrors + the prompt, one shared policy at both call sites, traps intact, committed trees green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# MEASURE it at the launch commit rather than trusting this line (F-342, dogfood-140).
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE (the verdict policy). It drives the REAL `blockingConcerns` and
      the REAL `computeVerdict` — no mocks, no re-implementation — and replays the two concern
      texts this campaign actually produced, verbatim, demanding OPPOSITE verdicts. It also
      drives the two input families a naive floor gets wrong: a legacy form with no severities at
      all, and a severities array SHORTER than `concerns`. Expected values are written into this
      check, not read from a test file the executor authors.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/judge/ac1-concern-severity-floor.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import { blockingConcerns, computeVerdict } from "../../src/judge/verdict.js";
      import type { JudgeForm } from "../../src/types.js";

      // Verbatim from this campaign's journals. dogfood-120 N-2 step 4 (parked a node 3h 47m):
      const COSMETIC =
        "stray text 开启 before PASS; this is a minor documentation-quality defect but does not " +
        "obscure the recorded result.";
      // dogfood-151 run-7faebdb5 step 1 (sealed the run FAILED, correctly):
      const REAL_DEFECT =
        "The OpenTelemetry omission for unobserved counts is implemented in recordStepSpan, but " +
        "the shown committed test changes do not include a focused assertion that the tool.calls " +
        "attribute is absent.";

      function form(over: Partial<JudgeForm>): JudgeForm {
        return {
          criterionResults: [{ id: "AC-1", pass: true, justification: "ok" }],
          rubricResults: [{ id: "tests_pass", pass: true, justification: "ok" }],
          concerns: [],
          ...over,
        } as JudgeForm;
      }

      describe("AC-1 WP-548/F-219: the floor weighs a concern, and silence is never permission", () => {
        test("the cosmetic concern, marked minor, does NOT stop the run", () => {
          const f = form({ concerns: [COSMETIC], concernSeverities: ["minor"] } as Partial<JudgeForm>);
          expect(
            blockingConcerns(f),
            "a concern the judge marked minor is below the floor; blockingConcerns must not " +
              "return it. This is the dogfood-120 input that parked a node 3h 47m over a typo.",
          ).toEqual([]);
          expect(
            computeVerdict(f, {}).kind,
            "rule 4 must not escalate when every concern is below the floor",
          ).toBe("PROCEED");
        });

        test("the real defect, marked blocking, still stops the run exactly as today", () => {
          const f = form({ concerns: [REAL_DEFECT], concernSeverities: ["blocking"] } as Partial<JudgeForm>);
          expect(blockingConcerns(f)).toEqual([REAL_DEFECT]);
          const v = computeVerdict(f, {});
          expect(
            v.kind,
            "a floor that silences dogfood-151's concern is worse than no floor: that concern " +
              "named a real unmet goal requirement and human review upheld it.",
          ).toBe("ESCALATE");
          expect(v.escalateClass).toBe("out_of_rubric");
        });

        test("a concern with NO severity mark at all is blocking (every legacy judge output)", () => {
          const f = form({ concerns: [COSMETIC] });
          expect(
            blockingConcerns(f),
            "concernSeverities is absent on every judge output written before this WP and on " +
              "any judge that ignores the field. Defaulting an unmarked concern to minor lets a " +
              "judge silence itself by saying nothing.",
          ).toEqual([COSMETIC]);
          expect(computeVerdict(f, {}).kind).toBe("ESCALATE");
        });

        test("a severities array SHORTER than concerns fails safe per index", () => {
          const f = form({
            concerns: [COSMETIC, REAL_DEFECT],
            concernSeverities: ["minor"],
          } as Partial<JudgeForm>);
          expect(
            blockingConcerns(f),
            "index 1 has no severity, so it is blocking; index 0 is marked minor and is not. " +
              "Reading a ragged array as all-minor, or throwing on it, are both wrong.",
          ).toEqual([REAL_DEFECT]);
          expect(computeVerdict(f, {}).kind).toBe("ESCALATE");
        });

        test("trap: the BRANCH rule still reads every concern's text, minor included", () => {
          const f = form({
            concerns: ["consider a branch to explore the alternative layout"],
            concernSeverities: ["blocking"],
          } as Partial<JudgeForm>);
          expect(
            computeVerdict(f, {}).kind,
            "rule ordering is unchanged: the branch rule runs before rule 4 and matches on text.",
          ).toBe("BRANCH");
        });

        test("trap: rule 4's rubric guard is UNCHANGED (that is WP-599, not this run)", () => {
          const f = form({
            rubricResults: [{ id: "tests_pass", pass: false, justification: "red" }],
            concerns: [REAL_DEFECT],
            concernSeverities: ["blocking"],
          } as Partial<JudgeForm>);
          expect(
            computeVerdict(f, {}).kind,
            "a blocking concern alongside a rubric failure still does not reach rule 4. " +
              "Widening that guard is F-288/WP-599's job and would silently change three " +
              "other paths.",
          ).not.toBe("ESCALATE");
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: the severity floor is missing, inverted, or unsafe on an unmarked/ragged input; or rule ordering / the rubric guard moved. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: minor does not escalate, blocking does, unmarked and ragged fail safe, branch and rubric guard unchanged"

  - id: AC-2
    description: >
      The anti-suppression check. A concern below the floor must still be VISIBLE to the operator
      in `chikory trace`, identifiable as minor, and a blocking concern must render byte-identically
      to today. Drives the REAL `renderStepDetail` over a real journal shape — the trap it rejects

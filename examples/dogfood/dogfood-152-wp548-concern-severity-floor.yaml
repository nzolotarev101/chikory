          ).toBe(true);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: a minor concern is invisible in chikory trace, is not identifiable as minor, or the blocking rendering changed. vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: minor concerns stay visible and marked; blocking rendering unchanged"

  - id: AC-3
    description: >
      Contract, wiring and durability. The additive optional field exists on all three mirrors and
      is actually REQUESTED of the judge; `concerns` is still `string[]`; the ONE policy function
      is exported from `src/judge/verdict.ts` and is used at BOTH call sites — including the

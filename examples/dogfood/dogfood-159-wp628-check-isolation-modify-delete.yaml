# Plain: before the judge grades a run it executes each acceptance check in turn, and it puts the
# workspace back between them so one check cannot poison the next. That repair only covers files a
# check CREATED. If a check overwrites or deletes a file git was told to ignore — a log, a cached
# JSON, a build artifact — the damage stands, and every later check is graded against a corrupted
# tree. After this run a check that modifies or deletes a pre-existing ignored file is isolated too.
# WP: WP-628 (judge-check ignored-path isolation must cover MODIFY and DELETE; F-360)
# Ladder-rung: 0 (off-ladder - gate reads STALLED and binds to the rung, but P3 rung-5's
#   remaining half is WP-304, operator-run and not expressible as a spec; see WHY)
# Thesis-KPI: compounding error (CLAUDE.md) - 95% per-step becomes ~5% end-to-end over 60 steps.
#   Measured as: can the gate that exists to catch a bad step be made to grade the WRONG TREE by
#   the step before it. A judge whose evidence depends on check ORDER is not a gate.
#
# THE MEASURED PREMISE - read out of the code AND PROBED AT THIS REVIEW (F-203/F-342: measured,
#   never transcribed). Reproduce the read with:
#     sed -n '205,213p' packages/sdk-ts/src/judge/hermeticity.ts    # the bare ignored entry
#     sed -n '136,156p' packages/sdk-ts/src/judge/hermeticity.ts    # the three comparison branches
#     sed -n '249,257p' packages/sdk-ts/src/judge/evidence.ts       # the real batch loop
#   `runCriteriaChecks` (packages/sdk-ts/src/judge/evidence.ts:222) runs the checks serially and
#   calls `snapshotWorkspace` -> `planCheckSideEffectCleanup` -> `applyCleanupPlan` between each
#   (`:253`-`:254`). `snapshotWorkspace` reads content and a sha256 for every path `git status
#   --porcelain` reports, but stores every IGNORED path as the bare entry
#   `{ path: relPath, status: "!!" }` with no hash and no content
#   (packages/sdk-ts/src/judge/hermeticity.ts:211). Two consequences follow mechanically:
#     * MODIFY is undetectable. The both-present branch restores only when
#       `b.status !== a.status || (b.hash && a.hash && b.hash !== a.hash)`
#       (packages/sdk-ts/src/judge/hermeticity.ts:138). For an ignored file the status is "!!"
#       before and after and both hashes are undefined, so the condition is false for every
#       overwrite, however large.
#     * DELETE is detected and then deliberately skipped. The before-only branch reads
#       `if (b.status.includes("!") && b.content === undefined)` and falls through with a comment
#       (packages/sdk-ts/src/judge/hermeticity.ts:149), because there is nothing to restore FROM.
#   dogfood-144 delivered the CREATE family and its AC graded only the CREATE family. It was armed
#   in both directions and still shipped blind - the same failure dogfood-158 shipped one run later
#   (F-401), where an exemption was fitted to the single family its AC named.
#
#   * THE FIRST TRAP IS COST, AND IT IS WHY THE BARE ENTRY EXISTS. A judge workspace is a real
#     repo: `git ls-files --others --ignored --exclude-standard` returns 17,372 paths in
#     `.chikory/runs/run-71087607-eca4-41ca-b73b-febb0f484b8e/workspace` and 27,477 in this repo
#     (measured 2026-08-19). Snapshotting CONTENT for all of them, twice per check, is hundreds of
#     megabytes of string churn per judge pass. A delivery that simply drops the special case and
#     reads every ignored file will pass a small fixture and make every real judge pass unusable.
#     AC-2 drives 1,200 ignored files of 64 KiB - 76.8 MiB - through a real three-check batch and
#     puts a wall-clock bound on it. Detection is allowed to be cheap (a `stat` per path is
#     O(inventory), not O(bytes)); it is RESTORATION that needs bytes, so a size or total budget on
#     what is preserved is a legitimate design, provided the budget is not zero.
#   * THE SECOND TRAP IS THE UNTOUCHED MAJORITY. Isolation must be a no-op for the ignored files a
#     check never touched. A delivery that rewrites or re-checkouts every ignored path "to be safe"
#     both blows the cost bound and churns a tree the executor legitimately owns. AC-1 and AC-2
#     both carry an untouched ignored file and require it byte-identical, and AC-2 requires the
#     batch to leave the 1,200-file tree intact.
#   * THE THIRD TRAP IS GRADING THE FIX AT THE WRONG ALTITUDE. `planCheckSideEffectCleanup` is a
#     pure function and it is easy to make its unit tests green while the batch still hands the
#     next check a corrupted tree. AC-1 therefore asserts at the CONSUMED seam: the SECOND check in
#     a real `runCriteriaChecks` batch reads the file the FIRST check destroyed and exits non-zero
#     if it does not see the original bytes. The oracle is that check's own exit code.
#   * NOT IN SCOPE: no change to what a check IS, to the rubric, the verdict arithmetic, the
#     executor prompt, the write boundary (`src/chain/write-set.ts`, dogfood-158), the Python
#     mirror or the TaskSpec contract. WP-623's tracked-path isolation and the per-check timeout
#     keep working exactly as they do.
#   * THE SUITE THIS RUN MUST NOT BREAK, MEASURED at the launch commit by running it under devbox
#     (F-342 - run it yourself and read its own tail): 197 files passed | 2 skipped,
#     1663 passed | 23 skipped (1686 total).
#
# PRECEDENCE - the design call plan.md left open is DECIDED HERE, so the run is not graded on a
#   coin flip:
#   1. REPAIR BEATS REPORTING for anything inside the preservation budget. The batch already
#     repairs the CREATE family silently; a modify or delete that the implementation could have
#     preserved must be put back, not merely announced.
#   2. AN HONEST LIMIT BEATS A SILENT ONE. If a path is outside whatever budget the implementation
#     chooses, the run must not pretend the tree is clean - say so in the check batch's own output
#     or logs. What it must never do is restore nothing and report nothing.
#   3. CHEAPNESS NEVER BUYS BLINDNESS. Whatever the budget, DETECTION covers every ignored path.
#
# Format: loose - the outcome (a later check is never graded against a tree an earlier check
#   corrupted, at a cost a real workspace can pay) is fixed. Where the original bytes are kept, how
#   change is detected, and how the budget is spelled are the executor's call. No AC greps a new
#   symbol or field name (F-393).
#
# Launch mode: RUN (one seam, one package).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-158 review, 2026-08-19):
#   `scripts/dogfood-progression.sh` reads **STALLED** with dogfood-158 in the ledger (max steps
#   2 vs 3 over the trailing three), and a STALLED verdict BINDS the next headline to the current
#   phase ladder rung. That rung cannot be run: P3's ladder is WP-530 (plan.md section 7) and its
#   next rung, rung-5, is
#   WP-304's OpenHands arm plus a corpus wide enough to separate 19 requirements at 95 percent
#   confidence. Re-checked against plan.md section 7 at this review and still true: that is a
#   quota-bound, multi-hour benchmark suite the OPERATOR runs by hand (dogfood-122's lesson), so it
#   cannot be a spec, and has not been since dogfood-139 - which delivered rung-5's other half
#   (WP-303) and left nothing agent-runnable on the ladder. The binding verdict is therefore
#   UNSATISFIABLE by any spec, and is recorded as such rather than quietly reinterpreted. The 🔴
#   friction this review opened (F-401) was HAND-FIXED in the same sitting per TASK-PROTOCOL
#   section 4 and does not headline. WP-628 beats the remaining alternatives on thesis
#   value: it is product code on the JUDGE pillar - Chikory's wedge is a judge in the inner loop,
#   and a judge whose evidence depends on the order its checks ran in is not one. Its premise was
#   re-measured AND read out of the code at this review. Rejected: WP-589 half (2) (real, but
#   benchmark-CLI ergonomics - it removes a bad SPEC SHAPE, not a loop defect) - WP-638 (F-402,
#   just queued, and its live reachability is low now that F-401's exemption covers the families a
#   fresh clone actually carries) - WP-590 (F-265, adapter telemetry, track-B) - WP-634 (F-382,
#   harness-meta, section 1.5 track-B) - WP-610/WP-620/WP-622 (all track-B sized).

name: dogfood-159-wp628-check-isolation-modify-delete
wp: WP-628

goal: |
  A judge-executed acceptance check must never be graded against a workspace that an earlier check
  in the same batch corrupted — including when the corruption is to a file git was told to ignore.

  Measured from the code. `runCriteriaChecks` (packages/sdk-ts/src/judge/evidence.ts:222) runs
  the batch serially and restores the workspace between checks
  (packages/sdk-ts/src/judge/evidence.ts:253-:254). The restore is driven by
  snapshotWorkspace, which records content and a sha256 for every path git status --porcelain
  reports but records each IGNORED path as the bare entry the bare entry { path, status: "!!" } — no hash, no
  content (packages/sdk-ts/src/judge/hermeticity.ts:211). So the both-present comparison
  (packages/sdk-ts/src/judge/hermeticity.ts:138) can never fire for an ignored file, however
  large the overwrite, and the before-only branch deliberately falls through without restoring
  (packages/sdk-ts/src/judge/hermeticity.ts:149). Isolation therefore covers exactly one of the
  three ways a check can change a file.

  Make this true.

  1. **A check that OVERWRITES a pre-existing ignored file is isolated.** The next check in the
     batch reads the original bytes, and the file holds the original bytes when the batch ends.
  2. **A check that DELETES a pre-existing ignored file is isolated.** The next check finds the
     file present with its original bytes, and it is present when the batch ends.
  3. **The CREATE family keeps working.** A file a check created is still gone afterwards.

  Three things must NOT change, and each is a trap this run is graded on:

  1. **Isolation stays affordable.** A judge workspace really does carry tens of thousands of
     ignored files — 17,372 in .chikory/runs/run-71087607-eca4-41ca-b73b-febb0f484b8e/workspace,
     27,477 in this repo. Reading every ignored file's content, twice per check, is hundreds of
     megabytes of churn per judge pass. Detection may be cheap — a `stat` per path is
     O(inventory), not O(bytes). Preservation may carry a size or total budget. The budget may not
     be zero, and it may not be silent: a path you chose not to preserve must be reported in the
     batch's own output rather than passed off as a clean tree.
  2. **The untouched majority is left exactly alone.** An ignored file no check touched is
     byte-identical afterwards and is not rewritten, re-checked-out or deleted.
  3. **WP-623's tracked-path isolation and the per-check timeout are untouched.** Checks still run
     serially, still get their own timeout, and still report honest exit codes.

  TypeScript stays strict ESM with named exports and no `any`. Do not touch the rubric, the verdict
  arithmetic, what an acceptance check IS, the executor prompt, the chain write boundary
  (packages/sdk-ts/src/chain/write-set.ts - that is dogfood-158's work), the Python mirror, or
  the TaskSpec contract.

  Pin your work with tests that live in the repo, beside the files they cover. A behaviour proved
  only by the acceptance checks that grade this run is not pinned at all (F-356), and a repo test
  copied verbatim from a grading check inherits its blind spots (F-360). **At least one committed
  test must pin an input family these acceptance checks do not name** — dogfood-158 satisfied a
  test-count floor with nine case-for-case copies of its own ACs and shipped a defect all nine were
  blind to (F-403).

  **The plausible-but-wrong delivery is the one that makes the pure planner's unit tests green.**
  `planCheckSideEffectCleanup` is easy to fix in isolation; the batch that consumes it is where the
  next check gets its tree. The other plausible-but-wrong delivery drops the bare-entry special
  case and snapshots every ignored file's content, which passes a small fixture and makes a real
  judge pass unusable. Both are graded.

  Verify your work with FAST checks only: the package typecheck (`pnpm run typecheck` — NOT bare
  tsc --noEmit, which does not cover the test/ tree, F-382), eslint over the files you touched,
  and vitest over the directories you actually wrote into. Do NOT run the full vitest suite inside
  a step — it does not fit the step time cap (F-345).


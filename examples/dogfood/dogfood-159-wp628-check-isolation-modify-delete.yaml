    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# MEASURE it at the launch commit rather than trusting this line (F-342, dogfood-140).
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE AND ASSERTS AT THE CONSUMED SEAM. It builds a real git workspace
      with three pre-existing gitignored files, then calls the REAL `runCriteriaChecks` with a
      three-check batch — no mocks. Check 1 overwrites one ignored file, deletes another, and
      creates a third. Check 2 is the oracle: it reads the tree it was handed and exits non-zero
      unless the overwritten file holds its ORIGINAL bytes, the deleted file is present with its
      ORIGINAL bytes, the created file is gone, and the untouched file is unchanged. Check 3 proves
      the batch also finishes clean. The assertion is check 2's own exit code, so a fix that only
      corrects the pure planner cannot pass. The create family and the untouched file are asserted
      in the same batch on the same object, so no family is graded alone (F-360/F-403).
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/judge/ac1-check-isolation-families.generated.test.ts
      mkdir -p test/judge
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { execFile } from "node:child_process";
      import { mkdtemp, mkdir, readFile, writeFile } from "node:fs/promises";
      import { existsSync } from "node:fs";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { promisify } from "node:util";

      import { describe, expect, test } from "vitest";

      import { runCriteriaChecks } from "../../src/judge/index.js";
      import type { AcceptanceCriterion } from "../../src/types.js";

      const exec = promisify(execFile);
      const git = async (cwd: string, args: string[]): Promise<string> =>
        (await exec("git", args, { cwd })).stdout.trim();

      const ORIGINAL = "ORIGINAL-BYTES-DO-NOT-LOSE-ME";

      describe("a check batch must not hand the next check a corrupted tree (WP-628)", () => {
        test("modify, delete, create and untouched are all isolated in one real batch", async () => {
          const ws = await mkdtemp(join(tmpdir(), "ac1-iso-"));
          await git(ws, ["init", "-b", "main"]);
          await git(ws, ["config", "user.email", "t@t"]);
          await git(ws, ["config", "user.name", "t"]);
          await mkdir(join(ws, "src"), { recursive: true });
          await writeFile(join(ws, "src/a.ts"), "export const a = 1;\n");
          await writeFile(join(ws, ".gitignore"), "results/\n");
          await git(ws, ["add", "-A"]);
          await git(ws, ["commit", "-m", "base"]);

          // three PRE-EXISTING ignored files: one to overwrite, one to delete, one to leave alone
          await mkdir(join(ws, "results"), { recursive: true });
          await writeFile(join(ws, "results/overwritten.txt"), ORIGINAL);
          await writeFile(join(ws, "results/deleted.txt"), ORIGINAL);
          await writeFile(join(ws, "results/untouched.txt"), ORIGINAL);

          const criteria: AcceptanceCriterion[] = [
            {
              id: "VANDAL",
              description: "one check corrupts the ignored tree",
              check: [
                "printf CORRUPTED > results/overwritten.txt",
                "rm -f results/deleted.txt",
                "printf NEW > results/created.txt",
                "exit 0",
              ].join("\n"),
            },
            {
              id: "ORACLE",
              description: "the next check must be graded against the ORIGINAL tree",
              check: [
                'EXPECT="' + ORIGINAL + '"',
                'GOT=$(cat results/overwritten.txt 2>/dev/null || echo MISSING)',
                'if [ "$GOT" != "$EXPECT" ]; then echo "MODIFY not isolated: overwritten.txt is [$GOT]"; exit 1; fi',
                'if [ ! -f results/deleted.txt ]; then echo "DELETE not isolated: deleted.txt is gone"; exit 1; fi',
                'GOT2=$(cat results/deleted.txt)',
                'if [ "$GOT2" != "$EXPECT" ]; then echo "DELETE restored the wrong bytes: [$GOT2]"; exit 1; fi',
                'if [ -f results/created.txt ]; then echo "CREATE not cleaned: created.txt survived into the next check"; exit 1; fi',
                'GOT3=$(cat results/untouched.txt)',
                'if [ "$GOT3" != "$EXPECT" ]; then echo "untouched.txt was churned: [$GOT3]"; exit 1; fi',
                "echo ORACLE-OK",
                "exit 0",
              ].join("\n"),
            },
            {
              id: "TAIL",
              description: "a third check still runs and still reports honestly",
              check: "exit 0",
            },
          ];

          const runs = await runCriteriaChecks({ workspaceDir: ws, criteria, checkTimeoutMs: 60_000 });

          expect(runs.map((r) => r.criterionId)).toEqual(["VANDAL", "ORACLE", "TAIL"]);
          const oracle = runs.find((r) => r.criterionId === "ORACLE")!;
          expect(
            oracle.exitCode,
            "the SECOND check in the batch was graded against the tree the FIRST check left behind: " +
              oracle.output.slice(0, 600),
          ).toBe(0);
          expect(runs.find((r) => r.criterionId === "TAIL")!.exitCode).toBe(0);

          // and the batch leaves the workspace as it found it
          expect(
            (await readFile(join(ws, "results/overwritten.txt"), "utf8")),
            "after the batch, the overwritten ignored file must hold its original bytes",
          ).toBe(ORIGINAL);
          expect(
            existsSync(join(ws, "results/deleted.txt")) &&
              (await readFile(join(ws, "results/deleted.txt"), "utf8")),
            "after the batch, the deleted ignored file must be back with its original bytes",
          ).toBe(ORIGINAL);
          expect(
            existsSync(join(ws, "results/created.txt")),
            "after the batch, a file a check created must be gone (WP-625 create family)",
          ).toBe(false);
          expect(
            (await readFile(join(ws, "results/untouched.txt"), "utf8")),
            "an ignored file no check touched must be left exactly alone",
          ).toBe(ORIGINAL);
        }, 120_000);
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: a check in the batch was graded against a tree an earlier check corrupted, or a family regressed. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: modify, delete, create and untouched are all isolated at the consumed seam"

  - id: AC-2
    description: >
      THIS CHECK COLLIDES CORRECTNESS WITH COST, AND IT MEASURES COST AS A SCALING RATIO RATHER
      THAN A CLOCK — a wall-clock ceiling does not discriminate here, because reading 307 MB off a
      warm SSD costs about 2 s (measured at this review). It runs the SAME three-check batch
      through the REAL `runCriteriaChecks` twice, over two fixtures with the SAME file count
      (1,200 ignored files) and 64x different total bytes (4 KiB vs 256 KiB each; 4.7 MB vs
      307 MB). Both must isolate the modify family, and the big fixture must not cost meaningfully
      more than the small one — an implementation whose snapshot is proportional to ignored BYTES
      rather than to the ignored INVENTORY fails the ratio. Measured at this review: HEAD 0.98x
      (flat, but it does not isolate at all), a budgeted reference 0.60x, an unbudgeted
      read-everything reference 3.13x. It also requires the 1,200-file tree intact and
      byte-identical afterwards, and puts an absolute hang guard on each batch.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/judge/ac2-check-isolation-cost.generated.test.ts
      mkdir -p test/judge
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { execFile } from "node:child_process";
      import { mkdtemp, mkdir, readFile, readdir, writeFile } from "node:fs/promises";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { promisify } from "node:util";

      import { describe, expect, test } from "vitest";

      import { runCriteriaChecks } from "../../src/judge/index.js";
      import type { AcceptanceCriterion } from "../../src/types.js";

      const exec = promisify(execFile);
      const git = async (cwd: string, args: string[]): Promise<string> =>
        (await exec("git", args, { cwd })).stdout.trim();

      const COUNT = 1200;
      const ORIGINAL = "ORIGINAL-0000";

      interface BatchResult {
        elapsedMs: number;
        oracleExit: number;
        oracleOutput: string;
        dir: string;
      }

      async function runBatch(kib: number): Promise<BatchResult> {
        const ws = await mkdtemp(join(tmpdir(), "ac2-iso-"));
        await git(ws, ["init", "-b", "main"]);
        await git(ws, ["config", "user.email", "t@t"]);
        await git(ws, ["config", "user.name", "t"]);
        await mkdir(join(ws, "src"), { recursive: true });
        await writeFile(join(ws, "src/a.ts"), "export const a = 1;\n");
        await writeFile(join(ws, ".gitignore"), "results/\n");
        await git(ws, ["add", "-A"]);
        await git(ws, ["commit", "-m", "base"]);

        await mkdir(join(ws, "results"), { recursive: true });
        const filler = "x".repeat(kib * 1024);
        for (let i = 0; i < COUNT; i += 1) {
          await writeFile(join(ws, "results/f" + i + ".bin"), i === 0 ? ORIGINAL : filler);
        }

        const criteria: AcceptanceCriterion[] = [
          {
            id: "VANDAL",
            description: "corrupt exactly one of the 1,200",
            check: "printf CORRUPTED > results/f0.bin\nexit 0",
          },
          {
            id: "ORACLE",
            description: "the next check must still see the original bytes",
            check: [
              'EXPECT="' + ORIGINAL + '"',
              'GOT=$(cat results/f0.bin 2>/dev/null || echo MISSING)',
              'if [ "$GOT" != "$EXPECT" ]; then echo "MODIFY not isolated at scale: f0.bin is [$GOT]"; exit 1; fi',
              "echo ORACLE-OK",
              "exit 0",
            ].join("\n"),
          },
          { id: "TAIL", description: "third check", check: "exit 0" },
        ];

        const startedAt = Date.now();
        const runs = await runCriteriaChecks({ workspaceDir: ws, criteria, checkTimeoutMs: 60_000 });
        const elapsedMs = Date.now() - startedAt;
        const oracle = runs.find((r) => r.criterionId === "ORACLE")!;
        return { elapsedMs, oracleExit: oracle.exitCode, oracleOutput: oracle.output, dir: ws };
      }

      describe("isolation must stay affordable on a real ignored inventory (WP-628)", () => {
        test("cost tracks the ignored INVENTORY, not the ignored BYTES", async () => {
          const small = await runBatch(4);
          const big = await runBatch(256);

          expect(
            small.oracleExit,
            "at 1,200 small ignored files the modify family must be isolated: " +
              small.oracleOutput.slice(0, 400),
          ).toBe(0);
          expect(
            big.oracleExit,
            "at 1,200 ignored files of 256 KiB the modify family must be isolated: " +
              big.oracleOutput.slice(0, 400),
          ).toBe(0);

          const ratio = big.elapsedMs / Math.max(small.elapsedMs, 1);
          expect(
            ratio,
            "same file COUNT, 64x the BYTES (4.7 MB -> 307 MB). A snapshot proportional to bytes " +
              "makes every judge pass on a real workspace unusable — it carries 17,372 ignored " +
              "files. small=" + small.elapsedMs + "ms big=" + big.elapsedMs + "ms ratio=" +
              ratio.toFixed(2) + "x",
          ).toBeLessThan(2);

          expect(
            big.elapsedMs,
            "absolute hang guard: isolation must not become the slowest thing in a judge pass",
          ).toBeLessThan(45_000);

          const entries = await readdir(join(big.dir, "results"));
          expect(
            entries.length,
            "the batch must leave the ignored tree intact — no file the checks never touched may be deleted",
          ).toBe(COUNT);
          expect(
            await readFile(join(big.dir, "results/f0.bin"), "utf8"),
            "after the batch the corrupted file holds its original bytes",
          ).toBe(ORIGINAL);
          expect(
            (await readFile(join(big.dir, "results/f1199.bin"), "utf8")).length,
            "an untouched 256 KiB ignored file must be byte-identical, not truncated or rewritten",
          ).toBe(256 * 1024);
        }, 170_000);
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: isolation broke at scale, cost grew with ignored BYTES rather than inventory, the untouched tree was churned, or the batch hung. vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: the modify family is isolated at 1,200 ignored files and cost tracks inventory, not bytes"

  - id: AC-3
    description: >
      Hygiene and the traps that are cheaper to grep than to drive: strict typecheck over src AND
      test (F-382), eslint over the isolation modules, dogfood-158's write-boundary exemption still
      present and still segment-scoped, WP-623's serial-with-cleanup batch still in place, and the
      DECLARED regression suite green AND grown by at least 4 committed tests (F-356).
    check: |

      }
      grep -qE 'export async function runCriteriaChecks' src/judge/evidence.ts || {
        echo "AC-3 FAIL: trap — the real batch entry point was renamed or removed. This run changes how the tree is RESTORED, not what the batch IS."
        exit 1
      }
      grep -qE 'export function planCheckSideEffectCleanup' src/judge/hermeticity.ts || {
        echo "AC-3 FAIL: trap — the cleanup planner was removed rather than corrected."
        exit 1
      }

      OUT=$(pnpm --filter @chikory/sdk exec vitest run 2>&1)
      ST=$?
      echo "$OUT" | tail -25
      if [ "$ST" -ne 0 ]; then
        echo "AC-3 FAIL: the DECLARED regression suite is RED (vitest exited $ST)"
        exit 1
      fi
      N=$(echo "$OUT" | grep -oE "Tests +[0-9]+ passed" | grep -oE "[0-9]+" | head -1)
      echo "committed suite tests passing: ${N:-UNPARSEABLE} (floor 1667, measured baseline 1663)"
      if [ -z "$N" ]; then
        echo "AC-3 FAIL: could not read a test count out of the vitest summary"
        exit 1
      fi
      if [ "$N" -lt 1667 ]; then
        echo "AC-3 FAIL: durability floor not met — the committed suite did not grow by at least 4 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356)."
        exit 1
      fi
      echo "AC-3 OK: strict typecheck and lint green, dogfood-158 and WP-623 plumbing intact, DECLARED suite green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

      const EARLY_CONCERN =
        "STANDING-CONCERN-MARKER-2b90de: the helper added in step 1 mishandles the empty case";
      const SEAL_CONCERN =
        "SEAL-CONCERN-MARKER-4c17bb: the mandated commands appear only in executor-authored summaries";

      describe.skipIf(address === null)("AC-2: the concern family, the window, and the non-regressions", () => {
        const cleanups: Array<() => Promise<void>> = [];
        afterEach(async () => {

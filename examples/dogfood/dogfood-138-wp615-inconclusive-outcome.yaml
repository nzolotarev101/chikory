    writable: true

# WP-609, live, for the THIRD time. The pre-existing judge + workflow tests are the suite this run
# must not break, and the exact surface it edits. Timed at HEAD 2026-08-12:
# `20 passed | 1 skipped (21 files) · 142 passed | 12 skipped (154 tests)` in **4.13 s**.
#
# FIRST LIVE USE of the `check_timeout_ms:` field WP-612 built (dogfood-137 could not declare it —
# `parseTaskSpec` is `.strict()` and the field did not exist at that run's HEAD). 180 s gives AC-2's
# live Temporal scenarios headroom above the 120 s default; both ACs are still timed against 120 s
# when armed, so the arming table stays meaningful.
regression_suite: pnpm --filter @chikory/sdk exec vitest run test/judge test/workflow
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE — every input and every expected answer is written HERE, driven
      against the real built artifact. It pins the frozen terminal-status contract and both budget
      constants (traps E and F), re-asserts the WP-609/611/612/613/614 surface whole, and re-sweeps
      the F-326 window this run must not reopen: 1001 design-justification lengths against a 44 KB
      suite output, requiring the brief to hold 2000 chars at EVERY one AND requiring the zero-budget
      window to actually be reached, so the sweep cannot pass by never touching the boundary. Runs in
      seconds.
    check: |
      cd packages/sdk-ts && pnpm run typecheck && pnpm exec tsc && \
      OPENAI_COMPAT_BASE_URL=http://127.0.0.1:9 node --input-type=module -e '
      import {pathToFileURL} from "node:url";
      import {readFileSync} from "node:fs";
      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const here=process.cwd();
      const load=(p)=>import(pathToFileURL(join(here,p)).href);
      const mod=await load("dist/index.js");
      const cr=await load("dist/workflow/completion-review.js");
      const ev=await load("dist/judge/evidence.js");
      const {computeVerdict,STANDING_RUBRIC,COMPLETION_REVIEW_RUBRIC,DETERMINISTIC_RUBRIC_IDS,
             applyCheckOverrides,RUBRIC_PRE_EXISTING_SUITE_GREEN,
             RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM}=mod;
      const {buildCompletionReviewBrief}=cr;
      const NEW=RUBRIC_PRE_EXISTING_SUITE_GREEN;
      A(NEW==="pre_existing_suite_still_green",
        "the gate item id is a PUBLIC contract — renaming it silently breaks every spec that "+
        "declares a suite. Got "+JSON.stringify(NEW));

      // 1. trap E — the terminal contract is FROZEN. `TerminalStatus` has no runtime value, so the
      //    DECLARATION is the contract and the declaration is what gets pinned.
      const decl=readFileSync(join(here,"src/types.ts"),"utf8")
        .match(/export type TerminalStatus\s*=([^;]+);/);
      A(decl!==null,"TerminalStatus must stay a declared exported type in src/types.ts");
      const ts=decl[1].split("|").map((s)=>s.trim().replace(/["\x27]/g,"")).filter(Boolean)
        .sort().join(",");
      A(ts==="FAILED,SUCCESS",
        "trap E: TerminalStatus is a frozen CG-1 contract — an inconclusive run seals SUCCESS with "+
        "an ADDITIVE marker, it does not get a third status. Got "+ts);

      // 1b. …and the marker has to LAND somewhere a caller can read. `RunStatusReport` is what a
      //     caller holds after `handle.status()`; today it carries exactly seven fields and none of
      //     them can express "the gate never ran". Name-agnostic on purpose — WHAT the field is
      //     called is the executor is; that it EXISTS, and that it carries the killed check id on a
      //     real run, is AC-2 scenario 1. RED on HEAD.
      const rsr=readFileSync(join(here,"src/types.ts"),"utf8")
        .match(/export interface RunStatusReport \{([\s\S]*?)\n\}/);
      A(rsr!==null,"RunStatusReport must stay a declared exported interface in src/types.ts");
      const fields=[...rsr[1].matchAll(/^\s{2}([A-Za-z_][A-Za-z0-9_]*)\??\s*[:(]/gm)]
        .map((m)=>m[1]);
      const today=["status","currentStep","spentUsd","budgetUsd","lastVerdict","checkpoints",
        "failure"];
      A(fields.length>0,"could not read RunStatusReport fields — the interface shape moved");
      for(const f of today) A(fields.includes(f),
        "RunStatusReport must not LOSE a field a caller depends on; `"+f+"` is gone. Got "+
        JSON.stringify(fields));
      const added=fields.filter((f)=>!today.includes(f));
      A(added.length>0,
        "trap D: an operator must not have to open the journal to learn the gate never ran. "+
        "`RunStatusReport` still carries only "+JSON.stringify(today)+" — none of which can say a "+
        "check DID NOT COMPLETE. The outcome must reach the object a caller actually holds.");

      // 2. trap F — neither budget may move. Both are CM-3 context discipline. The brief cap has no
      //    exported constant, so it is pinned by BEHAVIOR: an oversized design-only brief must clamp
      //    to EXACTLY 2000 — one char more or less and the budget moved.
      A(ev.DEFAULT_CHECK_TIMEOUT_MS===120000,
        "trap F: the per-check DEFAULT stays 120000. Got "+ev.DEFAULT_CHECK_TIMEOUT_MS);
      const clamped=buildCompletionReviewBrief({criterionResults:[],
        rubricResults:[{id:"cumulative_design_coherent",pass:false,justification:"y".repeat(9000)}],
        concerns:[]});
      A(clamped.length===2000,
        "trap F: the brief budget stays exactly 2000 chars. Got "+clamped.length);

      // 3. THE F-326 SWEEP — the hand-fix from the dogfood-137 review must not reopen.
      //    `String.prototype.slice(-0)` is `slice(0)`: the WHOLE string. The defect lives in the
      //    LENGTH dimension, which dogfood-137 own AC did not vary (F-329).
      const CMD="pnpm --filter @chikory/sdk exec vitest run test/judge test/workflow";
      const TAIL="FAILED test/judge/harness.test.ts > settles the row\n"+
        " Test Files  2 failed | 173 passed (177)";
      const BIG="noise line ".repeat(4000)+TAIL;
      A(BIG.length>40000,"the probe output must exceed 40 KB, got "+BIG.length);
      const rubric=[...COMPLETION_REVIEW_RUBRIC,RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM];
      const crit=[{id:"AC-1",description:"d",check:"true"}];
      const settleWith=(designLen,run)=>{
        const out=applyCheckOverrides(
          {criterionResults:[{id:"AC-1",pass:true,justification:"m"}],
           rubricResults:rubric.map((r)=>({id:r.id,
             pass:r.id!=="design_serves_overall_goal",
             justification:r.id==="design_serves_overall_goal"?"d".repeat(designLen):"fine"})),
           concerns:[]},
          crit,rubric,[],[],[],run);
        A(!("error" in out),"overrides must settle, got "+JSON.stringify(out));
        return out.form;
      };
      let sawZeroBudget=false;
      for(let d=1200;d<=2200;d++){
        const form=settleWith(d,{criterionId:NEW,command:CMD,exitCode:1,output:BIG,
          durationMs:4000,infraFailed:false});
        const brief=buildCompletionReviewBrief(form);
        A(brief.length<=2000,
          "F-326: the brief must hold its 2000-char cap at EVERY justification length — "+
          "`slice(-0)` returns the WHOLE string. Overflowed to "+brief.length+" at d="+d);
        A(brief.includes("design_serves_overall_goal"),
          "trap E lineage: reserving room must never squeeze out the other failing finding (d="+d+")");
        if(!brief.includes("Test Files  2 failed")) sawZeroBudget=true;
      }
      A(sawZeroBudget,
        "F-329: the sweep must actually REACH the zero-budget window, or it proves nothing about "+
        "the boundary it exists to guard");

      // 4. WP-613 + WP-609 regressions — membership, and the wiring ERROR with no evidence.
      A(!STANDING_RUBRIC.some((r)=>r.id===NEW)&&!COMPLETION_REVIEW_RUBRIC.some((r)=>r.id===NEW),
        "WP-613 regression: no DEFAULT rubric may carry "+NEW);
      A("error" in applyCheckOverrides(
        {criterionResults:[{id:"AC-1",pass:true,justification:"m"}],
         rubricResults:rubric.map((r)=>({id:r.id,pass:true,justification:"model says fine"})),
         concerns:[]},crit,rubric,[],[],[],undefined),
        "WP-613 regression: the item declared with NO evidence must still be a wiring ERROR");
      const det=new Set(Array.from(DETERMINISTIC_RUBRIC_IDS));
      A(det.has(NEW)&&det.has("no_architecture_violations")&&det.has("no_secrets_introduced")&&
        !det.has("tests_pass"),
        "WP-607/609 regression: the machine-settled set is unchanged. Got "+JSON.stringify([...det]));

      // 5. trap D — the RECORD already carries the infra flag. That is the state BEFORE this run.
      const killed=settleWith(50,{criterionId:NEW,command:CMD,exitCode:1,
        output:"[check timed out after 90000ms]",durationMs:90000,infraFailed:true})
        .rubricResults.find((r)=>r.id===NEW);
      A(killed!==undefined&&killed.pass!==true&&killed.infraFailed===true,
        "trap A/D: a cap-killed row stays a NON-pass carrying `infraFailed: true`. Got "+
        JSON.stringify(killed));

      // 6. a failing suite row NEVER rolls back, infra or not — but a DESTRUCTIVE item still does.
      for(const infra of [false,true]){
        const v=computeVerdict({criterionResults:[{id:"AC-1",pass:true,justification:"ok"}],
          rubricResults:rubric.map((r)=>({id:r.id,pass:r.id!==NEW,justification:"scripted",
            ...(r.id===NEW&&infra?{infraFailed:true}:{})})),concerns:[]},{},rubric);
        A(v.kind!=="ROLLBACK","a failing "+NEW+" must NEVER roll back (infra="+infra+"), got "+
          JSON.stringify(v));
      }
      A(computeVerdict({criterionResults:[{id:"AC-1",pass:true,justification:"ok"}],
        rubricResults:STANDING_RUBRIC.map((r)=>({id:r.id,
          pass:r.id!=="no_secrets_introduced",justification:"scripted"})),concerns:[]},
        {},STANDING_RUBRIC).kind==="ROLLBACK",
        "a failing DESTRUCTIVE standing item must still return ROLLBACK (CONTRACTS.md §4 rule 1)");

      // 7. WP-611 regression — a pure DESIGN finding keeps today wording.
      const designOnly=buildCompletionReviewBrief({criterionResults:[],
        rubricResults:[{id:"design_serves_overall_goal",pass:false,justification:"x".repeat(400)}],
        concerns:[]});
      A(/only design/i.test(designOnly)&&designOnly.includes("DESIGN REVIEW BRIEF"),
        "the WP-537/F-196 design path must keep exactly its instruction, got "+
        JSON.stringify(designOnly.slice(0,200)));

      console.log("AC-1 OK: the terminal status set is still exactly SUCCESS/FAILED, both budgets "+
        "are unmoved, the brief holds 2000 chars across 1001 justification lengths WITH the "+
        "zero-budget window reached, and the WP-609/611/612/613 surface is unregressed");
      '

  - id: AC-2
    description: >
      THIS CHECK OWNS ITS ORACLE, AND IT READS REAL JOURNALS. Four REAL Temporal runs, each driven to
      a terminal seal, each read from its own journal's `terminal` entry. Scenario 1 kills the suite
      at the cap the SPEC declares and requires the outcome to be honest in BOTH registers: the reason
      must say the check did not complete and name it, and — with the `reason` key DELETED from the

            async runStep(input) {
              const file = join(input.workspaceDir, "src/feature.ts");
              await mkdir(dirname(file), { recursive: true });
              await writeFile(file, "export const feature = 1;\\n");
              const [diffRef, transcriptRef] = await Promise.all([
                ctx.store.put("adapter diff", { kind: "diff", summary: "adapter diff" }),
                ctx.store.put("adapter transcript", { kind: "transcript", summary: "t" }),
              ]);
              return {
                status: "SUCCESS" as const, diffRef, transcriptRef, claimsComplete: true,
                summary: "wrote src/feature.ts", toolCalls: 1,
                tokens: { input: 100, output: 50 },
                costUsd: 0.01, costEstimated: false, durationMs: 0,
              };
            },
          }),
        };
      }

      // Every item answered PASS on purpose, so only a delivery that lets the COMMAND settle the
      // row — and the SEAL read its infra flag — can change any outcome below.
      const withSuite = (ids: readonly { id: string }[]): JudgeForm["rubricResults"] => [
        ...ids.map((r) => ({ id: r.id, pass: true, justification: "scripted — model says fine" })),
        { id: ITEM, pass: true, justification: "model says fine" },
      ];
      const stepForm = (): JudgeForm => ({
        criterionResults: [{ id: "AC-1", pass: true, justification: "scripted judge" }],
        rubricResults: withSuite(STANDING_RUBRIC), concerns: [],
      });
      const reviewForm = (): JudgeForm => ({
        criterionResults: [], rubricResults: withSuite(COMPLETION_REVIEW_RUBRIC), concerns: [],
      });
      // Scenario 4: NO suite declared, and a design item genuinely fails. The SEALING verdict has
      // to carry a rubric failure or the completion review is skipped outright — a first-verdict
      // seal with a clean rubric and no suite short-circuits (src/workflow/completion-review.ts:75).
      const designStepForm = (): JudgeForm => ({
        criterionResults: [{ id: "AC-1", pass: true, justification: "scripted judge" }],
        rubricResults: STANDING_RUBRIC.map((r) => ({
          id: r.id, pass: r.id !== "design_serves_overall_goal",
          justification: r.id === "design_serves_overall_goal"
            ? "the step introduces a parallel builder rather than extending the existing one"
            : "scripted — model says fine",
        })),
        concerns: [],
      });
      const designReviewForm = (): JudgeForm => ({
        criterionResults: [],
        rubricResults: COMPLETION_REVIEW_RUBRIC.map((r) => ({
          id: r.id, pass: r.id !== "cumulative_design_coherent",
          justification: r.id === "cumulative_design_coherent"
            ? "the diff introduces a second composition seam that duplicates the existing builder"
            : "scripted review",
        })),
        concerns: [],
      });

      describe.skipIf(address === null)("AC-2 — an inconclusive outcome says so", () => {
        const cleanups: Array<() => Promise<void>> = [];
        afterEach(async () => { while (cleanups.length > 0) await cleanups.pop()!(); });

        async function runOne(
          command: string | undefined,
          forms: { step: () => JudgeForm; review: () => JudgeForm },
        ) {
          const wire = await startFakeJudgeWire(
            [forms.step(), forms.step(), forms.step(), forms.step()],
            { reviewForms: [forms.review(), forms.review()] },
          );
          cleanups.push(() => wire.close());
          const tmp = await mkdtemp(join(tmpdir(), "ac2-inconc-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const repoUrl = await initSourceRepo(join(tmp, "src"), {});
          const dataDir = join(tmp, "data");
          const taskQueue = "tq-" + randomUUID();
          const worker = await createRunnerWorker({
            adapters: writingRegistry(), address: address!, taskQueue, dataDir,
            workflowBundlePath: bundlePath!,
            routerOptions: { baseUrls: { "openai-compat": wire.url } },
          });
          const workerDone = worker.run();
          const runner = createTemporalRunner({ address: address!, taskQueue, dataDir });
          cleanups.push(async () => {
            worker.shutdown(); await workerDone; await runner.close();
          });
          const spec = {
            ...makeJudgedSpec({ repoUrl, cadence: 1, maxSteps: 4 }),
            ...(command === undefined ? {} : { regressionSuite: command }),
            checkTimeoutMs: DECLARED_CAP_MS,
          } as unknown as Parameters<typeof runner.start>[0];
          const startedAt = Date.now();
          const handle = await runner.start(spec);
          const report = await waitFor(async () => {
            const r: RunStatusReport = await handle.status();
            return TERMINAL_STATUSES.includes(r.status) ? r : undefined;
          }, { what: "terminal status", timeoutMs: 180_000, intervalMs: 1000 });
          const elapsedMs = Date.now() - startedAt;
          const j = new Journal(journalPath(dataDir, handle.runId));
          let terminals: Record<string, unknown>[];
          let verdicts: string[];
          try {
            terminals = j.entries("terminal").map((e) => e.payload as Record<string, unknown>);
            verdicts = j.entries("verdict").map((e) => JSON.stringify(e.payload));
          } finally { j.close(); }
          expect(terminals.length).toBeGreaterThan(0);
          const seal = terminals[terminals.length - 1]!;
          const reason = String(seal.reason ?? "");
          // trap B: with the prose DELETED, is anything left that names the check?
          const { reason: _dropped, ...withoutReason } = seal;
          return {
            report, seal, reason, withoutReason: JSON.stringify(withoutReason),
            verdicts, elapsedMs, runId: handle.runId, dataDir,
          };
        }

        test("scenario 1 — a cap-killed suite seals an INCONCLUSIVE outcome, in words and in a field", async () => {
          const r = await runOne("sleep 30; exit 0", { step: stepForm, review: reviewForm });

          // trap A: the code was never condemned.
          expect(r.report.status).toBe("SUCCESS");
          expect(r.verdicts.some((v) => v.includes("\\"ROLLBACK\\""))).toBe(false);
          const kept = await readFile(
            join(r.dataDir, "runs", r.runId, "workspace", "src", "feature.ts"), "utf8");
          expect(kept).toContain("feature");
          // WP-612 unregressed: killed at the DECLARED 3 s cap, not the 120 s default.
          expect(r.elapsedMs).toBeLessThan(20_000);

          // the reason must say what happened, and NAME the check.
          expect(r.reason).not.toContain("design findings recorded");
          expect(r.reason).not.toContain("deterministic rubric failure");
          expect(r.reason).toContain(ITEM);
          expect(/did not complete|inconclusive/i.test(r.reason)).toBe(true);

          // trap B: DELETE the prose. A machine-readable marker must survive it.
          expect(r.withoutReason).toContain(ITEM);

          // trap D: and it must reach the object a CALLER holds, not only the journal. Today
          // RunStatusReport is status/currentStep/spentUsd/budgetUsd/lastVerdict/checkpoints/
          // failure — none of which can express "the gate never ran".
          expect(JSON.stringify(r.report)).toContain(ITEM);
        }, 300_000);

        test("scenario 2 — a genuine red still seals FAILED, and carries NO marker", async () => {
          const r = await runOne("exit 1", { step: stepForm, review: reviewForm });
          expect(r.report.status).not.toBe("SUCCESS");
          expect(r.reason).toContain("deterministic rubric failure");
          // trap C: the inverse squeeze — a real red is not inconclusive.
          expect(r.withoutReason).not.toContain(ITEM);
        }, 300_000);

        test("scenario 3 — a green suite still seals SUCCESS, and carries NO marker", async () => {
          const r = await runOne("exit 0", { step: stepForm, review: reviewForm });
          expect(r.report.status).toBe("SUCCESS");
          expect(r.withoutReason).not.toContain(ITEM);
        }, 300_000);

        test("scenario 4 — an ordinary design finding keeps EXACTLY today wording and no marker", async () => {
          const r = await runOne(undefined, { step: designStepForm, review: designReviewForm });
          expect(r.report.status).toBe("SUCCESS");
          // trap C: the WP-537/F-196 wording is not collateral damage.
          expect(r.reason).toContain("completion review: design findings recorded —");
          expect(r.reason).toContain("cumulative_design_coherent");
          expect(/did not complete|inconclusive/i.test(r.reason)).toBe(false);
          expect(r.withoutReason).not.toContain(ITEM);
          expect(r.withoutReason).not.toContain("cumulative_design_coherent");
        }, 300_000);
      });
      `;
      writeFileSync(target, SRC);
      const res=spawnSync("pnpm",["exec","vitest","run",
        "test/runner/ac2-inconclusive.generated.test.ts"],{stdio:"inherit"});
      // Clean up BEFORE asserting — A() exits the process, which would skip a finally block
      // and leave the generated file behind to poison the next pass.
      rmSync(target,{force:true});
      A(res.status===0,
        "scenario 1 reads the REAL terminal entry of a REAL Temporal run and deletes its `reason` "+
        "key: a prose-only fix (trap B) has nothing left. Scenarios 2-4 are the inverse squeeze — "+
        "a genuine red, a green suite and an ordinary design finding must each keep exactly "+
        "today outcome. vitest exited "+res.status);
      console.log("AC-2 OK: a cap-killed suite seals SUCCESS whose reason names the check and says "+
        "it did not complete, with a machine-readable marker that survives deleting the prose, "+
        "while a red, a green and a design finding all keep exactly today outcome and no marker");
      '

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): a converged out-of-rubric escalation — every criterion and every rubric item
# passing — auto-seals SUCCESS with this policy present, instead of parking overnight for a human.
unattended:
  escalation: seal_resumable_failed

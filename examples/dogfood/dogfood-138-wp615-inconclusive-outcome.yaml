# Plain: the last three runs built a gate that runs a project's own tests before a delivery is
# allowed to succeed. dogfood-137 stopped it failing a run just because the test command was slow.
# But the outcome it produces instead is a lie: a run whose test command was KILLED before it
# finished now seals SUCCESS, and the one-line reason says a *design finding* was recorded — the
# same words a cosmetic architecture nit gets. Nothing outside the journal says the gate never ran.
# This run makes the outcome tell the truth, in words a human reads and in a field a tool can read.
# WP: WP-615 (a gate that could not finish must SAY so)
# Ladder-rung: 0 (OFF-LADDER by necessity — rung 5 is operator-gated today; see WHY)
# Thesis-KPI: judge true-positives pre-land, and the THIRD live proof of the WP-609 gate — this
#   spec declares `regression_suite:` AND (first live use) `check_timeout_ms:`, so its own journal
#   must again show the row settled from a real exit code, carried by NO per-step judge pass.
# Format: loose — the outcome is fixed, the wiring is the executor's
#
# Launch mode: RUN (single node — one defect, one seam, the shape 136/137 both proved in 1 step).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-137 review, 2026-08-12):
#   Progression gate: ✅ PROGRESSING (trailing-3 harness-meta 0/3, cap intact). The default headline
#   is P3-rung-5, the phase exit gate. Its two blockers were RE-MEASURED AGAIN this review (F-203:
#   re-measure, never re-litigate) and both still stand, both OPERATOR work rather than product gaps:
#     1. `brownfield-001`'s zod v3 → v4 gold patch. MEASURED 2026-08-12: `find benchmarks/tasks -name
#        '*brownfield-001*'` returns ONLY
#        `benchmarks/tasks/brownfield-001-dependency-major-upgrade.yaml`, whose only status line is
#        `status: pinned` (:24) — no `fix_ref`, no gold artifact. 3–6 h of operator research.
#     2. A re-run of BOTH arms so stored per-task results carry `repoRef`. MEASURED 2026-08-12:
#        `grep -rl repoRef benchmarks/results/ | wc -l` = **0**. Hours of quota, and dogfood-122
#        proved an LLM executor must not supervise a quota-bound multi-hour suite.
#
#   EIGHTH consecutive off-ladder headline. Rung 5 exists to publish a reliability number. The gate
#   that decides whether a run may call itself reliable currently reports SUCCESS when it never ran.
#   Publishing a number produced by a gate that mislabels its own inconclusive state is worse than
#   not publishing one.
#
# THE MEASURED PREMISE (re-measure before building; do not re-litigate):
#   * **F-327 — a cap-killed suite seals SUCCESS and calls itself a design finding.** PROVEN on a
#     live Temporal run during the dogfood-137 review (`regressionSuite: "sleep 30; exit 0"`,
#     `checkTimeoutMs: 3000`). The journal's terminal entry, verbatim:
#         {"status":"SUCCESS","reason":"completion review: design findings recorded —
#          pre_existing_suite_still_green","lastCheckpoint":"…"}
#     and `report.failure` is `undefined`.
#   * **Root cause: a missing third branch.** `src/workflow/agent-loop.ts` has exactly two outcomes
#     after a completion review with rubric failures — "deterministic fail → FAILED" (`:1113-1118`
#     path A, `:1132-1137` path B) and "everything else → SUCCESS: design findings recorded". WP-612
#     correctly removed the infra-killed row from `deterministicFails` (`:1103`, `:1122`), so it now
#     falls into the *else*. The FAILED seal was withdrawn; no honest replacement was added.
#   * **The record is already correct — only the OUTCOME is wrong.** `applyCheckOverrides` sets
#     `infraFailed: true` and a justification reading `DID NOT COMPLETE (killed at the per-check cap)
#     — infra failure, not a code red` (`src/judge/harness.ts:203-216`). The information exists at
#     the row. It does not reach the seal.
#   * **`TerminalStatus` is a FROZEN CONTRACT.** MEASURED 2026-08-12: `src/types.ts:328` is
#     `export type TerminalStatus = "SUCCESS" | "FAILED";`. CG-1 requires an explicit terminal; a
#     third status would break every consumer (`RunStatusReport`, the ledger, chain handoff,
#     `chikory trace`). The marker must be **ADDITIVE**, never a new status.
#   * **The additive shape already has a precedent, twice.** The `terminal` journal payload is built
#     from optional spreads — `...(input.resumable === true ? { resumable: true } : {})` and
#     `...(input.remediation !== undefined ? { remediation: input.remediation } : {})`
#     (`src/runner/activities.ts:2868-2881`), fed by `seal()`'s `opts` (`src/workflow/agent-loop.ts:
#     296-303`). `chikory trace` already renders such a marker as a suffix on the terminal line
#     (`src/cli/trace.ts:427-434`). Nothing new needs inventing; the pattern needs following.
#   * **A prose-only fix is not a fix.** Every downstream consumer of a terminal — the ledger, a
#     chain's fan-in, `chikory trace`, an operator's script — would still have to regex a sentence.
#     AC-2 therefore asserts the marker survives with the `reason` string REMOVED from the payload.
#   * **The `unattended:` block below is not decoration** (F-322): without it a converged
#     out-of-rubric escalation parks for a human instead of auto-sealing
#     (`src/workflow/agent-loop.ts:1213-1224`). dogfood-135 parked 11h 59m 31s for want of it.
#   * **F-326 was hand-fixed in the dogfood-137 review and this run must not regress it**
#     (`src/workflow/completion-review.ts:168-189`). `String.prototype.slice(-0)` is `slice(0)` — the
#     WHOLE string — and the budgeted brief had no cap check on its final return, so a fixed part
#     landing within 4 chars of the cap emitted the entire suite output: 46,095 chars measured
#     against a 2000-char cap. AC-1 §3 re-sweeps 1001 justification lengths (F-197: a run cannot
#     prove the fix it delivers, so the NEXT run carries the assertion).
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. **Sealing FAILED again.** The cheapest way to make the outcome "honest" is to fail the run —
#      which re-opens F-320 and undoes WP-612 entirely. AC-2 scenario 1 requires the terminal status
#      NOT to be FAILED and the workspace files to survive.
#   B. **Editing only the prose.** A better `reason:` sentence with nothing machine-readable behind
#      it leaves every tool downstream regexing English. AC-2 scenario 1 DELETES the `reason` key
#      from the terminal payload and still requires the killed item to be named in what remains.
#   C. **Marking everything inconclusive.** The inverse squeeze. A genuine red must still seal FAILED
#      with `deterministic rubric failure` and NO marker; a green suite must still seal SUCCESS with
#      no marker; a real design finding on a run that declares no suite must keep the WP-537/F-196
#      wording EXACTLY. AC-2 scenarios 2, 3 and 4 pin all three.
#   D. **Fixing it at the record instead of the outcome.** The row already carries `infraFailed:
#      true` — that is the state of the world BEFORE this run. AC-2 reads the TERMINAL entry.
#   E. **Inventing a third TerminalStatus.** `"INCONCLUSIVE"` as a status breaks the frozen CG-1
#      contract. AC-1 §1 pins the terminal status set; AC-2 requires SUCCESS in scenario 1.
#   D2. **Leaving the marker in the journal only.** `RunStatusReport` is what a caller holds after
#      `handle.status()`, and today its seven fields cannot express "the gate never ran". AC-1 §1b
#      requires the interface to GROW (name-agnostic — the field's name is the executor's call, and
#      no existing field may be lost); AC-2 scenario 1 requires the REAL report of a REAL run to
#      name the killed check. Structure and behavior, asserted separately.
#   F. **Raising a cap or loosening a gate to make room.** AC-1 pins `COMPLETION_BRIEF_MAX_CHARS ===
#      2000` and `DEFAULT_CHECK_TIMEOUT_MS === 120000` as unchanged constants.
#   G. **Proving it with a test the executor authors.** AC-1 owns its oracle against the real built
#      artifact; AC-2 reads the REAL journal of REAL Temporal runs.
#
# NOT IN SCOPE: F-330 — `checkTimeoutMs` unforwarded at the SECOND `runJudgePass` call site
#   (`src/chain/activities.ts:437`). That pass is built with `criteria: []` and no `regressionSuite`,
#   so it executes no checks and there is NO timing signal an acceptance criterion could read; an
#   unsettleable criterion drives fabrication (WP-546/F-221). Track-B until a chain-level review
#   declares a suite. Also out: F-328/WP-616 (the unbounded justification — a separate design call);
#   WP-606/F-306 executor-summary telemetry; making `regression_suite` required; `tests_pass` and its
#   JD-4 override (`src/judge/harness.ts:148-171` unchanged).

name: dogfood-138-wp615-inconclusive-outcome
wp: WP-615
goal: >
  A gate that could not finish must say so — an inconclusive outcome is not a design finding.

  dogfood-137 stopped a killed regression suite from sealing the run FAILED. It did not give the run
  an honest thing to say instead. Today a suite killed at its per-check cap produces, verbatim on a
  live run, a SUCCESS seal whose reason is the design-findings sentence —
  naming the suite gate — and no recorded failure. The gate did not pass. It never ran to
  completion. The one line an operator reads, and every field a tool reads, both say otherwise.

  Make these true:

    * **The seal reason says what happened.** When the only thing standing between a run and SUCCESS
      is a deterministic rubric row that was KILLED rather than failed, the run's reason must say the
      check DID NOT COMPLETE and must NAME the check. It must not reuse the design-findings wording,
      which means something else entirely.

    * **A tool can tell without reading English.** The terminal record must carry a machine-readable
      marker naming the check that did not complete — one a consumer reads as a FIELD, not by
      pattern-matching a sentence. Follow the shape already there: the seal helper's options and the optional
      spreads on the terminal journal payload (src/runner/activities.ts:2868-2881) are how
      resumable and remediation already travel, and chikory trace already renders such a marker
      on the terminal line (src/cli/trace.ts:427-434). Surface it on the run's status report too, so
      a caller holding a `RunStatusReport` learns it without opening the journal.

    * **`TerminalStatus` does not grow a third member.** src/types.ts:328 is a frozen CG-1 contract
      (SUCCESS or FAILED, and nothing else). An inconclusive run still seals SUCCESS — its code was never
      condemned, its files stay on disk, and no ROLLBACK is issued. The marker is ADDITIVE.

    * **Nothing else changes its outcome.** A deterministic row failing on a real nonzero exit code
      with no infra kill still seals FAILED with its `deterministic rubric failure` wording
      and carries no marker. A green suite still seals SUCCESS with no marker. A run that declares no
      suite and draws an ordinary design finding still seals SUCCESS with today's
      completion-review design-findings wording, exactly, and no marker.

  Everything WP-609/WP-611/WP-612/WP-613/WP-614 proved stays proven, and the acceptance criteria
  re-assert it: the suite command runs at the seal and never on a per-step pass, once on a clean run;
  `pre_existing_suite_still_green` belongs to NEITHER default rubric and joins the effective rubric
  only on the completion review of a run that declares a suite; the override still ERRORS when the
  item is declared with no evidence; a cap-killed row stays a NON-pass carrying `infraFailed: true`
  and is killed at the cap the SPEC declared; the repair brief still holds an unchanged 2000-char cap
  at EVERY design-justification length and still carries the failing test names; a failing DESTRUCTIVE
  standing item still returns ROLLBACK (CONTRACTS.md §4 rule 1).

  If an existing test pins a shape this change must alter, update its expectation and say plainly in
  the step summary that you did — do not delete it, and do not weaken it into a tautology.

  Constraints: TypeScript stays strict ESM with named exports and no `any`; no new dependency, no
  provider SDK, no API key, no global install. Workflow code stays deterministic and replay-safe.
  src/types.ts is the CORE layer — it must not import from src/judge/, src/workflow/ or src/runner/.
  Neither the completion-brief character budget (2000) nor `DEFAULT_CHECK_TIMEOUT_MS` (120000) may change.
  Project commands run sequentially inside the already-activated Devbox environment, so invoke pinned
  tools directly and never nest `devbox run`.

  VERIFY YOUR OWN WORK: before you finish, run `pnpm run build`, `pnpm run lint`, `pnpm run typecheck`
  (which compiles the TEST project too) and the FULL test suite, and report the ACTUAL command you ran
  and the ACTUAL counts it printed. The full sdk-ts suite takes ~50 s. Do not write that the suite
  passed unless you invoked it and read its total line. Run each of those FOUR commands once and read
  its own output — do not re-run one command four times under four different names (F-325). This run
  also declares its own regression suite, so a red judge/workflow test will block the seal whatever
  your summary says.

repos:

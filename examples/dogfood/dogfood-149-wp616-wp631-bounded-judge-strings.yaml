    check: |
      cd packages/sdk-ts || exit 1
      pnpm run typecheck || { echo "AC-3 FAIL: strict typecheck is red"; exit 1; }
      pnpm exec eslint src/workflow/agent-loop.ts src/judge/verdict.ts src/judge/harness.ts src/judge/prompt.ts src/workflow/completion-review.ts || { echo "AC-3 FAIL: eslint is red on the modules this WP touches"; exit 1; }
      if ! grep -q "standingConcerns.includes(concern)" src/workflow/agent-loop.ts; then
        echo "AC-3 FAIL: the free-text concerns dedup guard changed — trap E (out of scope)"
        exit 1
      fi
      if ! grep -q "isRubricItemSettledAgainstWholeDelivery" src/workflow/agent-loop.ts; then
        echo "AC-3 FAIL: the settled-clear call is gone — trap F (the settling rule is out of scope and a settled id must still clear completely)"
        exit 1
      fi
      OUT=$(pnpm exec vitest run test/runner/ 2>&1)
      ST=$?
      echo "$OUT" | tail -30
      if [ "$ST" -ne 0 ]; then
        echo "AC-3 FAIL: the committed test/runner tree is RED (vitest exited $ST). If a standing-findings test failed, you likely broke the settling rule, the never-outrun guarantee, or WP-630's accumulation."
        exit 1
      fi
      N=$(echo "$OUT" | grep -oE "Tests +[0-9]+ passed" | grep -oE "[0-9]+" | head -1)
      echo "committed test/runner tests: ${N:-UNPARSEABLE} (floor 399, measured baseline 397)"
      if [ -z "$N" ]; then
        echo "AC-3 FAIL: could not read a test count out of the vitest summary"
        exit 1
      fi
      if [ "$N" -lt 399 ]; then
        echo "AC-3 FAIL: durability floor not met — the committed runner tree did not grow by at least 2 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356), and a repo test transcribed from one inherits its blind spots (F-360)."
        exit 1
      fi
      echo "AC-3 OK: strict TS, lint clean, out-of-scope guarantees byte-intact, the committed runner tree is green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

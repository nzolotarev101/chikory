          expect(
            decision.rationale.includes(RUBRIC_PRE_EXISTING_SUITE_GREEN),
            "bounding the rationale must not cost it the id of the item that failed",
          ).toBe(true);
        });

        test("the remediation brief can STILL reach the raw suite log (trap A: bounding at the source is a WP-614 revert)", () => {
          const brief = buildCompletionReviewBrief(suiteFailForm());
          expect(brief.length).toBeLessThanOrEqual(BRIEF_CAP);
          expect(
            brief.includes(LOG_LINE),
            "the brief no longer carries any of the suite output — the raw log was removed " +
              "from the surface the brief budgets from, which reverts WP-614 instead of " +
              "fixing WP-616. THIS ASSERTION IS GREEN ON HEAD and must STAY green.",
          ).toBe(true);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: computeVerdict still returns an unbounded rationale, or the fix took the raw suite log away from the brief (trap A, a WP-614 revert). vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: bounded verdict rationale, failing rubric id preserved, brief still reaches the raw suite log"

  - id: AC-3

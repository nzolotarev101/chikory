      const LOG_LINE = "FAIL some/spec.test.ts > case";
      const RAW_LOG = (LOG_LINE + "\n").repeat(1500);

      function suiteFailForm(): JudgeForm {
        return {
          criterionResults: [
            { id: "AC-1", pass: true, justification: "confirmed" },
          ],
          rubricResults: [
            ...STANDING_RUBRIC.map((r) => ({
              id: r.id,
              pass: true,
              justification: "confirmed",
            })),
            {
              id: RUBRIC_PRE_EXISTING_SUITE_GREEN,

      import { describe, expect, test } from "vitest";

      import {
        computeVerdict,
        RUBRIC_PRE_EXISTING_SUITE_GREEN,
        RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM,
        STANDING_RUBRIC,
        type JudgeForm,

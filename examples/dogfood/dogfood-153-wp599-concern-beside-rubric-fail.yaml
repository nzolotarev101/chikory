  - url: /Users/nikitazolotarev/repos/chikory
    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# MEASURE it at the launch commit rather than trusting this line (F-342, dogfood-140).
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE (the feedback policy AND the verdict that must not move). It
      drives the REAL feedback path and the REAL `computeVerdict` over the exact form the premise
      probe measured — no mocks, no re-implementation — and asserts the blocking concern now
      reaches the executor while the verdict, the escalate class and the healthy-path silence are
      all unchanged. It also drives the input families a naive fix gets wrong: a MINOR concern
      beside the same rubric failure, an UNMARKED concern (which must count as blocking), and a
      wholly clean pass. Expected values are written into this check, not read from a test file
      the executor authors.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/workflow/ac1-concern-beside-rubric-fail.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import { computeVerdict } from "../../src/judge/verdict.js";
      import * as remediation from "../../src/workflow/remediation.js";
      import type { JudgeForm, RubricItem } from "../../src/types.js";

      const BLOCKING =
        "the new retry wrapper swallows the AbortError, so a cancelled run can never stop";
      const COSMETIC = "trailing whitespace in the docstring above the wrapper";

      const RUBRIC: RubricItem[] = [
        { id: "tests_pass", description: "tests pass", destructive: false },
        { id: "scope_matches_instruction", description: "in scope", destructive: false },
        { id: "no_unrelated_deletions", description: "no deletions", destructive: true },
      ];

      function form(over: Partial<JudgeForm>): JudgeForm {
        return {
          criterionResults: [{ id: "AC-1", pass: true, justification: "check exited 0" }],
          rubricResults: [
            { id: "tests_pass", pass: true, justification: "ok" },
            { id: "scope_matches_instruction", pass: false, justification: "touched an unrelated module" },
            { id: "no_unrelated_deletions", pass: true, justification: "ok" },
          ],
          concerns: [],
          ...over,
        } as JudgeForm;
      }

      // The string the loop hands to the next step. The executor may assemble it in
      // buildCriterionFeedback or in a sibling it composes with; both are acceptable, so this
      // check asks the module for whichever exported function produces it and requires that
      // exactly one such producer exists.
      function feedbackOf(f: JudgeForm): string | undefined {
        const mod = remediation as unknown as Record<string, unknown>;
        const producer = mod["buildCriterionFeedback"];
        if (typeof producer !== "function") {
          throw new Error(
            "buildCriterionFeedback is no longer exported from src/workflow/remediation.ts — " +
              "the per-pass executor feedback must stay a named, testable export, not an " +
              "expression inlined at the agent-loop call site.",
          );
        }
        return (producer as (x: JudgeForm) => string | undefined)(f);
      }

      describe("AC-1 WP-599/F-288: a blocking concern beside a rubric failure reaches the executor", () => {
        test("the blocking concern rides into the next step's feedback", () => {
          const fb = feedbackOf(form({ concerns: [BLOCKING], concernSeverities: ["blocking"] } as Partial<JudgeForm>));
          expect(
            fb,
            "with all criteria passing this returns undefined on HEAD, so judgeFeedback is empty " +
              "and the executor is never told. That same concern is accumulated into " +
              "standingConcerns and can CONDEMN the run at the seal.",
          ).toBeDefined();
          expect(fb!).toContain(BLOCKING);
        });

        test("a MINOR concern beside the same rubric failure puts nothing there", () => {
          const fb = feedbackOf(form({ concerns: [COSMETIC], concernSeverities: ["minor"] } as Partial<JudgeForm>));
          expect(
            fb === undefined || !fb.includes(COSMETIC),
            "WP-548's floor is the whole point of routing this through blockingConcerns: a nit " +
              "must not spend a step of the executor's attention.",
          ).toBe(true);
        });

        test("an UNMARKED concern counts as blocking (every legacy judge output)", () => {
          const fb = feedbackOf(form({ concerns: [BLOCKING] }));
          expect(
            fb,
            "blockingConcerns treats an absent severity as blocking so a judge cannot silence " +
              "itself by saying nothing; reading the severities array directly re-introduces " +
              "exactly the hole WP-548 closed.",
          ).toBeDefined();
          expect(fb!).toContain(BLOCKING);
        });

        test("silence stays cheap: a clean pass still produces NO feedback at all", () => {
          expect(
            feedbackOf(form({})),
            "a healthy pass must add nothing to the executor's prompt. A helper that always " +
              "returns a header with an empty list grows every step's context for nothing.",
          ).toBeUndefined();
        });

        test("failing-criterion evidence is still carried, not replaced", () => {
          const fb = feedbackOf(
            form({
              criterionResults: [{ id: "AC-2", pass: false, justification: "the marker is absent" }],
              concerns: [BLOCKING],
              concernSeverities: ["blocking"],
            } as Partial<JudgeForm>),
          );
          expect(fb).toBeDefined();
          expect(fb!, "the WP-519 per-pass criterion feedback must survive").toContain("AC-2");
          expect(fb!).toContain("the marker is absent");
          expect(fb!).toContain(BLOCKING);
        });

        test("TRAP: the verdict does not move — PROCEED, and escalateClass stays absent", () => {
          const v = computeVerdict(
            form({ concerns: [BLOCKING], concernSeverities: ["blocking"] } as Partial<JudgeForm>),
            {},
            RUBRIC,
          );
          expect(
            v.kind,
            "widening rule 4 by deleting its rubricFails.length === 0 guard hands F-154's " +
              "force-seal-on-approve semantics to a run with a RED rubric row: one approval " +
              "would seal SUCCESS past a failing rubric item.",
          ).toBe("PROCEED");
          expect(v.escalateClass).toBeUndefined();
        });

        test("TRAP: rule ordering is unchanged — a destructive rubric fail still ROLLBACKs first", () => {
          const v = computeVerdict(
            form({
              rubricResults: [
                { id: "tests_pass", pass: true, justification: "ok" },
                { id: "scope_matches_instruction", pass: false, justification: "drift" },
                { id: "no_unrelated_deletions", pass: false, justification: "deleted a module" },
              ],
              concerns: [BLOCKING],
              concernSeverities: ["blocking"],
            } as Partial<JudgeForm>),
            {},
            RUBRIC,
          );
          expect(v.kind).toBe("ROLLBACK");
        });

        test("TRAP: the BRANCH rule still reads every concern's text, minor included", () => {
          const v = computeVerdict(
            form({
              concerns: ["consider a branch to explore the alternative layout"],
              concernSeverities: ["minor"],
            } as Partial<JudgeForm>),
            {},
            RUBRIC,
          );
          expect(v.kind).toBe("BRANCH");
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: the blocking concern does not reach the executor feedback, or a minor/unmarked concern is handled wrong, or the healthy path grew a string, or the verdict/rule ordering moved. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: blocking rides, minor does not, unmarked fails safe, silence stays cheap, verdict and rule ordering unchanged"

  - id: AC-2
    description: >
      BOTH consumers, over ONE form, in ONE assertion set. Telling the executor must not stop the
      seal from adjudicating: the same blocking concern must reach the per-pass executor feedback
      (false on HEAD) AND `accumulateStandingConcerns` (true on HEAD, and must stay true). Drives
      both real functions — the trap it rejects is "fixing" the executor's blindness by MOVING the
      concern out of standingConcerns instead of adding a second consumer, which a check that only
      asserted the new half would happily pass.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/workflow/ac2-seal-still-adjudicates.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import { accumulateStandingConcerns } from "../../src/workflow/standing-concerns.js";
      import * as remediation from "../../src/workflow/remediation.js";
      import type { JudgeForm } from "../../src/types.js";

      const BLOCKING = "the retry wrapper swallows the AbortError";
      const COSMETIC = "trailing whitespace in the docstring";

      function form(over: Partial<JudgeForm>): JudgeForm {
        return {
          criterionResults: [{ id: "AC-1", pass: true, justification: "ok" }],
          rubricResults: [{ id: "scope_matches_instruction", pass: false, justification: "drift" }],
          concerns: [],
          ...over,
        } as JudgeForm;
      }

      function feedbackOf(f: JudgeForm): string | undefined {
        const producer = (remediation as unknown as Record<string, unknown>)["buildCriterionFeedback"];
        if (typeof producer !== "function") {
          throw new Error(
            "buildCriterionFeedback is no longer exported from src/workflow/remediation.ts — " +
              "the per-pass executor feedback must stay a named, testable export.",
          );
        }
        return (producer as (x: JudgeForm) => string | undefined)(f);
      }

      describe("AC-2 WP-599: one concern, BOTH consumers — the executor and the seal", () => {
        test("a blocking concern beside a rubric failure reaches the executor AND the seal", () => {
          const f = form({ concerns: [BLOCKING], concernSeverities: ["blocking"] } as Partial<JudgeForm>);
          const standing: string[] = [];
          accumulateStandingConcerns(standing, f);
          const fb = feedbackOf(f);
          expect(
            fb !== undefined && fb.includes(BLOCKING),
            "the executor half: on HEAD this is undefined, so the agent is never told about a " +
              "concern the seal will later condemn the run over.",
          ).toBe(true);
          expect(
            standing,
            "the seal half: handing the concern to the executor must ADD a consumer, not move " +
              "it. Removing it from standingConcerns trades one lost diagnosis for another — " +
              "the completion review would no longer adjudicate a defect the judge named.",
          ).toEqual([BLOCKING]);
        });

        test("a minor concern reaches NEITHER consumer", () => {
          const f = form({ concerns: [COSMETIC], concernSeverities: ["minor"] } as Partial<JudgeForm>);
          const standing: string[] = [];
          accumulateStandingConcerns(standing, f);
          const fb = feedbackOf(f);
          expect(standing, "WP-548's floor at the seal is unchanged by this run").toEqual([]);
          expect(fb === undefined || !fb.includes(COSMETIC)).toBe(true);
        });

        test("an unmarked concern fails safe to blocking at BOTH consumers", () => {
          const f = form({ concerns: [BLOCKING] });
          const standing: string[] = [];
          accumulateStandingConcerns(standing, f);
          const fb = feedbackOf(f);
          expect(standing).toEqual([BLOCKING]);
          expect(fb !== undefined && fb.includes(BLOCKING)).toBe(true);
        });

        test("seal-side accumulation is still de-duplicated across passes", () => {
          const standing: string[] = [];
          const f = form({ concerns: [BLOCKING], concernSeverities: ["blocking"] } as Partial<JudgeForm>);
          accumulateStandingConcerns(standing, f);
          accumulateStandingConcerns(standing, f);
          expect(standing).toHaveLength(1);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: the seal-side accumulation regressed — a blocking concern no longer reaches the completion review, a minor one now does, or dedup broke. vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: the completion review still adjudicates blocking concerns and still ignores minor ones"


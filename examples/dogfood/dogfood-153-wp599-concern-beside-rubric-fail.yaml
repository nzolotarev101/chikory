        exit 1
      }
      grep -qE 'buildCriterionFeedback\(verdict\.form\)' src/workflow/agent-loop.ts || {
        echo "AC-3 FAIL: the live loop no longer feeds the per-pass judgeFeedback from buildCriterionFeedback(verdict.form) (agent-loop.ts:1411). A helper nothing calls changes nothing on a real run (F-283)."
        exit 1
      }

      OUT=$(pnpm --filter @chikory/sdk exec vitest run 2>&1)
      ST=$?
      echo "$OUT" | tail -25
      if [ "$ST" -ne 0 ]; then
        echo "AC-3 FAIL: the DECLARED regression suite is RED (vitest exited $ST). This check runs the whole suite on purpose: dogfood-152 passed 3/3 acceptance criteria on a delivery whose own new test was failing in a directory the checks did not name (F-382)."
        exit 1
      fi
      N=$(echo "$OUT" | grep -oE "Tests +[0-9]+ passed" | grep -oE "[0-9]+" | head -1)
      echo "committed suite tests passing: ${N:-UNPARSEABLE} (floor 1567, measured baseline 1563)"
      if [ -z "$N" ]; then
        echo "AC-3 FAIL: could not read a test count out of the vitest summary"
        exit 1
      fi
      if [ "$N" -lt 1567 ]; then
        echo "AC-3 FAIL: durability floor not met — the committed suite did not grow by at least 4 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356), and the LIVE loop path plus its minor-concern negative are covered by no check above."
        exit 1
      fi
      echo "AC-3 OK: one shared policy at the new call site, the live loop wired to it, traps intact, DECLARED suite green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

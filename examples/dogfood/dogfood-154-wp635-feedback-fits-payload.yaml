    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# MEASURE it at the launch commit rather than trusting this line (F-342, dogfood-140).
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE (what a failing check hands forward). It drives the REAL
      applyCheckOverrides — no mocks, no re-implementation — at the MEASURED magnitudes from the
      previous run (a 6,624-byte command against a 251-byte output) and asserts the justification
      now carries what the check SAW and not the script that ran, that the tail survives when the
      diagnosis must be shortened, and that the three neighbouring shapes are untouched: a passing
      check, a killed check, and the tests_pass rubric wording.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/workflow/ac1-check-diagnosis-rides.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import { applyCheckOverrides } from "../../src/judge/harness.js";
      import type { AcceptanceCriterion, JudgeForm, RubricItem } from "../../src/types.js";

      // The measured shape: 6,624 bytes of command, 251 bytes of output. The command's own
      // body must not be what rides forward; the output's tail is the only text written for
      // the next attempt.
      const COMMAND_BODY_MARKER = "a-long-generated-vitest-file-line";
      const COMMAND =
        "cd packages/sdk-ts || exit 1\n" +
        `# ${COMMAND_BODY_MARKER}\n`.repeat(180) +
        'if [ "$ST" -ne 0 ]; then\n  echo "AC-1 FAIL: the blocking concern never reaches the executor"\n  exit 1\nfi';

      const ASSERTION = "AssertionError: expected undefined to be defined";
      const AUTHOR_SENTENCE = "AC-1 FAIL: the blocking concern never reaches the executor";
      const OUTPUT = [
        "> chikory@ test",
        "FAIL test/workflow/ac1.generated.test.ts > the blocking concern rides into the next step",
        ASSERTION,
        "  \u276f test/workflow/ac1.generated.test.ts:52:9",
        AUTHOR_SENTENCE,
      ].join("\n");

      const RUBRIC: RubricItem[] = [
        { id: "tests_pass", description: "tests pass", destructive: false },
      ];
      const CRITERIA: AcceptanceCriterion[] = [{ id: "AC-1", description: "d", check: COMMAND }];

      function lyingForm(): JudgeForm {
        return {
          criterionResults: [{ id: "AC-1", pass: true, justification: "looks fine to me" }],
          rubricResults: [{ id: "tests_pass", pass: true, justification: "ok" }],
          concerns: [],
        };
      }

      function run(over: Partial<{ exitCode: number; output: string; infraFailed: boolean }>) {
        const res = applyCheckOverrides(
          lyingForm(),
          CRITERIA,
          RUBRIC,
          [
            {
              criterionId: "AC-1",
              command: COMMAND,
              exitCode: 1,
              output: OUTPUT,
              durationMs: 10,
              infraFailed: false,
              ...over,
            },
          ],
          [],
          [],
        );
        if ("error" in res) throw new Error(`applyCheckOverrides refused the form: ${res.error}`);
        return res.form;
      }

      describe("AC-1 WP-635: a failing check hands forward what it SAW", () => {
        test("the diagnosis rides — the assertion and the author's own sentence", () => {
          const j = run({}).criterionResults[0]!.justification;
          expect(
            j,
            "the check printed this assertion and the judge collected it in CheckRun.output " +
              "(src/judge/evidence.ts:48). On HEAD it is discarded and the 6,624-byte command " +
              "is quoted in its place, so the executor is handed the question, not the answer.",
          ).toContain(ASSERTION);
          expect(
            j,
            "every acceptance check in this campaign ends with an `echo \"AC-n FAIL: …\"` " +
              "written to steer the next attempt. It must arrive as evidence, not by accident " +
              "at byte 6,500 of a quoted script.",
          ).toContain(AUTHOR_SENTENCE);
        });

        test("the command body does NOT ride, and the criterion stays identifiable", () => {
          const j = run({}).criterionResults[0]!.justification;
          expect(
            j.includes(COMMAND_BODY_MARKER),
            "the executor already has the criteria in its own prompt " +
              "(src/executors/prompt.ts:18) and the full command is in the spec and the " +
              "journal. Quoting the script forward is 99% of the payload and 0% of the signal.",
          ).toBe(false);
          expect(j, "the exit code stays readable (pinned by verdict-gating.test.ts:629)").toContain(
            "exited 1",
          );
          expect(j.length, "26x smaller than the 6,656-byte echo it replaces").toBeLessThanOrEqual(2000);
        });

        test("when the diagnosis is shortened the TAIL survives and the cut is MARKED", () => {
          const long = `${"noise from the build banner\n".repeat(400)}\n${ASSERTION}\n${AUTHOR_SENTENCE}`;
          const j = run({ output: long }).criterionResults[0]!.justification;
          expect(
            j,
            "a check's output opens with a banner and closes with its summary and the author's " +
              "sentence. Keeping the head throws away the only part written for this moment.",
          ).toContain(AUTHOR_SENTENCE);
          expect(
            /\u2026|\.\.\.|truncat|shorten|omitt|elided/i.test(j),
            "the executor must be able to tell that what it received is partial",
          ).toBe(true);
        });

        test("empty output still yields a usable justification, never an empty one", () => {
          const j = run({ output: "" }).criterionResults[0]!.justification;
          expect(j.trim().length).toBeGreaterThan(0);
          expect(j).toContain("AC-1");
          expect(j).toContain("exited 1");
        });

        test("TRAP: a PASSING check does not start dumping its output", () => {
          const passing = run({ exitCode: 0, output: `${"successful test line\n".repeat(200)}` });
          const j = passing.criterionResults[0]!.justification;
          expect(passing.criterionResults[0]!.pass).toBe(true);
          expect(
            j.length,
            "the healthy path pays nothing. A green check has no diagnosis to hand forward.",
          ).toBeLessThanOrEqual(400);
          expect(j).toContain("exited 0");
        });

        test("TRAP: a KILLED check still reads differently from a red one (WP-263(b)/F-76)", () => {
          const killed = run({ infraFailed: true, output: "" });
          const j = killed.criterionResults[0]!.justification;
          expect(
            /DID NOT COMPLETE|infra/i.test(j),
            "a check killed at the per-check cap proves the infrastructure died, not that the " +
              "code is red, and the verdict's stuck-criterion history depends on the difference.",
          ).toBe(true);
          expect(killed.criterionResults[0]!.infraFailed).toBe(true);
        });

        test("TRAP: the tests_pass RUBRIC wording is out of scope and unmoved", () => {
          const form = run({});
          const tests = form.rubricResults.find((r) => r.id === "tests_pass")!;
          expect(tests.pass).toBe(false);
          expect(
            tests.justification,
            "four live tests pin this string; this WP changes the CRITERION justification only",
          ).toContain("1/1 judge-executed checks failed: AC-1");
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: the failing check's diagnosis does not ride forward, or the command body still does, or the tail was cut, or a passing/killed check or the tests_pass rubric wording moved. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: the executor is handed what the check saw, the tail survives, and the neighbouring shapes are untouched"

  - id: AC-2
    description: >
      THIS CHECK OWNS ITS ORACLE for the handover itself. It asserts the extracted diagnosis
      actually survives the 2,000-char channel into the executor's next-step feedback, and that
      the completion-milestone site COMPOSES with the verdict rationale instead of displacing it
      (F-385) — through a NAMED, IMPORTABLE export, because a private function inside the Temporal
      workflow module is why that regression shipped untested.
    check: |
      cd packages/sdk-ts || exit 1
      if grep -qE 'buildCriterionFeedback\(verdict\.form\) \?\?' src/workflow/agent-loop.ts; then
        echo "AC-2 FAIL: src/workflow/agent-loop.ts still displaces the rationale with a nullish fall-back at the completion-milestone feedback site (F-385). The loop's three other feedback sites compose; this one must too."
        exit 1
      fi
      TARGET=test/workflow/ac2-handover-composes.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import { applyCheckOverrides } from "../../src/judge/harness.js";
      import * as remediation from "../../src/workflow/remediation.js";
      import type { AcceptanceCriterion, JudgeForm, RubricItem } from "../../src/types.js";

      const ASSERTION = "AssertionError: expected undefined to be defined";
      const AUTHOR_SENTENCE = "AC-1 FAIL: the blocking concern never reaches the executor";
      const OUTPUT = ["FAIL test/workflow/ac1.generated.test.ts", ASSERTION, AUTHOR_SENTENCE].join("\n");
      const COMMAND = "cd packages/sdk-ts || exit 1\n" + "# filler line\n".repeat(400);
      const RATIONALE =
        "work in progress, no regressions \u2014 non-destructive rubric failures: " +
        "scope_matches_instruction: touched an unrelated module";

      const RUBRIC: RubricItem[] = [{ id: "tests_pass", description: "tests pass", destructive: false }];
      const CRITERIA: AcceptanceCriterion[] = [{ id: "AC-1", description: "d", check: COMMAND }];

      function judgedForm(exitCode: number): JudgeForm {
        const res = applyCheckOverrides(
          {
            criterionResults: [{ id: "AC-1", pass: true, justification: "looks fine" }],
            rubricResults: [{ id: "tests_pass", pass: true, justification: "ok" }],
            concerns: [],
          },
          CRITERIA,
          RUBRIC,
          [{ criterionId: "AC-1", command: COMMAND, exitCode, output: exitCode === 0 ? "" : OUTPUT, durationMs: 5, infraFailed: false }],
          [],
          [],
        );
        if ("error" in res) throw new Error(res.error);
        return res.form;
      }

      // The composition must be importable. A private function inside the Temporal workflow
      // module is exactly why F-385 shipped with no test able to reach it.
      function composer(): (rationale: string, f: JudgeForm) => string {
        const mod = remediation as unknown as Record<string, unknown>;
        for (const name of Object.keys(mod)) {
          const fn = mod[name];
          if (typeof fn !== "function" || fn.length < 2) continue;
          try {
            const out = (fn as (a: unknown, b: unknown) => unknown)(RATIONALE, judgedForm(1));
            if (typeof out === "string" && out.includes(RATIONALE)) {
              return fn as (rationale: string, f: JudgeForm) => string;
            }
          } catch {
            continue;
          }
        }
        throw new Error(
          "no exported (rationale, form) => string composer found in src/workflow/remediation.ts. " +
            "The composition the completion-milestone site performs must be a named export a unit " +
            "test can import — withCriterionFeedback is private to the workflow module today.",
        );
      }

      describe("AC-2 WP-635/F-385: the handover carries the diagnosis and adds to the rationale", () => {
        test("the check's diagnosis survives the channel into the next step", () => {
          const fb = remediation.buildCriterionFeedback(judgedForm(1));
          expect(fb, "a failing criterion must produce feedback").toBeDefined();
          expect(
            fb!,
            "the whole point: the assertion the check printed reaches the agent that can act " +
              "on it, inside the bound, on the pass it was raised.",
          ).toContain(ASSERTION);
          expect(fb!).toContain(AUTHOR_SENTENCE);
          expect(fb!).toContain("AC-1");
        });

        test("a concern-only form keeps the rationale AND gains the concern (F-385)", () => {
          const form = judgedForm(0);
          const out = composer()(RATIONALE, {
            ...form,
            criterionResults: [],
            concerns: ["the temp dir leaks when the guard rejects the spec"],
            concernSeverities: ["blocking"],
          } as JudgeForm);
          expect(
            out,
            "once a concern-only form returned a string, the nullish fall-back stopped firing " +
              "and the rationale \u2014 which names the failing rubric rows \u2014 was gone.",
          ).toContain(RATIONALE);
          expect(out).toContain("the temp dir leaks when the guard rejects the spec");
        });

        test("a failing criterion keeps the rationale AND its diagnosis", () => {
          const out = composer()(RATIONALE, judgedForm(1));
          expect(out).toContain(RATIONALE);
          expect(out).toContain(ASSERTION);
        });

        test("TRAP: nothing prints twice", () => {
          const out = composer()(RATIONALE, judgedForm(1));
          expect(
            out.split("scope_matches_instruction").length - 1,
            "the rationale already names the failing rubric rows",
          ).toBe(1);
        });

        test("TRAP: silence stays cheap on both paths", () => {
          const clean = judgedForm(0);
          expect(remediation.buildCriterionFeedback(clean)).toBeUndefined();
          expect(composer()(RATIONALE, clean).trim()).toBe(RATIONALE);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: the diagnosis does not survive into the executor feedback, or the milestone site displaces the rationale, or the composer is not an importable export, or something prints twice, or the healthy path grew a string. vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: the diagnosis reaches the executor inside the bound, and the handover composes"

  - id: AC-3
    description: >
      Hygiene, the anti-trap greps, and the DECLARED regression suite with a durability floor.
      This check runs the whole declared suite on purpose — dogfood-152 passed 3/3 acceptance
      criteria on a delivery whose own new test was failing in a directory the checks did not
      name (F-382).
    check: |
      cd packages/sdk-ts || exit 1
      pnpm run typecheck || { echo "AC-3 FAIL: strict typecheck is red (this covers test/ too — F-382)"; exit 1; }
      pnpm exec eslint src/judge/harness.ts src/workflow/remediation.ts src/workflow/agent-loop.ts || { echo "AC-3 FAIL: eslint is red on the modules this WP touches"; exit 1; }

      grep -qE 'export const [A-Z_]+ *(: *number)? *= *[0-9_]+' src/workflow/remediation.ts || {
        echo "AC-3 FAIL: the channel bound is no longer a named exported constant. 'How big can this get' must have an answer a reader can find (F-365)."
        exit 1
      }
      grep -q 'output' src/judge/harness.ts || {
        echo "AC-3 FAIL: src/judge/harness.ts never reads the check's output. CheckRun.output is the collected diagnosis this WP exists to forward (src/judge/evidence.ts:48); a fix that does not read it cannot be forwarding it."
        exit 1
      }
      grep -qE 'judge-executed checks failed' src/judge/harness.ts || {
        echo "AC-3 FAIL: trap — the tests_pass RUBRIC wording moved. Four live tests pin 'N/M judge-executed checks failed: <ids>'; this WP changes the CRITERION justification only."
        exit 1
      }
      grep -qE 'export function blockingConcerns' src/judge/verdict.ts || {
        echo "AC-3 FAIL: blockingConcerns is no longer the single exported severity policy (WP-548)"
        exit 1
      }
      grep -qE 'rubricFails\.length === 0' src/judge/verdict.ts || {
        echo "AC-3 FAIL: trap — rule 4's guard was deleted or rewritten. escalateClass out_of_rubric carries F-154's force-seal-on-approve semantics; this WP does not touch the verdict."
        exit 1
      }

      OUT=$(pnpm --filter @chikory/sdk exec vitest run 2>&1)
      ST=$?
      echo "$OUT" | tail -25
      if [ "$ST" -ne 0 ]; then
        echo "AC-3 FAIL: the DECLARED regression suite is RED (vitest exited $ST)"
        exit 1
      fi
      N=$(echo "$OUT" | grep -oE "Tests +[0-9]+ passed" | grep -oE "[0-9]+" | head -1)
      echo "committed suite tests passing: ${N:-UNPARSEABLE} (floor 1578, measured baseline 1574)"
      if [ -z "$N" ]; then
        echo "AC-3 FAIL: could not read a test count out of the vitest summary"
        exit 1
      fi
      if [ "$N" -lt 1578 ]; then
        echo "AC-3 FAIL: durability floor not met — the committed suite did not grow by at least 4 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356), and the LIVE loop path is covered by no check above."
        exit 1
      fi
      echo "AC-3 OK: the diagnosis is read, the bound is named, the neighbouring wordings and the verdict are untouched, DECLARED suite green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

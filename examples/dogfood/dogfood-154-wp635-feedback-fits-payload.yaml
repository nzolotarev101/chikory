# Plain: when the reviewer explains what is wrong, the note it sends the worker is capped at
# 2,000 characters — and the reviewer's own explanations on the last run were 6,532, 3,757 and
# 2,851 characters. The worker is handed a fragment of the reason it is supposed to act on, with
# nothing telling it the rest was cut. After this run the note still fits in a stated budget, but
# every finding is named, nothing vanishes without a mark, and the reviewer's summary is added to
# it rather than replaced by it.
# WP: WP-635 (the per-pass feedback channel must fit its payload, F-384/F-385)
# Ladder-rung: 0 (off-ladder - P3 rung-5's remaining half is WP-304, operator-run; see WHY)
# Thesis-KPI: self-correction and context rot (CLAUDE.md: compounding error, Memory Pointer
#   Pattern), measured as the share of the judge's diagnosis the executor can actually read.
#
# THE MEASURED PREMISE - taken from run-8113a98d's OWN persisted verdict form at the dogfood-153
#   review, not transcribed (F-203/F-342). Read back with:
#     sqlite3 -json .chikory/runs/run-8113a98d-.../journal.db \
#       'select payload_json from journal_entries where kind="verdict";'
#   then `JSON.parse(row.payload_json).verdict.form.criterionResults[].justification.length`:
#     AC-1 justification : 6532 bytes
#     AC-2 justification : 3757 bytes
#     AC-3 justification : 2851 bytes
#     channel budget     : 2000 chars (REMEDIATION_BRIEF_MAX_CHARS, src/workflow/remediation.ts:21)
#   A judge justification quotes the check it ran, so this is the normal size, not an outlier.
#   ONE failing criterion overruns the entire budget.
#
#   * WHAT ALREADY LANDED, so you do not re-fix it: at the dogfood-153 review F-384 was hand-fixed.
#     `buildCriterionFeedback` used to join the criteria and concerns sections and clamp the
#     CONCATENATION, and `clampBrief` truncates from the tail, so the concerns section was dropped
#     in every combined case. `clampSections` (`src/workflow/remediation.ts:127`) now gives each
#     SECTION a fair share of the budget, shortest first. That guarantees both sections SURVIVE.
#   * WHAT IS STILL WRONG, and it is the whole of this WP: survival is not legibility. With two
#     sections each gets ~1000 chars, so a 6,532-byte justification arrives as a ~1000-char
#     fragment ending in a single `…`, and with several failing criteria the later ones are cut
#     off entirely - the executor is never even told their IDs. A control plane whose thesis is
#     agents that fix themselves is handing the agent a truncated reason to fix itself.
#   * THE SECOND HALF, F-385: `src/workflow/agent-loop.ts:1422` reads
#     `buildCriterionFeedback(verdict.form) ?? (completionMilestone ? verdict.rationale :
#     undefined)`. It is the loop's ONLY feedback site that uses `??` - `:1175`, `:1454` and
#     `:1456` all use `withCriterionFeedback` (`:167`), which COMPOSES the rationale with the
#     criterion feedback and carries the F-212 doctrine in its own docstring: "A mechanical
#     violation must never mask the substantive one." Once WP-599 made a concern-only form return
#     a string, the `??` stopped firing for it, so a milestone pass that evaluated zero criteria
#     now trades its rationale - which names the failing rubric rows - for the concern. Narrow
#     today (measured: `:1422` is reached only when `allCriteriaPass` is false, and
#     `src/workflow/agent-loop.ts:138` requires `criterionResults.length > 0`), and the fix
#     changes what EVERY milestone step sees, which is why it is a run and not a review edit.
#   * THE GROWTH BOUND IS NOT OPTIONAL (F-365, the bounded-channel-made-unbounded lesson). Every
#     byte here is paid on every step of every run forever, and it feeds the pacing governor's
#     token estimate as well as the prompt. "Raise the constant" is the trap, not the fix.
#   * MEASURE THIS FOR FREE WHILE YOU ARE HERE (F-386/F-197): WP-548 landed `concernSeverities`
#     two runs ago and no run has yet seen a real judge populate it - dogfood-153's judge raised
#     0 concerns. If this run's judge raises one, its persisted form is the first live datum.
#   * The suite this run must not break, MEASURED at the launch commit (F-342 - run it yourself
#     and read its own tail): at this review it stood at 193 files / 1,597 tests
#     (1,574 passed | 23 skipped).
#
# PRECEDENCE - two rules below can disagree about one input. When they do:
#   1. The BOUND wins over completeness. There is always an input large enough that not everything
#      fits; the output must stay under a stated ceiling no matter what is fed in. Completeness is
#      "every finding is NAMED and every drop is MARKED", never "nothing is dropped".
#   2. Silence still wins over both. A pass with no failing criterion and no blocking concern must
#      still produce NO feedback string at all.
#   AC-1 drives rule 1 with a pathological input; AC-1 and AC-3 drive rule 2.
#
# Format: loose - the outcome (legible, bounded, marked, composed) is fixed; the allocation
#   policy, the marker text and where the composition helper lives are the executor's call.
#
# Launch mode: RUN (single node - one channel, two call sites).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-153 review, 2026-08-18):
#   `scripts/dogfood-progression.sh` reads **STALLED**, which BINDS the next headline to the
#   current phase ladder rung. P3's ladder is WP-530 (plan.md section 7) and its next rung is
#   rung-5, whose remaining half is WP-304's OpenHands arm plus a corpus wide enough to separate
#   19 requirements at 95 percent confidence: a quota-bound, multi-hour suite the OPERATOR runs by
#   hand (dogfood-122's lesson - an LLM executor may not supervise it). It cannot be a spec, and
#   has not been since dogfood-139. With the rung unrunnable, WP-635 is the strongest candidate:
#   it is product code on the self-correction AND context-rot pillars, its premise is a
#   measurement taken this review from the previous run's own journal, and it is the direct
#   residue of the defect that run shipped. Rejected: WP-634 (F-382, harness-meta and only 🟠 -
#   section 1.5 VETO, tracked track-B); WP-633 (F-378, latent behind an unreachable predicate);
#   WP-606 (F-306/F-387, re-measured this review at 5.0% of summary bytes - not headline-sized).

name: dogfood-154-wp635-feedback-fits-payload
wp: WP-635

goal: |
  The per-pass feedback the executor receives must carry the judge's diagnosis legibly, within a
  stated bound, and must add to the verdict rationale rather than replace it.

  Two measurements, both from the previous run's own persisted verdict form: the judge's
  failing-criterion justifications were 6,532 / 3,757 / 2,851 bytes, and the channel that carries
  them into the next step is 2,000 chars (the named budget constant in src/workflow/remediation.ts:21). A single failing criterion overruns the whole budget. Today
  `buildCriterionFeedback` (src/workflow/remediation.ts:91) splits the budget fairly between its
  sections, so both sections survive — but with several failing criteria the later ones are cut
  off mid-sentence or dropped entirely, and the executor is never told they existed.

  Make three things true.

  1. **Every finding is NAMED.** Whatever the input size, the feedback names every failing
     criterion id and carries every blocking concern. Evidence text may be shortened; an
     identifier may not disappear.
  2. **Every drop is MARKED.** When content is shortened or omitted, the string says so in a way
     the executor can read — a truncation marker on the shortened item, and, where evidence is
     dropped entirely, a line saying so. The executor must never be unable to tell that the reason
     it was given is partial.
  3. **The channel stays BOUNDED, and the bound is a named constant.** The output must stay under
     a ceiling for ANY input — twelve 6,500-byte justifications must not produce an 80 KB prompt
     block. This is paid on every step of every run and also feeds the pacing governor's token
     estimate (src/workflow/agent-loop.ts:841), so "raise the constant until it fits" is the wrong
     direction: F-365 is exactly this shape, a "stop dropping X" fix that added unbounded
     retention. If you change the budget, the new value must be a named exported constant and your
     step summary must state what bounds it.

  And fix the composition site. the completion-milestone feedback site at src/workflow/agent-loop.ts:1422 falls back with a
  nullish-coalescing operator instead of composing, so on a completion milestone the feedback DISPLACES the rationale. It is the loop's only
  feedback site that does: lines 1175, 1454 and 1456 all go through `withCriterionFeedback`
  (line 167), whose own docstring carries the F-212 rule — "A mechanical violation must never mask
  the substantive one." Make the milestone site compose too. The composition must be reachable
  from a test: `withCriterionFeedback` is currently a private function in a Temporal workflow
  module, so move it (or an equivalent) somewhere a unit test can import — `remediation.ts` is
  the natural home — and have the call site use it.

  Two things must NOT change, and each is a trap this run is graded on:

  1. **Silence stays cheap.** A judge pass with no failing criterion and no blocking concern must
     still produce NO feedback string at all — `undefined`, exactly as today. No header, no
     "nothing to report", no empty section.
  2. **Nothing prints twice.** The verdict rationale already names the failing rubric rows
     (computeVerdict, src/judge/verdict.ts). A composition that appends the criterion feedback
     to the rationale must not restate the rubric failures a second time, and must not repeat a
     concern that is already in the rationale.

  TypeScript stays strict ESM with named exports and no `any`. Do not touch the rubric list, the
  verdict rules, the completion-review budget, the pacing governor's policy, the TaskSpec
  contract, or the Python mirror.

  Pin your work with tests that live in the repo, beside the files they cover. A behaviour proved
  only by the acceptance checks that grade this run is not pinned at all (F-356), and a repo test
  copied verbatim from a grading check inherits its blind spots (F-360). One case the grading
  checks below deliberately leave open, and you must cover it: **the live loop** — that the string
  actually reaching the next step's prompt on a completion milestone carries the rationale AND the
  per-pass feedback. test/runner/remediation-live.test.ts already drives that path with echoJudgeFeedback
  (test/runner/helpers.ts:165), and claimsCompleteSteps (helpers.ts:76) is how a scripted step
  claims completion. Watch out for an assertion confounded by its own fixture
  (F-383): assert on something only the behaviour under test can produce.

  FOUR EXISTING TESTS PIN THE SHAPES THIS CHANGE MUST BREAK, measured by running the reference
  implementation against the suite at the arming pass. Migrating them is correct; weakening them
  is not, and silently deleting one is a scope violation. Three in test/runner/remediation.test.ts
  assert the feedback length against the 2,000-char brief constant — if you introduce a new bound
  they must assert against the NEW named constant, never against no bound at all. One in
  test/runner/agent-loop.test.ts asserts the next step's summary contains the exact string
  "judge feedback: unmet acceptance criteria", which pins the DISPLACEMENT you are removing: once
  the milestone site composes, the rationale sits between those two phrases. Keep both halves
  asserted.

  Sizing rule for your own tests, the F-384 lesson that produced this WP: when a test exercises a
  bounded channel, use the input's MEASURED magnitude, not a plausible-looking literal. The last
  run's clamp test used a 24-character justification against a real distribution of 2,851–6,532
  bytes, and passed over a feature that could not work.

  Verify your work with FAST checks only: the package typecheck (`pnpm run typecheck` — NOT bare tsc with
  --noEmit alone, which does not cover the `test/` tree, F-382), eslint over the files you touched, and
  vitest over the directories you actually wrote into. Do NOT run the full vitest suite inside a
  step — it does not fit the step time cap (F-345).


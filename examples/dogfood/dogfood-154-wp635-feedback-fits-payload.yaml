# Plain: when a check fails, the note the reviewer hands the worker is the check's own SCRIPT
# quoted back — 6,624 bytes of it — and none of what the check actually SAID. The assertion that
# failed, and the one-line explanation the check author wrote for exactly this moment, sit in a
# 251-byte field that is collected and then thrown away. The worker is handed the question instead
# of the answer, and the channel is too small for either. After this run the worker gets what the
# check said.
# WP: WP-635 (the handover to the next step must carry insight, not bulk; F-384/F-385)
# Ladder-rung: 0 (off-ladder - P3 rung-5's remaining half is WP-304, operator-run; see WHY)
# Thesis-KPI: self-correction and context rot (CLAUDE.md: compounding error, Memory Pointer
#   Pattern), measured as the share of the judge's diagnosis the executor can actually act on.
#
# THE MEASURED PREMISE - three measurements, taken at the dogfood-153 review by RUNNING the code
#   and by reading the previous run's own journal, not transcribed (F-203/F-342).
#
#   (1) FROM THE JOURNAL of run-8113a98d. Read back with:
#         sqlite3 -json .chikory/runs/run-8113a98d-.../journal.db \
#           "select payload_json from journal_entries where kind='verdict';"
#       then JSON.parse(row.payload_json).verdict.form.criterionResults[]:
#         AC-1 justification : 6532 bytes, of which 6500 (99.5%) is a backtick-quoted span
#         AC-2 justification : 3757 bytes, of which 3725 (99.1%) is a backtick-quoted span
#         AC-3 justification : 2851 bytes, of which 2819 (98.9%) is a backtick-quoted span
#       The quoted span is the CHECK COMMAND. The template is literally
#       `judge-executed check <the entire script> exited <N>` (src/judge/harness.ts:134).
#       Every criterion justification in this project is ~99% command echo and ~32 bytes of signal.
#
#   (2) FROM A PROBE over the real applyCheckOverrides, driving a FAILING check whose output
#       carries a vitest assertion and the author's own FAIL sentence:
#         command bytes                              : 6624
#         output bytes                               : 251
#         resulting justification bytes              : 6656
#         justification carries the assertion text?  : false
#         justification is the command echo?         : true
#       CheckRun.output (src/judge/evidence.ts:48, "Combined stdout+stderr, tail-bounded",
#       MAX_CHECK_OUTPUT_CHARS = 4000 at :41) is ALREADY COLLECTED and then discarded.
#       251 bytes of diagnosis exist and are thrown away to make room for 6,624 bytes of the
#       question the executor already asked.
#
#   (3) THE CHANNEL: the per-pass feedback is bounded at 2000 chars
#       (REMEDIATION_BRIEF_MAX_CHARS, src/workflow/remediation.ts:21). Against a 6,656-byte
#       justification that bound is hopeless; against a 251-byte diagnosis it is ample. THIS IS
#       WHY THE ANSWER IS NOT A SIZING POLICY. F-384 (hand-fixed at the dogfood-153 review,
#       clampSections at :127) made every section SURVIVE the clamp; it could not make a
#       truncated command echo mean anything, because a tail slice of a shell script is not a
#       diagnosis at either end.
#
#   * WHY THE COMMAND ECHO IS THE WRONG PAYLOAD, not merely a big one: the executor is already
#     told what each criterion REQUIRES (`# Acceptance criteria` in src/executors/prompt.ts:18).
#     What it cannot know is what the check SAW. Handing back the script is handing back the
#     question. And the author's own `echo "AC-n FAIL: <explanation>"` - written into every spec
#     in this campaign precisely to steer the next attempt - reaches the executor today only by
#     accident, buried near byte 6,500 of a 6,656-byte blob, past any bound.
#   * THE TAIL IS THE SIGNAL. A check's output ends with its summary and the author's FAIL
#     sentence; it opens with a build banner. If output must be shortened, the END survives.
#   * BLAST RADIUS, measured by grep so the executor does not have to guess: 6 test files mention
#     `judge-executed check`. Four pin the tests_pass RUBRIC phrasing
#     (`N/M judge-executed checks failed: <ids>`, src/judge/harness.ts:158-166) - that string is
#     NOT in scope and must not move. One pins the criterion justification and only through
#     `toContain("exited 1")` (test/runner/verdict-gating.test.ts:629). One pins the infra-failed
#     wording (test/judge/verdict.test.ts:132) - WP-263(b)/F-76/F-79 depend on a killed check
#     reading differently from a red one, and that distinction stays.
#   * THIS IS A CONTEXT-ROT FIX AT BOTH ENDS. The same justifications ride into the judge's own
#     completion-review prompt, so the command echo is paid twice per pass.
#   * F-385, the second half: src/workflow/agent-loop.ts:1422 is the loop's ONLY feedback site
#     using a nullish fall-back, so on a completion milestone the feedback DISPLACES
#     verdict.rationale. Lines 1175, 1454 and 1456 all go through `withCriterionFeedback`
#     (line 167), whose own docstring carries the F-212 rule: "A mechanical violation must never
#     mask the substantive one." Handing the executor one diagnosis by taking away another is the
#     same defect this WP exists to fix, one layer up.
#   * MEASURE THIS FOR FREE WHILE YOU ARE HERE (F-386/F-197): WP-548 landed `concernSeverities`
#     two runs ago and no run has yet seen a real judge populate it - dogfood-153's judge raised
#     0 concerns. If this run's judge raises one, its persisted form is the first live datum.
#   * The suite this run must not break, MEASURED at the launch commit (F-342 - run it yourself
#     and read its own tail): at this review it stood at 193 files / 1,597 tests
#     (1,574 passed | 23 skipped).
#
# PRECEDENCE - two rules below can disagree about one input. When they do:
#   1. SIGNAL beats brevity. If a choice is between a shorter string and one that still names what
#      failed and why, the diagnosis wins. "Extract the insight" is the goal; "make it smaller" is
#      only the consequence.
#   2. The BOUND still holds. There is always an input large enough that not everything fits, so
#      the output stays under a stated named constant no matter what is fed in - and when it must
#      shorten, it keeps the END and says that it shortened.
#   AC-1 drives rule 1; AC-1 and AC-2 drive rule 2.
#
# Format: loose - the outcome (the executor learns what the check SAW) is fixed; the extraction
#   shape, the wording and where the composer lives are the executor's call.
#
# Launch mode: RUN (single node - one payload, one channel, one call site).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-153 review, 2026-08-18):
#   `scripts/dogfood-progression.sh` reads **STALLED**, which BINDS the next headline to the
#   current phase ladder rung. P3's ladder is WP-530 (plan.md section 7) and its next rung is
#   rung-5, whose remaining half is WP-304's OpenHands arm plus a corpus wide enough to separate
#   19 requirements at 95 percent confidence: a quota-bound, multi-hour suite the OPERATOR runs by
#   hand (dogfood-122's lesson - an LLM executor may not supervise it). It cannot be a spec, and
#   has not been since dogfood-139. With the rung unrunnable, WP-635 is the strongest candidate:
#   it is product code on the self-correction AND context-rot pillars, its premise is three
#   measurements taken this review, and it is the direct residue of the defect dogfood-153
#   shipped. Rejected: WP-634 (F-382, harness-meta and only 🟠 - section 1.5 VETO, track-B);
#   WP-633 (F-378, latent behind an unreachable predicate); WP-606 (F-306/F-387, re-measured this
#   review at 5.0% of summary bytes - not headline-sized).

name: dogfood-154-wp635-feedback-fits-payload
wp: WP-635

goal: |
  When a judge-executed check fails, the executor's next step must be told what the check SAW —
  the assertion that failed and the explanation the check itself printed — not the script that
  ran.

  Measured on HEAD, three ways. A check-backed criterion's justification is built as
  judge-executed check, then the entire command in backticks, then the exit code
  (src/judge/harness.ts:134): the three on
  the previous run were 6,532 / 3,757 / 2,851 bytes, of which 99.5% / 99.1% / 98.9% was the
  quoted command. A probe over the real applyCheckOverrides with a FAILING check measured a
  6,624-byte command, a 251-byte output holding the vitest assertion and the author's own
  `AC-1 FAIL: …` sentence, and a 6,656-byte justification that contains the command and NOT the
  assertion. CheckRun.output (src/judge/evidence.ts:48, bounded to MAX_CHECK_OUTPUT_CHARS = 4,000
  at :41) is already collected and then discarded. And the channel that carries any of this to the
  next step is 2,000 chars (REMEDIATION_BRIEF_MAX_CHARS, src/workflow/remediation.ts:21).

  So the problem is not that the handover is too long. It is that the handover carries the
  question instead of the answer, and no amount of trimming a quoted shell script produces a
  diagnosis. The executor is already told what each criterion REQUIRES — the acceptance criteria
  are in its own prompt (src/executors/prompt.ts:18). What it cannot know is what the check saw.

  Make three things true.

  1. **A check-backed criterion's justification carries the check's OUTPUT, not its command.**
     What failed, in the check's own words. The criterion must still be identifiable and its exit
     code must still be readable — the exit-code phrasing is pinned by an existing test and by every
     operator reading a trace — but the command body belongs in the journal and the spec, where
     it already lives, not in the evidence handed forward on every pass.
  2. **When the diagnosis must be shortened, the END survives and the shortening is MARKED.** A
     check's output opens with a build banner and closes with its summary and the author's
     `AC-n FAIL: …` sentence, which exists precisely to steer the next attempt. Cutting the tail
     throws away the only part written for this moment. And the executor must always be able to
     tell that what it received is partial.
  3. **The handover COMPOSES, it does not displace.** src/workflow/agent-loop.ts:1422 is the
     loop's only feedback site that falls back with a nullish operator, so on a completion
     milestone the per-pass feedback replaces verdict.rationale — which names the failing rubric
     rows — instead of joining it. Lines 1175, 1454 and 1456 already go through
     `withCriterionFeedback` (line 167), whose docstring carries the rule: "A mechanical violation
     must never mask the substantive one." Make the milestone site compose too, and make the
     composition reachable from a test — `withCriterionFeedback` is private to a Temporal workflow
     module today, which is why this regression shipped with nothing able to test it. `remediation.ts`
     is the natural home.

  The channel stays BOUNDED and the bound stays a NAMED EXPORTED CONSTANT. Several checks can
  fail at once and each output is bounded at 4,000 chars, so an unbounded join is still an
  unbounded prompt — paid on every step of every run, and fed to the pacing governor's token
  estimate (src/workflow/agent-loop.ts:841). If you change the budget, say in your step summary
  what bounds the new value. F-365 is exactly this shape: a "stop dropping X" fix that added
  unbounded retention.

  Four things must NOT change, and each is a trap this run is graded on:

  1. **Silence stays cheap.** A judge pass with no failing criterion and no blocking concern must
     still produce NO feedback string at all — `undefined`, exactly as today. A PASSING check must
     not start dumping its successful output either; the healthy path pays nothing.
  2. **A killed check still reads differently from a red one.** WP-263(b)/F-76/F-79: a check
     killed at the per-check cap is an infra failure, not evidence the code is red, and the
     verdict's stuck-criterion history depends on telling them apart.
  3. **The `tests_pass` rubric wording does not move.** `N/M judge-executed checks failed: <ids>`
     (src/judge/harness.ts:158-166) is pinned by four live tests and is out of scope.
  4. **Nothing prints twice.** The verdict rationale already names the failing rubric rows; a
     composition that restates them spends the executor's context saying the same thing twice.

  TypeScript stays strict ESM with named exports and no `any`. Do not touch the rubric list, the
  verdict rules, the completion-review budget, the pacing governor's policy, the TaskSpec
  contract, or the Python mirror.

  Pin your work with tests that live in the repo, beside the files they cover. A behaviour proved
  only by the acceptance checks that grade this run is not pinned at all (F-356), and a repo test
  copied verbatim from a grading check inherits its blind spots (F-360). One case the grading
  checks below deliberately leave open, and you must cover it: **the live loop** — that the string
  actually reaching the next step's prompt carries the failing check's diagnosis, on a run where a
  check really failed. test/runner/ already drives that path with echoJudgeFeedback
  (test/runner/helpers.ts:165), and claimsCompleteSteps (helpers.ts:76) is how a scripted step
  claims completion. Watch out for an assertion confounded by its own fixture (F-383): assert on
  something only the behaviour under test can produce.

  BLAST RADIUS, already measured so you do not have to guess: six test files mention the phrase
  `judge-executed check`. Four pin the tests_pass RUBRIC wording (trap 3 — leave them alone). One,
  test/runner/verdict-gating.test.ts:629, pins the criterion justification and only through
  `toContain("exited 1")`. One, test/judge/verdict.test.ts:132, pins the infra-failed wording
  (trap 2). Migrating a test that legitimately pins a shape you are changing is correct;
  weakening one, or deleting it, is a scope violation.

  TWO THINGS THE ARMING PASS ALREADY MEASURED, so you do not spend a step rediscovering them.
  (a) A throwaway reference implementation of this WP produced a **313-byte** justification where
  HEAD produces 6,656 — carrying the assertion text and the author's sentence, and none of the
  command. The size win is a consequence of carrying the right thing, not a goal to optimise for.
  (b) That reference turned exactly ONE existing test red: the assertion at
  test/runner/agent-loop.test.ts on the string "judge feedback: unmet acceptance criteria", which
  pins the very DISPLACEMENT part 3 removes — once the milestone site composes, the rationale sits
  between those two phrases. Keep both halves asserted. Notably the three tests that pin the
  2,000-char channel bound did NOT break: with the right payload the existing budget is ample, so
  a delivery that finds itself raising the constant has taken a wrong turn.

  Sizing rule for your own tests, the F-384 lesson that produced this WP: when a test exercises a
  bounded channel, use the input's MEASURED magnitude, not a plausible-looking literal. The last
  run's clamp test used a 24-character justification against a real distribution of 2,851–6,532
  bytes, and passed over a feature that could not work.

  Verify your work with FAST checks only: the package typecheck (`pnpm run typecheck` — NOT bare
  tsc with --noEmit alone, which does not cover the `test/` tree, F-382), eslint over the files
  you touched, and vitest over the directories you actually wrote into. Do NOT run the full vitest
  suite inside a step — it does not fit the step time cap (F-345).


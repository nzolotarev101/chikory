        exit 1
      }
      grep -qE 'rubricFails\.length === 0' src/judge/verdict.ts || {
        echo "AC-3 FAIL: trap — rule 4's guard was deleted or rewritten. escalateClass out_of_rubric carries F-154's force-seal-on-approve semantics; handing them to a run with a red rubric row lets one approval seal SUCCESS past a failing rubric item. This WP does not touch the verdict."
        exit 1

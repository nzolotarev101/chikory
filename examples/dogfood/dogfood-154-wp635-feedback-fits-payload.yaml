        echo "AC-3 FAIL: durability floor not met — the committed suite did not grow by at least 4 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356), and the LIVE completion-milestone path is covered by no check above."
        exit 1
      fi
      echo "AC-3 OK: bound named, policies intact, verdict untouched, DECLARED suite green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

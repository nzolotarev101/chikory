    writable: true

# The SDK suite is both the surface this run edits and the gate it must not break.
# MEASURE it at the launch commit rather than trusting this line (F-342, dogfood-140).
regression_suite: pnpm --filter @chikory/sdk exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE (legibility, marking and the bound). It drives the REAL feedback
      producer — no mocks, no re-implementation — at the MEASURED input magnitude taken from the
      previous run's persisted verdict form (6,532-byte justifications), plus a pathological input
      twelve times that size, and asserts every failing criterion is still NAMED, every blocking
      concern still arrives in full, truncation is MARKED, the output stays under a ceiling, and a
      clean pass still produces nothing at all. Expected values are written into this check.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/workflow/ac1-feedback-fits-payload.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import { buildCriterionFeedback } from "../../src/workflow/remediation.js";
      import type { JudgeForm } from "../../src/types.js";

      // The measured shape: a judge justification quotes the check it ran. The three on
      // run-8113a98d were 6532 / 3757 / 2851 bytes against a 2000-char channel.
      const MEASURED = 6532;
      const CEILING = 8000;

      const CONCERN_A = "the retry wrapper swallows the AbortError, so a cancelled run can never stop";
      const CONCERN_B = "the temp dir is created before the guard, so a rejected spec leaks it";

      function justification(id: string, bytes: number): string {
        const head = `judge-executed check for ${id} exited 1: `;
        return head + "x".repeat(Math.max(0, bytes - head.length));
      }

      function form(over: Partial<JudgeForm>): JudgeForm {
        return {
          criterionResults: [],
          rubricResults: [{ id: "tests_pass", pass: true, justification: "ok" }],
          concerns: [],
          ...over,
        } as JudgeForm;
      }

      describe("AC-1 WP-635/F-384: the feedback fits its payload", () => {
        test("at the MEASURED magnitude, the criterion is named and the concern arrives whole", () => {
          const fb = buildCriterionFeedback(
            form({
              criterionResults: [
                { id: "AC-1", pass: false, justification: justification("AC-1", MEASURED) },
              ],
              concerns: [CONCERN_A],
              concernSeverities: ["blocking"],
            } as Partial<JudgeForm>),
          );
          expect(
            fb,
            "one failing criterion at the measured size (6532 bytes) against a 2000-char budget",
          ).toBeDefined();
          expect(fb!, "the criterion must be NAMED even when its evidence is shortened").toContain("AC-1");
          expect(
            fb!,
            "the concern is 76 characters. Nothing about a 6532-byte justification justifies " +
              "losing it, and it is the executor's only copy — the seal's copy arrives too late.",
          ).toContain(CONCERN_A);
          expect(fb!.length, "the bound still holds").toBeLessThanOrEqual(CEILING);
        });

        test("shortening is MARKED — the executor can tell the reason it got is partial", () => {
          const fb = buildCriterionFeedback(
            form({
              criterionResults: [
                { id: "AC-1", pass: false, justification: justification("AC-1", MEASURED) },
              ],
            } as Partial<JudgeForm>),
          )!;
          expect(fb).toContain("AC-1");
          expect(
            /…|\.\.\.|truncat|shorten|omitt|elided|\bcut\b/i.test(fb),
            "6532 bytes of evidence went into a bounded channel and something was dropped. A " +
              "silent drop is what F-384 was: the string must SAY it is partial.",
          ).toBe(true);
        });

        test("PATHOLOGICAL input: every id is still named, every concern still whole, still bounded", () => {
          const ids = Array.from({ length: 12 }, (_, i) => `AC-${String(i + 1).padStart(2, "0")}`);
          const fb = buildCriterionFeedback(
            form({
              criterionResults: ids.map((id) => ({
                id,
                pass: false,
                justification: justification(id, MEASURED),
              })),
              concerns: [CONCERN_A, CONCERN_B],
              concernSeverities: ["blocking", "blocking"],
            } as Partial<JudgeForm>),
          )!;
          expect(
            fb.length,
            "78 KB of judge evidence must not become an 78 KB prompt block. Every byte here is " +
              "paid on every step and feeds the pacing estimate (F-365: a stop-dropping-X fix " +
              "that adds unbounded retention is the trap, not the fix).",
          ).toBeLessThanOrEqual(CEILING);
          for (const id of ids) {
            expect(
              fb,
              `${id} failed and the executor is not told it exists. Evidence may be shortened; ` +
                "an identifier may not disappear.",
            ).toContain(id);
          }
          expect(fb).toContain(CONCERN_A);
          expect(fb).toContain(CONCERN_B);
        });

        test("a MINOR concern still reaches nobody (WP-548's floor is unchanged)", () => {
          const fb = buildCriterionFeedback(
            form({
              concerns: ["trailing whitespace in the docstring"],
              concernSeverities: ["minor"],
            } as Partial<JudgeForm>),
          );
          expect(fb === undefined || !fb.includes("trailing whitespace")).toBe(true);
        });

        test("TRAP: silence stays cheap — a clean pass still produces NO string at all", () => {
          expect(
            buildCriterionFeedback(
              form({
                criterionResults: [{ id: "AC-1", pass: true, justification: "check exited 0" }],
              } as Partial<JudgeForm>),
            ),
            "no header, no 'nothing to report', no empty section. A helper that always returns " +
              "something grows every step's context for nothing.",
          ).toBeUndefined();
        });

        test("TRAP: an unmarked concern still counts as blocking (WP-548 fail-safe)", () => {
          const fb = buildCriterionFeedback(form({ concerns: [CONCERN_A] } as Partial<JudgeForm>));
          expect(fb).toBeDefined();
          expect(fb!).toContain(CONCERN_A);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: a finding is unnamed, a concern was lost, a drop went unmarked, the output is unbounded, or the healthy path grew a string. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: every finding named, every concern whole, drops marked, output bounded, silence still free"

  - id: AC-2
    description: >
      THIS CHECK OWNS ITS ORACLE for the composition half (F-385). It requires the rationale +
      feedback composition to be a NAMED, IMPORTABLE export — a private function inside the
      Temporal workflow module is why this regression shipped untested — and drives it over the
      exact shapes that made the milestone site lose a diagnosis, including the no-double-print
      trap. It also asserts the live call site actually uses it.
    check: |
      cd packages/sdk-ts || exit 1
      grep -qE 'withCriterionFeedback|composeJudgeFeedback|withJudgeFeedback' src/workflow/agent-loop.ts || {
        echo "AC-2 FAIL: the completion-milestone feedback site no longer routes through a composition helper at all"
        exit 1
      }
      if grep -qE 'buildCriterionFeedback\(verdict\.form\) \?\?' src/workflow/agent-loop.ts; then
        echo "AC-2 FAIL: src/workflow/agent-loop.ts still displaces the rationale with '??' at the completion-milestone feedback site (F-385). The loop's three other feedback sites compose; this one must too."
        exit 1
      fi
      TARGET=test/workflow/ac2-feedback-composes.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { describe, expect, test } from "vitest";

      import * as remediation from "../../src/workflow/remediation.js";
      import type { JudgeForm } from "../../src/types.js";

      const CONCERN = "the retry wrapper swallows the AbortError, so a cancelled run can never stop";
      const RATIONALE =
        "work in progress, no regressions — no criteria evaluated; non-destructive rubric " +
        "failures: scope_matches_instruction: touched an unrelated module";

      function form(over: Partial<JudgeForm>): JudgeForm {
        return {
          criterionResults: [],
          rubricResults: [
            { id: "tests_pass", pass: true, justification: "ok" },
            { id: "scope_matches_instruction", pass: false, justification: "touched an unrelated module" },
          ],
          concerns: [],
          ...over,
        } as JudgeForm;
      }

      // The composition must be importable. A private function inside the Temporal workflow
      // module is exactly why F-385 shipped with no test able to reach it.
      function composerOf(): (rationale: string, f: JudgeForm) => string {
        const mod = remediation as unknown as Record<string, unknown>;
        const names = Object.keys(mod).filter(
          (k) => typeof mod[k] === "function" && /compose|with/i.test(k),
        );
        for (const name of names) {
          const fn = mod[name] as (a: unknown, b: unknown) => unknown;
          if (fn.length < 2) continue;
          try {
            const out = fn(RATIONALE, form({ concerns: [CONCERN] } as Partial<JudgeForm>));
            if (typeof out === "string" && out.includes(RATIONALE)) {
              return fn as (rationale: string, f: JudgeForm) => string;
            }
          } catch {
            continue;
          }
        }
        throw new Error(
          "no exported (rationale, form) => string composer found in src/workflow/remediation.ts. " +
            "The composition the completion-milestone site performs must be a named export a unit " +
            "test can import — withCriterionFeedback is private to the workflow module today, " +
            "which is why F-385 shipped with nothing able to test it.",
        );
      }

      describe("AC-2 WP-635/F-385: the milestone feedback composes, it does not displace", () => {
        test("a concern-only form keeps the rationale AND gains the concern", () => {
          const out = composerOf()(RATIONALE, form({ concerns: [CONCERN] } as Partial<JudgeForm>));
          expect(
            out,
            "this is the F-385 regression: once a concern-only form returned a string, the '??' " +
              "stopped firing and the rationale — which names the failing rubric rows — was gone.",
          ).toContain(RATIONALE);
          expect(out).toContain(CONCERN);
        });

        test("a failing criterion keeps the rationale AND its evidence", () => {
          const out = composerOf()(
            RATIONALE,
            form({
              criterionResults: [
                { id: "AC-9", pass: false, justification: "the marker file is absent" },
              ],
            } as Partial<JudgeForm>),
          );
          expect(out).toContain(RATIONALE);
          expect(out).toContain("AC-9");
          expect(out).toContain("the marker file is absent");
        });

        test("TRAP: nothing prints twice", () => {
          const out = composerOf()(
            RATIONALE,
            form({
              criterionResults: [
                { id: "AC-9", pass: false, justification: "the marker file is absent" },
              ],
              concerns: [CONCERN],
            } as Partial<JudgeForm>),
          );
          const occurrences = out.split("scope_matches_instruction").length - 1;
          expect(
            occurrences,
            "the rationale already names the failing rubric rows; a composition that restates " +
              "them spends the executor's context saying the same thing twice.",
          ).toBe(1);
          expect(out.split(CONCERN).length - 1, "the concern must appear once").toBe(1);
        });

        test("TRAP: a clean form adds nothing to the rationale", () => {
          const out = composerOf()(
            RATIONALE,
            form({
              criterionResults: [{ id: "AC-1", pass: true, justification: "check exited 0" }],
            } as Partial<JudgeForm>),
          );
          expect(out.trim(), "silence stays cheap on this path too").toBe(RATIONALE);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: the composition is not an importable named export, or it displaces the rationale, or it double-prints, or it grows a clean pass. vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: the milestone feedback composes with the rationale, is testable, and prints each thing once"

  - id: AC-3
    description: >
      Hygiene, the anti-trap greps, and the DECLARED regression suite with a durability floor.
      This check runs the whole declared suite on purpose — dogfood-152 passed 3/3 acceptance
      criteria on a delivery whose own new test was failing in a directory the checks did not

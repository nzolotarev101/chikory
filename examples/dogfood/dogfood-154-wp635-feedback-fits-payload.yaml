      pnpm exec eslint src/workflow/remediation.ts src/workflow/agent-loop.ts src/judge/verdict.ts || { echo "AC-3 FAIL: eslint is red on the modules this WP touches"; exit 1; }

      grep -qE 'export const [A-Z_]*MAX[A-Z_]*(_CHARS)? *(: *number)? *= *[0-9]+' src/workflow/remediation.ts || {
        echo "AC-3 FAIL: the channel bound is no longer a named exported constant. 'How big can this get' must have an answer a reader can find (F-365)."
        exit 1

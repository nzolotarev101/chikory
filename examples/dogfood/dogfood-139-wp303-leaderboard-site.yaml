# Plain: we have measured Chikory against a raw coding agent on five real repository tasks and
# published the numbers as machine-readable files. Nobody outside this repo can read them. The
# last piece of the phase's exit gate is a page a skeptical developer can open — one that leads
# with the CONFIDENCE RANGE, says plainly that the two arms are NOT separated, and shows its
# working. This run builds that page, generated from the published data, never hand-written.
# WP: WP-303 (leaderboard site + methodology)
# Ladder-rung: 5 (the WP-303 half of the P3 exit gate — see WHY; WP-304's arm is still unrun)
# Thesis-KPI: current-phase ladder rung — the FIRST rung-5 slice attempted in nine runs. Second
#   KPI: the F-331 hand-fix live-proven. This spec declares `regression_suite:`, and if the judge
#   raises an out-of-rubric concern on a converged step, the journal must NOW show a SECOND judge
#   pass carrying a settled `pre_existing_suite_still_green` row. Before the dogfood-138 review's
#   hand-fix that pass did not happen and the gate was skipped silently (F-197: a run cannot prove
#   the fix it delivers, so the NEXT run carries the assertion).
# Format: loose — the outcome is fixed, the file layout and rendering are the executor's
#
# Launch mode: RUN (single node — one deliverable, one seam).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS IS THE LADDER RUNG, AFTER EIGHT RUNS OFF IT (dogfood-138 review, 2026-08-13):
#   The progression gate read ⛔ **STALLED** at this review (trailing-3 max steps 1 vs 4; no thesis
#   axis moved). STALLED is binding: the next headline MUST be the current phase's ladder rung, and
#   new 🔴 friction is hand-fixed rather than headlined. Both obligations are met — 🔴 F-331 was
#   hand-fixed in the same sitting (see below), and this spec is the rung.
#
#   The eight previous reviews deferred rung 5 on two measured blockers. RE-MEASURED 2026-08-13,
#   both still stand — and both gate **WP-304 only**:
#     1. `brownfield-001`'s zod v3→v4 gold patch. `find benchmarks/tasks -name '*brownfield-001*'`
#        returns one file whose only status line is `status: pinned`
#        (`benchmarks/tasks/brownfield-001-dependency-major-upgrade.yaml:24`) — no `fix_ref`.
#     2. `grep -rl repoRef benchmarks/results/ | wc -l` = **0**, so a both-arm re-run is owed.
#   **What was never re-measured is that rung 5 has a SECOND half that neither blocker touches.**
#   `plan.md` WP-303 records the data half DONE (dogfood-124) and names the residue exactly:
#   *"Still open: the static site + methodology prose (deliberately out of scope — trap D banned
#   HTML)."* That residue reads `benchmarks/publications/leaderboard/leaderboard.json`, which is
#   already on disk and already carries the published intervals. It needs no gold patch, no
#   `repoRef`, no quota and no new benchmark run. Eight reviews inherited "rung 5 is blocked" and
#   never checked whether ALL of it was blocked — the F-203 failure, applied to our own reasoning.
#
#   Scope honesty: this run climbs the **WP-303 half** of rung 5. It does not close the exit gate —
#   WP-304's OpenHands arm has still never run, and 19 requirements cannot separate two arms at 95%
#   confidence. Publishing the page does not manufacture a result; it makes the real, unseparated
#   result legible. That is the whole of NF-5.
#
# THE MEASURED PREMISE (re-measure before building; do not re-litigate):
#   * **The data exists and is published.** `benchmarks/publications/leaderboard/leaderboard.json`
#     holds two entries ordered by `iSrRange.low`, with `pairwise[0].separated === false`.
#     `benchmarks/publications/leaderboard/leaderboard.md` renders them as
#     `chikory [83.2%, 100.0%]` and `raw-claude-code [75.4%, 99.1%]`, plus the line
#     *"Overlap at 95% confidence; the arms are not separated (no winner)."*
#   * **The generator exists and copies, never recomputes.** `writeLeaderboard(bundleDirs, outDir)`
#     (`benchmarks/harness/src/leaderboard.ts:147-162`) calls `buildLeaderboard` (`:24`) and
#     `generateLeaderboardMarkdown` (`:104`), writing `leaderboard.json` + `leaderboard.md`. The
#     CLI is `chikory-bench leaderboard --bundle <dir> --out <dir>`
#     (`benchmarks/harness/src/main.ts:593-612`). **Two outputs today, no HTML anywhere:**
#     `grep -rln leaderboard benchmarks/harness/src` returns `leaderboard.ts` and `main.ts` only.
#   * **The suite this run must not break** is `pnpm --filter @chikory/benchmarks exec vitest run` —
#     timed at HEAD 2026-08-13: **15 files / 209 tests in 4.78 s**.
#   * **F-331 was hand-fixed in the dogfood-138 review and this run must not regress it**
#     (`packages/sdk-ts/src/workflow/agent-loop.ts` — `sealFromRubricFails` +
#     `regressionGateBeforeSuccess`). Both escalate SUCCESS seals now run a declared regression
#     suite before sealing. Proven RED-then-GREEN against the pre-fix tree: pre-fix a red suite on
#     a converged escalate sealed `SUCCESS` and `reviewHits` was `0`; post-fix it seals FAILED and
#     the gate runs exactly once (`test/runner/regression-suite-repair-live.test.ts`, scenarios
#     5/6/7; sdk suite 1376 → **1379** green).
#   * **The `unattended:` block below is not decoration** (F-322): without it a converged
#     out-of-rubric escalation parks for a human instead of auto-sealing. dogfood-135 parked
#     11h 59m 31s for want of it.
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. **Leading with the point estimate.** "Chikory 100% vs raw Claude Code 94.7%" is the single
#      most tempting and most dishonest rendering available. AC-1 drives an OVERLAPPING synthetic
#      pair and rejects any page containing a winner claim; AC-2 asserts the same on the REAL data,
#      where the intervals genuinely overlap.
#   B. **Never claiming anything.** The inverse squeeze — a page hard-wired to say "no winner" is
#      not honest either, it is broken. AC-1 drives a DISJOINT synthetic pair and REQUIRES the page
#      to report separation and name the leading arm.
#   C. **Recomputing the numbers instead of copying them.** WP-303's standing rule. The synthetic
#      bundles carry an `iSrRange` deliberately INCONSISTENT with their own
#      `requirementsSatisfied/requirementsTotal`, so a page that re-derives the interval prints
#      different digits and fails.
#   D. **Hardcoding today's result into a template.** AC-1's numbers are nothing like the real
#      ones, so a page that emits `83.2` for everything cannot pass.
#   E. **A page that needs the network.** A CDN stylesheet or a remote font means an auditor
#      offline sees nothing, and the evidence is not durable. AC-1 rejects any external `src`/
#      `href` scheme or protocol-relative URL in the rendered HTML.
#   F. **Methodology as a stub.** "Methodology: TBD" satisfies nothing. AC-2 requires the page to
#      state what was measured — the corpus size, the requirement count, both arms' adapters and
#      the interval method — with the numbers READ FROM THE BUNDLE, not typed in.
#   G. **Dead evidence links** (the F-261 shape, which dogfood-124 already shipped once). Every
#      local link the page emits must RESOLVE on disk; AC-2 walks them.
#   H. **Publishing to a gitignored or throwaway path.** A page nobody can commit is not published.
#      AC-2 asserts the output path is NOT gitignored (`git check-ignore` exits 1).
#
# NOT IN SCOPE: the OpenHands arm and any new benchmark run (WP-304 — quota, and dogfood-122 proved
#   an LLM executor must not supervise a quota-bound multi-hour suite); `brownfield-001`'s gold
#   patch; hosting/deployment (a file on disk is "live" for this rung); F-332/WP-618 (the chain
#   dropping `inconclusiveCheck`); F-328/WP-616; WP-606/F-306.

name: dogfood-139-wp303-leaderboard-site
wp: WP-303
goal: >
  Publish the benchmark result as a page a skeptical developer can open, audit and disbelieve.

  The numbers are measured and published as data: the leaderboard JSON under benchmarks/publications/leaderboard/
  carries both arms with their 95% confidence intervals and a pairwise record whose `separated`
  field is `false`. There is no human-readable page. The phase exit gate calls for a leaderboard
  that is LIVE, with its methodology, and that is the last piece missing.

  Make these true:

    * **The generator emits a self-contained HTML page**, alongside the JSON and Markdown it
      already writes, from the same published bundles — the leaderboard subcommand of the benchmark
      CLI produces it in the same output directory it already writes to. Self-contained means it renders with
      no network: every stylesheet, script, font and image is inline or absent. No CDN, no
      protocol-relative URL, no remote font.

    * **The page leads with the RANGE, never the point estimate.** Every arm is shown as its 95%
      interval. Where the pairwise record says the arms are NOT separated, the page must say so in
      plain words and must not name a winner, claim one arm beats or outperforms another, or call
      one "best". Where the record says they ARE separated, the page must report that separation
      and name the leading arm. The page's claim follows the DATA, in both directions.

    * **Published values are copied, never recomputed.** The page renders the numbers the bundle
      carries. If a bundle's stored interval disagrees with its own satisfied/total counts, the
      page shows the stored interval — recomputing is how a published artifact silently drifts
      from the result it claims to publish.

    * **The methodology is on the page, and it is read from the data.** State what was measured:
      how many tasks, how many requirements, which adapter ran each arm, what I-SR and D-SR mean,
      and that the interval is a 95% Wilson score interval on the requirement counts. The counts
      and labels come from the bundle, not from literals typed into a template.

    * **Every local link resolves.** Whatever the page links to as evidence — a bundle directory, a
      raw results path, a report — must exist on disk relative to the published page. A dead
      evidence link is worse than no link; it was shipped once already.

    * **The page is published at a durable, committed path**, not a gitignored scratch directory.

  Nothing else changes: `leaderboard.json` and `leaderboard.md` keep exactly their current shape and
  content for the same inputs, and the existing benchmark suite stays green.

  If an existing test pins a shape this change must alter, update its expectation and say plainly in
  the step summary that you did — do not delete it, and do not weaken it into a tautology.

  Constraints: TypeScript stays strict ESM with named exports and no `any`; no new dependency, no
  provider SDK, no API key, no global install; no HTML templating library — the page is generated
  by code already in this repo. Project commands run sequentially inside the already-activated
  Devbox environment, so invoke pinned tools directly and never nest `devbox run`.

  VERIFY YOUR OWN WORK: before you finish, run the benchmark package's build, lint, typecheck and
  full vitest suite through its own pnpm scripts, and report the ACTUAL command you ran and
  the ACTUAL counts it printed. Run each of those FOUR commands once and read its own output — do
  not re-run one command four times under four different names (F-325). This run also declares its
  own regression suite, so a red benchmark test will block the seal whatever your summary says.

repos:
  - url: /Users/nikitazolotarev/repos/chikory
    writable: true

# The benchmark harness's own suite is both the surface this run edits and the gate it must not
# break. Timed at HEAD 2026-08-13: `15 passed (15 files) · 209 passed (209 tests)` in **4.78 s**.
regression_suite: pnpm --filter @chikory/benchmarks exec vitest run
check_timeout_ms: 180000

acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE — every input and every expected answer is written HERE, driven
      against the real built artifact over SYNTHETIC bundles whose numbers are nothing like the
      real ones. It squeezes the honesty question in BOTH directions (overlapping pair → no winner
      claim; disjoint pair → separation reported and the leading arm named), pins copy-not-recompute
      with a stored interval deliberately inconsistent with its own counts, and rejects any remote
      asset. Runs in seconds.
    check: |
      cd benchmarks/harness && pnpm run build && \
      node --input-type=module -e '
      import {mkdtempSync,mkdirSync,writeFileSync,readdirSync,readFileSync,rmSync} from "node:fs";
      import {join} from "node:path";
      import {tmpdir} from "node:os";
      import {spawnSync} from "node:child_process";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const here=process.cwd();
      const root=mkdtempSync(join(tmpdir(),"lb-ac1-"));

      // A published arm summary, with the interval carried as DATA. `sat/total` are set so that a
      // page recomputing a Wilson interval from them would print digits nowhere near the stored
      // range — trap C has nowhere to hide.
      const arm=(label,adapter,lo,hi,sat,total)=>({
        label,suite:"benchmarks/tasks",adapter,
        startedAt:"2026-01-01T00:00:00.000Z",endedAt:"2026-01-01T01:00:00.000Z",
        tasks:4,tasksVerified:4,requirementsTotal:total,requirementsSatisfied:sat,
        dependencySatisfied:sat,
        iSr:sat/total,iSrCi:{lower:lo,upper:hi,low:lo,high:hi},iSrRange:{low:lo,high:hi},
        dSr:sat/total,dSrCi:{lower:lo,upper:hi,low:lo,high:hi},dSrRange:{low:lo,high:hi},
        rawResultsDir:"raw",bundle:"."});

      // Build a bundle dir the same way a published one is laid out: one summary per arm plus a
      // comparison. The exact filenames are read back from the REAL bundle so this cannot drift.
      const realBundle=join(here,"../publications/p3-rung-4");
      const realNames=readdirSync(realBundle).filter((f)=>f.endsWith("-summary.json"));
      A(realNames.length===2,"expected 2 arm summaries in the real bundle, got "+
        JSON.stringify(realNames));

      const makeBundle=(dir,a,b)=>{
        mkdirSync(dir,{recursive:true});
        mkdirSync(join(dir,"raw"),{recursive:true});
        writeFileSync(join(dir,a.label+"-summary.json"),JSON.stringify(a,null,2));
        writeFileSync(join(dir,b.label+"-summary.json"),JSON.stringify(b,null,2));
        writeFileSync(join(dir,"comparison.json"),JSON.stringify({arms:[a,b]},null,2));
        return dir;
      };

      const run=(bundle,out)=>{
        const res=spawnSync("node",[join(here,"dist/bin.js"),"leaderboard",
          "--bundle",bundle,"--out",out],{encoding:"utf8"});
        A(res.status===0,"chikory-bench leaderboard exited "+res.status+
          "\nstdout: "+res.stdout+"\nstderr: "+res.stderr);
        const html=readdirSync(out).filter((f)=>f.toLowerCase().endsWith(".html"));
        A(html.length>0,
          "the generator must emit a self-contained HTML page into --out alongside the JSON and "+
          "Markdown it already writes. Got only "+JSON.stringify(readdirSync(out)));
        return html.map((f)=>readFileSync(join(out,f),"utf8")).join("\n");
      };

      // ---- direction 1: the intervals OVERLAP. No winner may be claimed. ----
      // Bounds are exact at one decimal (41.1 / 92.2 / 37.7 / 88.8) so the assertion pins the
      // STORED value and not a rounding convention. sat/total are wildly inconsistent with them
      // — a Wilson interval on 1/4 is nowhere near [41.1%, 92.2%] — so trap C fails loudly.
      const overlapDir=makeBundle(join(root,"overlap"),
        arm("alpha","chikory",0.411,0.922,1,4),
        arm("beta","command",0.377,0.888,4,4));
      const overlapOut=join(root,"overlap-out");
      const wire=JSON.parse(readFileSync(join(overlapDir,"comparison.json"),"utf8"));
      A(wire.arms[0].iSrRange.low===0.411,"fixture sanity");
      const overlapHtml=run(overlapDir,overlapOut);

      A(/<html|<!doctype html/i.test(overlapHtml),"the page must be an HTML document");
      // trap D: the SYNTHETIC bounds, not today real ones.
      for(const frag of ["41.1","92.2","37.7","88.8"])
        A(overlapHtml.includes(frag),
          "trap C/D: the page must render the interval the BUNDLE carries, copied not recomputed "+
          "and not hardcoded. Missing "+frag+" from the rendered page");
      A(!overlapHtml.includes("83.2")&&!overlapHtml.includes("75.4"),
        "trap D: the real published numbers are hardcoded into the page — they appear for a "+
        "bundle that does not contain them");
      // trap A: no winner where the data separates nothing.
      const claim=/\bwinner\b|\boutperform|\bbeats\b|\bwins\b|\bbest[- ]performing\b/i;
      A(!claim.test(overlapHtml),
        "trap A: the intervals OVERLAP — the page must not name a winner. Matched: "+
        JSON.stringify((overlapHtml.match(claim)||[])[0]));
      A(/not separated|no winner|overlap/i.test(overlapHtml),
        "the page must SAY the arms are not separated, in words a reader understands");
      // trap E: nothing may be fetched.
      const remote=/(?:src|href)\s*=\s*["\x27](?:https?:)?\/\//i;
      A(!remote.test(overlapHtml),
        "trap E: the page must render with no network — no CDN, no remote font, no "+
        "protocol-relative URL. Matched: "+
        JSON.stringify((overlapHtml.match(remote)||[])[0]));
      A(!/@import\s+url\(\s*["\x27]?(?:https?:)?\/\//i.test(overlapHtml),
        "trap E: a remote @import is still a network fetch");

      // ---- direction 2: the intervals are DISJOINT. Separation must be reported. ----
      const sepDir=makeBundle(join(root,"separated"),
        arm("gamma","chikory",0.911,0.977,1,4),
        arm("delta","command",0.122,0.233,4,4));
      const sepHtml=run(sepDir,join(root,"separated-out"));
      A(sepHtml.includes("91.1")&&sepHtml.includes("12.2"),
        "the separated pair must render its own stored bounds too");
      A(/separated|winner|outperform|ahead of|leads/i.test(sepHtml),
        "trap B: the intervals are DISJOINT — a page hard-wired to say `no winner` is not honest, "+
        "it is broken. The page must report the separation.");
      A(sepHtml.includes("gamma"),
        "trap B: the leading arm must be named when the arms ARE separated");
      A(!/not separated|no winner/i.test(sepHtml),
        "trap B: the page claims BOTH separated and not-separated for a disjoint pair");

      // ---- the existing two outputs are unchanged in kind ----
      for(const out of [overlapOut]){
        const names=readdirSync(out);
        A(names.includes("leaderboard.json")&&names.includes("leaderboard.md"),
          "the JSON and Markdown outputs must survive — the page is ADDITIVE. Got "+
          JSON.stringify(names));
        const md=readFileSync(join(out,"leaderboard.md"),"utf8");
        A(md.includes("41.1")&&/not separated|no winner|overlap/i.test(md),
          "the Markdown output must keep rendering the same result it does today");
      }
      rmSync(root,{recursive:true,force:true});
      console.log("AC-1 OK: the generator emits a self-contained HTML page whose claim follows the "+
        "DATA in both directions — no winner on an overlapping pair, separation reported and the "+
        "leading arm named on a disjoint one — rendering the stored intervals verbatim, with no "+
        "network asset and both existing outputs intact");
      '

  - id: AC-2
    description: >
      The REAL published bundle, the durability rules and the methodology. Drives the built CLI
      over `benchmarks/publications/p3-rung-4`, then asserts the page that ships in the repo is at a
      non-gitignored path, states the honest unseparated result, carries a methodology sourced from
      the bundle's own counts, and emits no dead local link (the F-261 shape shipped once already).
    check: |
      cd benchmarks/harness && pnpm run build && \
      node --input-type=module -e '
      import {readdirSync,readFileSync,existsSync,mkdtempSync,rmSync} from "node:fs";
      import {join,resolve,dirname} from "node:path";
      import {tmpdir} from "node:os";
      import {spawnSync} from "node:child_process";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const here=process.cwd();
      const repo=resolve(here,"../..");
      const bundle=join(repo,"benchmarks/publications/p3-rung-4");
      const published=join(repo,"benchmarks/publications/leaderboard");

      // 1. the page SHIPS — a generator nobody ran publishes nothing.
      const shipped=readdirSync(published).filter((f)=>f.toLowerCase().endsWith(".html"));
      A(shipped.length>0,
        "the leaderboard must be LIVE: a generated HTML page has to be published under "+
        "benchmarks/publications/leaderboard/, not only producible on demand. Got "+
        JSON.stringify(readdirSync(published)));
      const pagePath=join(published,shipped[0]);
      const page=readFileSync(pagePath,"utf8");

      // 2. trap H — published means committable.
      const ign=spawnSync("git",["check-ignore","-q",pagePath],{cwd:repo});
      A(ign.status!==0,
        "trap H: the published page sits at a GITIGNORED path — it can never be committed, so it "+
        "is not published. Path: "+pagePath);

      // 3. the honest result, on the real data, from the real record.
      const lb=JSON.parse(readFileSync(join(published,"leaderboard.json"),"utf8"));
      A(Array.isArray(lb.entries)&&lb.entries.length>=2,"the published leaderboard needs 2 arms");
      A(lb.pairwise.every((p)=>p.separated===false),
        "premise moved: the real arms are recorded as SEPARATED. Re-measure before trusting this "+
        "check. Got "+JSON.stringify(lb.pairwise));
      for(const e of lb.entries){
        const lo=(e.iSrRange.low*100).toFixed(1), hi=(e.iSrRange.high*100).toFixed(1);
        A(page.includes(lo)&&page.includes(hi),
          "every arm must be shown as its 95% INTERVAL — `"+e.label+"` is missing "+lo+
          " / "+hi+" from the page");
        A(page.includes(e.label),"the page must name the arm `"+e.label+"`");
        A(page.includes(e.adapter),
          "the methodology must say which adapter ran `"+e.label+"` — missing "+e.adapter);
      }
      const claim=/\bwinner\b|\boutperform|\bbeats\b|\bwins\b|\bbest[- ]performing\b/i;
      A(!claim.test(page),
        "trap A: the real intervals OVERLAP — 19 requirements cannot separate two arms at 95%. "+
        "The page must not claim a winner. Matched: "+
        JSON.stringify((page.match(claim)||[])[0]));
      A(/not separated|no winner|overlap/i.test(page),
        "the page must state plainly that the arms are not separated");

      // 4. trap F — the methodology names what was measured, from the DATA.
      const total=String(lb.entries[0].requirementsTotal);
      const tasks=String(lb.entries[0].tasks);
      A(page.includes(total),"the methodology must state the requirement count ("+total+")");
      A(page.includes(tasks),"the methodology must state the corpus size ("+tasks+" tasks)");
      A(/wilson/i.test(page),"the methodology must name the interval method (95% Wilson score)");
      A(/I-?SR/i.test(page)&&/D-?SR/i.test(page),
        "the methodology must define both reported rates (I-SR and D-SR)");

      // 5. trap G — every LOCAL link resolves on disk, relative to the page.
      const links=[...page.matchAll(/(?:src|href)\s*=\s*["\x27]([^"\x27#]+)["\x27]/gi)]
        .map((m)=>m[1])
        .filter((u)=>!/^(?:[a-z]+:|\/\/|#|data:|mailto:)/i.test(u));
      const dead=links.filter((u)=>!existsSync(resolve(dirname(pagePath),u))&&
        !existsSync(resolve(repo,u.replace(/^\//,""))));
      A(dead.length===0,
        "trap G: the page emits DEAD evidence links — the F-261 shape, shipped once already. "+
        "Unresolvable: "+JSON.stringify(dead));

      // 6. the shipped page is REPRODUCIBLE from the bundle — not hand-written prose.
      const out=mkdtempSync(join(tmpdir(),"lb-ac2-"));
      const res=spawnSync("node",[join(here,"dist/bin.js"),"leaderboard",
        "--bundle",bundle,"--out",out],{encoding:"utf8"});
      A(res.status===0,"regenerating from the real bundle exited "+res.status+
        "\nstderr: "+res.stderr);
      const regen=readdirSync(out).filter((f)=>f.toLowerCase().endsWith(".html"));
      A(regen.length>0,
        "the published page must be GENERATED from the bundle — regenerating produced no HTML, so "+
        "what ships was hand-written and will drift from the data it claims to publish");
      const regenHtml=readFileSync(join(out,regen[0]),"utf8");
      for(const e of lb.entries)
        A(regenHtml.includes((e.iSrRange.low*100).toFixed(1)),
          "the regenerated page must carry the same published bound for `"+e.label+"`");
      A(!claim.test(regenHtml),"the regenerated page must not claim a winner either");
      rmSync(out,{recursive:true,force:true});
      console.log("AC-2 OK: a generated, non-gitignored page ships under "+
        "benchmarks/publications/leaderboard/, shows both arms as 95% intervals, states plainly "+
        "that they are not separated, carries a methodology sourced from the bundle counts, emits "+
        "no dead local link, and reproduces from the bundle it publishes");
      '

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): a converged out-of-rubric escalation — every criterion and every rubric item
# passing — auto-seals SUCCESS with this policy present, instead of parking overnight for a human.
# F-331 (dogfood-138): that seal now runs the declared `regression_suite` first, so a converged
# escalation can no longer retire this run with its own benchmark suite unrun.
unattended:
  escalation: seal_resumable_failed

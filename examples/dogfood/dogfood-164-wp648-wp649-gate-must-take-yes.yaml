      });

      const LOOP = "src/workflow/loop.ts";
      const OTHER = "src/workflow/other.ts";

      /**
       * The committed baseline. `loop.ts` ALREADY carries a workflow->runner edge, exactly as
       * packages/sdk-ts/src/workflow/agent-loop.ts:47 does on main — that is the whole point:

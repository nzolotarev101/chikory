acceptance_criteria:
  - id: AC-1
    description: >
      THE SCAN OWNS ITS ORACLE, AND BOTH FLOORS ARE GRADED IN ONE CHECK SO NEITHER CAN BE BOUGHT
      WITH THE OTHER (F-426). It drives the real built `scanDiffForLayeringViolations` through its
      one-argument production call shape. The FALSE-POSITIVE CEILING is measured over an enumerated
      corpus the delivery cannot hand-fit — every file `git ls-files` reports under
      packages/sdk-ts/src — by synthesising, for each, the diff shape that cost dogfood-163 its run
      (two adjacent lines reordered, so every added line is also present on the pre-image side):
      ZERO of them may report a violation. The RECALL FLOOR is measured over the SAME enumerated
      corpus by appending one genuinely new forbidden import to each file: EVERY one must be
      reported. It also grades the byte-exact hunk from the run's own step-2 artifact, a
      removal-only diff, and a pure addition with no pre-image evidence at all.
    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/judge/ac1-introduced-vs-restored.generated.test.ts
      mkdir -p test/judge
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { execFileSync } from "node:child_process";
      import { readFileSync } from "node:fs";
      import { describe, expect, test } from "vitest";

      import { scanDiffForLayeringViolations } from "../../src/judge/index.js";

      const REPO = execFileSync("git", ["rev-parse", "--show-toplevel"], { encoding: "utf8" }).trim();

      /** A unified diff header for one file, exactly as `git diff` emits it. */
      function header(path: string): string[] {
        return [`diff --git a/${path} b/${path}`, "index 1111111..2222222 100644", `--- a/${path}`, `+++ b/${path}`];
      }

      /**
       * The dogfood-163 shape, generalised: two adjacent lines swap places. Every ADDED
       * line is also present on the pre-image side of the very same hunk, so nothing here
       * was introduced. `git diff` emits exactly this for a reordered import block.
       */
      function reorderDiff(path: string, lines: string[], at: number): string {
        const a = lines[at]!;
        const b = lines[at + 1] ?? "";
        const ctxBefore = lines.slice(Math.max(0, at - 2), at);
        const ctxAfter = lines.slice(at + 2, at + 4);
        return [
          ...header(path),
          `@@ -${Math.max(1, at - 1)},6 +${Math.max(1, at - 1)},6 @@`,
          ...ctxBefore.map((l) => ` ${l}`),
          `-${a}`,
          `-${b}`,
          `+${b}`,
          `+${a}`,
          ...ctxAfter.map((l) => ` ${l}`),
        ].join("\n");
      }

      /** A pure addition of one import no file in the repo has. Nothing can call this restored. */
      const PROBE = 'import { __ac1Probe } from "src/cli/__ac1_probe_target.js";';
      function additionDiff(path: string, lines: string[]): string {
        return [
          ...header(path),
          "@@ -1,3 +1,4 @@",
          `+${PROBE}`,
          ...lines.slice(0, 3).map((l) => ` ${l}`),
        ].join("\n");
      }

      /** Only removals. Deleting a forbidden import cannot be a new violation. */
      function removalDiff(path: string, line: string): string {
        return [...header(path), "@@ -1,1 +1,0 @@", `-${line}`].join("\n");
      }

      function srcFiles(): string[] {
        return execFileSync("git", ["ls-files", "packages/sdk-ts/src"], { cwd: REPO, encoding: "utf8" })
          .split("\n")
          .filter((f) => f.endsWith(".ts"));
      }

      /**
       * The recall floor only binds where the scan HAS a layer to reason about. Files
       * outside the declared layer map (src/agents/, src/journal/, src/heal/, src/dataset/,
       * src/index.ts, ...) have never been in the scan's remit and widening that remit is
       * not this WP's job. cli is the top layer, so nothing above it can be forbidden.
       */
      const MAPPED_DIR = /\/src\/(?:util|providers|artifacts|executors|judge|planner|workflow|runner|chain)\//;
      const MAPPED_FILE = /\/src\/(?:types|schemas|canonical-json|pricing|otel|router|runner)\.ts$/;
      function inRecallCorpus(path: string): boolean {
        if (path.includes("/src/cli/")) return false;
        return MAPPED_DIR.test(path) || MAPPED_FILE.test(path);
      }

      describe("the architecture scan reports what the diff INTRODUCED (WP-649)", () => {
        test("the byte-exact hunk that cost dogfood-163 its run reports nothing", () => {
          const diff = [
            ...header("packages/sdk-ts/src/workflow/agent-loop.ts"),
            "@@ -44,7 +44,8 @@ import {",
            ' } from "../runner/pacing.js";',
            ' import { calibrateContextWindow, resolveContextWindowForSpec } from "../runner/context-window.js";',
            " // Pure (no I/O, no clock) — workflow-bundle safe.",
            '-import { advanceStrikeCount, isInfraStepFailure } from "../runner/strike-accounting.js";',
            '+import { advanceStrikeCount } from "../runner/strike-accounting.js";',
            '+import { isInfraStepFailure } from "../executors/infra-failure.js";',
            " import type {",
            "   ArtifactRef,",
          ].join("\n");
          expect(
            scanDiffForLayeringViolations(diff),
            "this is `99816e9865e4`, dogfood-163's step-2 diff, verbatim. The one added runner import is " +
              "byte-identical to packages/sdk-ts/src/workflow/agent-loop.ts:47 on main, and the pre-image side " +
              "of this very hunk carries the same edge twice. The step RESTORED it. Reporting it FAILED a run " +
              "whose delivery was green, with 4 of 6 steps and 98.9% of budget unspent.",
          ).toEqual([]);
        });

        test("removing a forbidden import is not a violation", () => {
          expect(
            scanDiffForLayeringViolations(
              removalDiff(
                "packages/sdk-ts/src/workflow/agent-loop.ts",
                'import { advanceStrikeCount } from "../runner/strike-accounting.js";',
              ),
            ),
            "a diff that only DELETES a forbidden edge has made the layering strictly better.",
          ).toEqual([]);
        });

        test("a pure addition with no pre-image evidence is still a violation", () => {
          const path = "packages/sdk-ts/src/judge/rubric.ts";
          const lines = readFileSync(`${REPO}/${path}`, "utf8").split("\n");
          expect(
            scanDiffForLayeringViolations(additionDiff(path, lines)),
            "nothing in this diff says the edge pre-existed, and nothing in the repo imports " +
              "src/cli/__ac1_probe_target.js. A scan that answers [] here has stopped scanning.",
          ).toEqual(["judge→cli"]);
        });

        test("BOTH FLOORS over the enumerated corpus: 0 false positives AND 100% recall", () => {
          const files = srcFiles();
          expect(files.length, "git ls-files returned no TypeScript sources — the corpus is empty").toBeGreaterThan(100);

          const falsePositives: string[] = [];
          const missed: string[] = [];
          let ceilingCases = 0;
          let recallCases = 0;

          for (const path of files) {
            const lines = readFileSync(`${REPO}/${path}`, "utf8").split("\n");

            // CEILING — reorder every adjacent pair in the file's first 120 lines (where
            // imports live). Nothing is introduced, so nothing may be reported.
            for (let i = 0; i < Math.min(lines.length - 1, 120); i++) {
              if (!/\b(?:import|export|require)\b/.test(lines[i]!)) continue;
              ceilingCases += 1;
              const got = scanDiffForLayeringViolations(reorderDiff(path, lines, i));
              if (got.length > 0) falsePositives.push(`${path}:${i + 1} -> ${got.join(",")} :: ${lines[i]!.trim()}`);
            }

            // RECALL — every file the layer map covers gains one genuinely new import of
            // the top layer, and every single one of them must be reported.
            if (!inRecallCorpus(path)) continue;
            recallCases += 1;
            if (scanDiffForLayeringViolations(additionDiff(path, lines)).length === 0) missed.push(path);
          }

          expect(
            falsePositives.slice(0, 12),
            `FALSE-POSITIVE CEILING BUSTED: ${falsePositives.length} of ${ceilingCases} reorder cases across ` +
              `${files.length} enumerated files reported a violation the diff did not introduce. This is the ` +
              `defect that failed dogfood-163, measured on a corpus the delivery cannot hand-fit.`,
          ).toEqual([]);
          expect(
            missed.slice(0, 12),
            `RECALL FLOOR BUSTED: ${missed.length} of ${recallCases} files did NOT report a genuinely new ` +
              `forbidden import. A ceiling bought by muzzling the scan is worth nothing — both floors are ` +
              `graded here so neither can be paid for with the other (F-426).`,
          ).toEqual([]);
          expect(ceilingCases, "the ceiling corpus is too small to mean anything").toBeGreaterThan(300);
          expect(recallCases, "the recall corpus is too small to mean anything").toBeGreaterThan(100);
        });
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-1 FAIL: the architecture scan still cannot tell an edge the diff INTRODUCED from one it merely RESTORED, or it bought that by no longer catching a genuinely new forbidden import. vitest exited $ST"
        exit 1
      fi
      echo "AC-1 OK: 0 false positives and 100% recall over the enumerated git ls-files corpus, and the dogfood-163 hunk reports nothing"

            async runStep(input): Promise<StepRecord> {
              attempt += 1;
              await writeAll(input.workspaceDir, byAttempt[Math.min(attempt - 1, byAttempt.length - 1)]!);
              return {
                diffRef: await ctx.store.put(`diff ${attempt}`, { kind: "diff", summary: `attempt ${attempt}` }),
                transcriptRef: await ctx.store.put(`transcript ${attempt}`, {
                  kind: "transcript",
                  summary: `attempt ${attempt}`,
                }),
                status: "SUCCESS",
                summary: `attempt ${attempt}: wrote the workspace`,
                toolCalls: 1,
                tokens: { input: 100, output: 50 },
                costUsd: 0,
                costEstimated: false,
                durationMs: 10,
              };
            },
          });
        return { scripted: adapter };
      }

      interface Outcome {
        status: string;
        terminals: { status: string; reason?: string }[];
        rubricFailIds: string[][];
      }

      async function driveRun(
        byAttempt: Record<string, string>[],
        forms: JudgeForm[],
        maxSteps: number,
      ): Promise<Outcome> {
        const wire = await startFakeJudgeWire(forms, { reviewForms: [completionReviewForm()] });
        cleanups.push(() => wire.close());

        const tmp = await mkdtemp(join(tmpdir(), "ac2-gate-yes-"));
        cleanups.push(() => rm(tmp, { recursive: true, force: true }));
        const repoDir = join(tmp, "src");
        const repoUrl = await initSourceRepo(repoDir, {});
        // `initSourceRepo`'s second argument is the scripted-adapter CONFIG, not a file map —
        // the baseline has to be committed by hand, or the "restored" premise does not exist.
        await writeAll(repoDir, SEED);
        execFileSync("git", ["-C", repoDir, "add", "-A"]);
        execFileSync("git", ["-C", repoDir, "commit", "-m", "seed the pre-existing layering edge"]);

        const dataDir = join(tmp, "data");
        const taskQueue = `tq-${randomUUID()}`;
        const worker = await createRunnerWorker({
          adapters: scriptedRegistry(byAttempt),
          address: address!,
          taskQueue,
          dataDir,
          workflowBundlePath: bundlePath!,
          routerOptions: { baseUrls: { "openai-compat": wire.url } },
        });
        const workerDone = worker.run();
        const runner = createTemporalRunner({ address: address!, taskQueue, dataDir });
        cleanups.push(async () => {
          worker.shutdown();
          await workerDone;
          await runner.close();
        });

        const spec = makeJudgedSpec({ repoUrl, cadence: 1, maxSteps, budgetUsd: 20 });
        const handle = await runner.start({ ...spec, executor: { adapter: "scripted", family: "anthropic" } });
        const report = await waitFor(
          async () => {
            const r = await handle.status();
            return TERMINAL_STATUSES.includes(r.status) ? r : undefined;
          },
          { timeoutMs: 90_000, what: "run to reach a terminal status" },
        );
        const journal = new Journal(journalPath(dataDir, handle.runId));
        try {
          return {
            status: report.status,
            terminals: journal.entries("terminal").map((e) => e.payload as Outcome["terminals"][number]),
            rubricFailIds: journal.entries("judge").map((e) => {
              const p = e.payload as { form: { rubricResults: { id: string; pass: boolean }[] } };
              return p.form.rubricResults.filter((r) => !r.pass).map((r) => r.id);
            }),
          };
        } finally {
          journal.close();
        }
      }

      const ARCH = "no_architecture_violations";
      // A NON-destructive LLM-judged row. `scope_matches_instruction` and
      // `no_unrelated_deletions` are destructive (`packages/sdk-ts/src/judge/rubric.ts:69`),
      // so they ROLLBACK the step and never reach a seal at all.
      const DESIGN = "design_serves_overall_goal";
      const detail = (o: Outcome) =>
        " status=" + o.status + " terminals=" + JSON.stringify(o.terminals) +
        " rubricFailsPerPass=" + JSON.stringify(o.rubricFailIds);

      describe("a deterministic gate must be able to take yes for an answer (WP-648/WP-649)", () => {
        test(
          "A: introduced then restored is not sealed on - B: introduced and kept still is - C: an LLM row survives a clean review",
          async () => {
            // A — dogfood-163 replayed. Step 1 genuinely adds a forbidden import; step 2 puts
            // both files back exactly as it found them, so the CUMULATIVE diff is clean while
            // the step-scoped diff re-emits a runner import the repo already had. Both passes
            // report the same label, so step 2's objection reads as a REPEAT of step 1's and
            // the anti-oscillation bound denies a second repair grant — exactly as in the run.
            const a = await driveRun(
              [DIRTY, RESTORE],
              [judgeForm({ criteria: { "AC-1": true } })],
              2,
            );
            expect(
              (a.terminals.at(-1)?.reason ?? "").includes(ARCH),
              "step 2 put every file back exactly as it found it — the cumulative diff introduces " +
                "nothing, and the completion review's own re-measurement says so. Sealing on `" + ARCH +
                "` here IS dogfood-163: a green delivery condemned by a complaint the run had already " +
                "retracted, with 4 of 6 steps and 98.9% of budget unspent." + detail(a),
            ).toBe(false);

            // B — the forbidden import is introduced and NEVER removed. The gate must still bite,
            // deterministically, with no appeal. maxSteps 1 leaves no repair grant to muddy it.
            const b = await driveRun([DIRTY], [judgeForm({ criteria: { "AC-1": true } })], 1);
            expect(
              b.status === "FAILED" && (b.terminals.at(-1)?.reason ?? "").includes(ARCH),
              "this run really does add a forbidden layering edge to a file that had none, and never " +
                "takes it back. If it does not seal FAILED on `" + ARCH + "`, scenario A was bought by " +
                "muzzling the gate rather than by teaching it what a diff INTRODUCED." + detail(b),
            ).toBe(true);

            // C — an LLM-judged row fails at the sealing pass and the completion review comes
            // back ALL GREEN. The objection must survive: dropping it is the exact hole
            // `mergeDesignFindings` was written to close.
            const c = await driveRun(
              [BENIGN],
              [judgeForm({ criteria: { "AC-1": true }, rubricFails: [DESIGN] })],
              1,
            );
            expect(
              c.status,
              "an LLM-judged objection raised at the sealing pass must not be cleared by a second, " +
                "independent review that happens to come back clean. `mergeDesignFindings` unions those " +
                "on purpose; ONLY the deterministic rows may be retracted. A SUCCESS here means the fix " +
                "was `the later verdict always wins`." + detail(c),
            ).toBe("FAILED");
            expect(
              (c.terminals.at(-1)?.reason ?? "").includes(DESIGN),
              "the surviving objection must be NAMED in the seal reason, not silently folded away." +
                detail(c),
            ).toBe(true);
          },
          300_000,
        );
      });
      GENEOF
      pnpm exec vitest run "$TARGET"
      ST=$?
      rm -f "$TARGET"
      if [ "$ST" -ne 0 ]; then
        echo "AC-2 FAIL: either a run that restored every file to its committed text is still sealed on no_architecture_violations, or the gate was softened so a genuinely new forbidden import no longer seals FAILED, or an LLM-judged objection is now silently cleared by a clean completion review. vitest exited $ST"
        exit 1
      fi
      echo "AC-2 OK: a retracted deterministic row no longer seals the run, a real violation still does, and an LLM row still survives a clean review"
  - id: AC-3
    description: >
      THE TRAP RAIL AND THE DURABILITY FLOOR. Strict typecheck over src AND test (F-382), eslint
      over the touched modules, then greps that the out-of-scope surfaces this WP must not disturb
      are still present AND that the rubric id set was neither shrunk nor padded, then the committed
      judge/durable-execution guards, then the DECLARED regression suite green AND larger by at
      least four tests — a behaviour proved only by these grading checks is not pinned at all
      (F-356).
    check: |
      cd packages/sdk-ts || exit 1
      pnpm run typecheck || { echo "AC-3 FAIL: strict typecheck is red (this covers test/ too — F-382)"; exit 1; }
      pnpm exec eslint src/judge/scan-layering.ts src/judge/rubric.ts src/judge/evidence.ts src/workflow/completion-review.ts src/workflow/agent-loop.ts || { echo "AC-3 FAIL: eslint is red on the modules this WP touches"; exit 1; }

      grep -qE 'export function scanDiffForLayeringViolations' src/judge/scan-layering.ts || {
        echo "AC-3 FAIL: trap — the scan was deleted rather than corrected. This WP changes WHAT the scan reports, not whether it exists."
        exit 1
      }
      grep -qE 'export const DETERMINISTIC_RUBRIC_IDS' src/judge/rubric.ts || {
        echo "AC-3 FAIL: trap — DETERMINISTIC_RUBRIC_IDS was removed. The unappealable set is the point; it may not be dissolved."
        exit 1
      }
      grep -qE '"no_architecture_violations"' src/judge/rubric.ts || {
        echo "AC-3 FAIL: trap — no_architecture_violations was dropped from the deterministic set. That makes the symptom vanish and the gate worthless."
        exit 1
      }
      grep -qE '"no_secrets_introduced"' src/judge/rubric.ts || {
        echo "AC-3 FAIL: trap — no_secrets_introduced was dropped from the deterministic set."
        exit 1
      }
      grep -qE 'export function mergeDesignFindings' src/workflow/completion-review.ts || {
        echo "AC-3 FAIL: trap — mergeDesignFindings was removed rather than corrected. The union it performs for LLM rows must survive."
        exit 1
      }
      grep -qE 'export function areMateriallySameObjections' src/workflow/completion-review.ts || {
        echo "AC-3 FAIL: trap — the WP-643/WP-644 objection comparator was disturbed. It is dogfood-165's work and is out of scope here."
        exit 1
      }
      grep -qE 'export const MAX_GATE_REPAIR_ATTEMPTS' src/heal/gate-repair.ts || {
        echo "AC-3 FAIL: trap — the gate-repair route lost its bound. No LLM-verdict gate may exit (WP-542/F-207), and this WP does not touch that path."
        exit 1
      }
      grep -qE 'export function isInfraStepFailure' src/executors/infra-failure.ts || {
        echo "AC-3 FAIL: trap — dogfood-163's WP-645 crash classifier was disturbed. This WP does not touch that path."
        exit 1
      }
      grep -qE 'export function ignoredPreservePriority' src/judge/hermeticity.ts || {
        echo "AC-3 FAIL: trap — dogfood-159's judge-check isolation was disturbed. This WP does not touch that path."
        exit 1
      }

      RUBRIC_N=$(grep -cE '^\s+id: "' src/judge/rubric.ts)
      echo "rubric item declarations: ${RUBRIC_N}"

      pnpm exec vitest run test/runner/deterministic-rubric-live.test.ts test/runner/completion-review.test.ts test/runner/resume-drill-seam.test.ts test/chain/advance.test.ts || {
        echo "AC-3 FAIL: trap — a committed judge or durable-execution guard is RED. The anti-oscillation bound, the completion-review merge contract, the resume drill and chain sealing (WP-543/F-208) must all still hold."
        exit 1
      }

      OUT=$(pnpm --filter @chikory/sdk exec vitest run 2>&1)
      ST=$?
      echo "$OUT" | grep -nE '(^|[[:space:]])(FAIL|×|✕|AssertionError)' | head -n 20
      echo "$OUT" | tail -6
      if [ "$ST" -ne 0 ]; then
        echo "AC-3 FAIL: the DECLARED regression suite is RED (vitest exited $ST). One test in this suite is known flaky (F-420, 1 red in 4 observations) — the failing test's NAME is printed above and the full output is kept by the review harness."
        exit 1
      fi
      N=$(echo "$OUT" | grep -oE "Tests +[0-9]+ passed" | grep -oE "[0-9]+" | head -1)
      echo "committed suite tests passing: ${N:-UNPARSEABLE} (floor 1792, measured baseline 1788)"
      if [ -z "$N" ]; then
        echo "AC-3 FAIL: could not read a test count out of the vitest summary"
        exit 1
      fi
      if [ "$N" -lt 1792 ]; then
        echo "AC-3 FAIL: durability floor not met — the committed suite did not grow by at least 4 tests. A behaviour proved only by the generated grading checks is not pinned at all (F-356)."
        exit 1
      fi
      echo "AC-3 OK: strict typecheck and lint green, out-of-scope surfaces intact, rubric set intact, judge + durable-execution guards green, DECLARED suite green AND larger"

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): without this, a converged out-of-rubric escalation parks overnight for a
# human instead of auto-sealing.
unattended:
  escalation: seal_resumable_failed

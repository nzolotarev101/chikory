    check: |
      cd packages/sdk-ts || exit 1
      TARGET=test/runner/ac2-gate-takes-yes-live.generated.test.ts
      rm -f "$TARGET"
      cat > "$TARGET" <<'GENEOF'
      import { execFileSync } from "node:child_process";
      import { randomUUID } from "node:crypto";

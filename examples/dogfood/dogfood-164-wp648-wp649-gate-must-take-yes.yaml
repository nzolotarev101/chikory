name: dogfood-164-wp648-wp649-gate-must-take-yes
wp: WP-648

goal: |
  A quality gate that condemns must also be able to acquit on its own re-measurement, and a check
  that reports on a diff must report what the diff DID, not what the file already contained.

  Measured from `run-12dfe421-7633-4199-9e3c-18bc32a410c5`'s own journal and artifacts at the
  dogfood-163 review.

  - The run's final completion review re-ran the deterministic architecture scan over the
    CUMULATIVE diff and reported "deterministic architecture scan found no layering violations",
    all five rubric rows green (judge pass #4, journal idx 13). 17 ms later the run sealed
    completion review: deterministic rubric failure — no_architecture_violations, with 4 of 6
    steps and 98.9% of its $20 budget unspent. The delivery was correct: 3/3 acceptance checks and
    a 1,788-test suite, green, byte-identical on harvest.
  - The row that condemned it was raised by the step-scoped pass on a diff whose only relevant
    added line — `import { advanceStrikeCount } from "../runner/strike-accounting.js";` — is
    byte-identical to `packages/sdk-ts/src/workflow/agent-loop.ts:47`, which has been committed on
    `main` throughout. The step RESTORED it; the scan reported it as INTRODUCED.

  Make this true.

  1. **A deterministic rubric row the completion review re-measures as PASS clears the sealing
     pass's FAIL for that same row.** The review measures the same program over a strictly wider
     diff, so its answer is the more authoritative one. `mergeDesignFindings`
     (packages/sdk-ts/src/workflow/completion-review.ts:665) is where the two answers meet.
  2. **An LLM-judged design row keeps the union it has today.** A second, independent review coming
     back clean must NOT silently drop an objection the sealing verdict raised — that is the trap
     `mergeDesignFindings` exists for, and it is named in its own doc comment. Only the
     deterministic set changes.
  3. **The architecture scan reports edges the diff INTRODUCED.** An added line whose forbidden edge
     is already present on the pre-image side of the same file in the same diff is not a new
     violation. A removal is not a violation. A genuinely new forbidden import still is, and must
     still be reported at step scope, not only at completion.
  4. **The gate is not softened anywhere else.** A run that really does introduce a forbidden edge
     and never removes it still seals FAILED, deterministically, with no appeal.

  Decide what happens when the two measurements disagree in the OTHER direction — the sealing pass
  passes a deterministic row and the review fails it — and say so in the code.

  Three things must NOT change, and each is a trap this run is graded on:

  1. **Deleting or muzzling the gate cannot be the answer.** Removing
     `no_architecture_violations` from `DETERMINISTIC_RUBRIC_IDS`, allowlisting the six files that
     already carry forbidden edges, scanning only the cumulative diff, or downgrading the row to
     advisory all make the symptom vanish and the gate worthless. AC-1 grades a recall floor over
     every file `git ls-files` reports, in the same check as the false-positive ceiling.
  2. **"The later verdict always wins" cannot be the answer.** AC-2 Scenario C fails an LLM-judged
     row at the sealing pass, returns an all-green completion review, and requires the objection to
     survive to the seal.
  3. **The exported call shape stays.** scanDiffForLayeringViolations(diff: string): string[] must
     keep working as a ONE-ARGUMENT call and must be correct for any diff that carries its own
     pre-image — that is how the production seam calls it
     (packages/sdk-ts/src/judge/evidence.ts:336). Optional extra parameters are allowed;
     threading base-tree context through collectEvidence is allowed; making the one-argument call
     wrong is not. `heal/gate-repair.ts` routing stands (WP-542/F-207), the rubric ids are
     unchanged (add none, remove none), and `areMateriallySameObjections`,
     packages/sdk-ts/src/judge/hermeticity.ts, packages/sdk-ts/src/executors/infra-failure.ts,
     the chain mirror, the Python mirror and the TaskSpec contract are all out of scope.

  TypeScript stays strict ESM with named exports and no `any`.

  Pin your work with tests that live in the repo, beside the files they cover. A behaviour proved
  only by the acceptance checks that grade this run is not pinned at all (F-356), and a repo test
  copied case-for-case from a grading check inherits its blind spots (F-403). **At least one
  committed test must drive a diff shape these acceptance criteria do not name.**

  Verify your work with FAST checks only: the package typecheck (`pnpm run typecheck` — NOT bare
  tsc --noEmit, which does not cover the test/ tree, F-382), eslint over the files you touched, and
  vitest over the directories you actually wrote into. Do NOT run the full vitest suite inside a
  step, and do NOT background one and wait for it — dogfood-163's step 1 did exactly that and was
  killed at 606.7s of its 600s cap having produced 129 output tokens (F-421/F-345/F-428).


# Plain: The reviewer already runs a program that can PROVE some defects — it scans the diff and
# reports forbidden layer dependencies as fact, not opinion. Today that proof is filed as a note:
# the run gets one repair attempt, and then ships green whether or not the repair happened. This
# run makes a proven defect stop the run from claiming success, without throwing away the work.
# WP: WP-607 (a rubric item whose evidence is DETERMINISTIC must gate the seal, not be recorded and shipped)
# Ladder-rung: 0 (OFF-LADDER by necessity — rung 5 is operator-gated today; see WHY)
# Thesis-KPI: judge true-positives pre-land — dogfood-133 produced a true-positive that was
#   DETECTED and not GATED, so the campaign's headline KPI counted a catch the product shipped
#   anyway; after this run a machine-settled catch cannot coexist with a SUCCESS seal
# Format: loose — the outcome and the public data contract are fixed; the wiring is the executor's
#
# Launch mode: RUN (single node — one gate, proven pure and then proven on the real loop).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-133 review, 2026-08-11):
#   Progression gate: ⛔ STALLED, which BINDS the next headline to the current phase ladder rung —
#   P3-rung-5, the phase exit gate. Its two blockers were RE-MEASURED again this review (not
#   re-litigated) and both still stand, both OPERATOR work rather than product gaps:
#     1. `brownfield-001`'s zod v3 → v4 gold patch. MEASURED: `find benchmarks -path
#        '*brownfield-001*'` still returns ONLY
#        `benchmarks/tasks/brownfield-001-dependency-major-upgrade.yaml` — no patch, no gold
#        artifact anywhere. Upstream never performed the migration, so there is no commit to
#        name: 3–6 h of operator research.
#     2. A re-run of BOTH arms so stored per-task results carry `repoRef`. MEASURED: `grep -rl
#        repoRef benchmarks/results/` still returns NOTHING. Hours of quota, and dogfood-122
#        proved an LLM executor must not supervise a quota-bound multi-hour suite.
#
#   This is the FOURTH consecutive off-ladder headline, and it needs the strongest reason yet.
#   It has one: dogfood-133 demonstrated the defect LIVE, on the mechanism the entire thesis
#   rests on. The judge found a real architecture breach in that run's own delivery, proved it
#   with a deterministic scan, said so at THREE of five passes including the FINAL completion
#   review — and the run sealed 🟢 SUCCESS with the breach on disk. A control plane whose quality
#   gate detects and does not gate is the product's core claim failing in its own repo.
#
# THE MEASURED PREMISE (re-measure before building; do not re-litigate):
#   * The scan is real and already runs. `scanDiffForLayeringViolations`
#     (`src/judge/scan-layering.ts:93`) maps added-diff-line imports onto the declared
#     `LAYER_ORDER` (`:13-24`, `core` = `src/types.ts|src/schemas.ts|src/util/|src/canonical-json.ts`
#     at index 0 … `judge` = `src/judge/` at index 5) and returns forbidden lower→higher edges.
#     MEASURED at HEAD against dogfood-133's harvested diff: `["core→judge"]`.
#   * The label already reaches the judge as EVIDENCE and stops there.
#     `collectEvidence` computes `architectureLabels` (`src/judge/evidence.ts:284`) beside
#     `secretScanLabels` (`:282`), and `runJudgePass` renders them into the prompt
#     (`src/judge/harness.ts:262`). The MODEL then answers `no_architecture_violations` in its
#     own words — nothing reconciles its answer against the labels.
#   * The JD-4 override this needs already exists for one item. `applyCheckOverrides`
#     (`src/judge/harness.ts:106-181`) rebuilds `rubricResults` from the RUBRIC LIST and replaces
#     the model's `tests_pass` answer with `exitCode === 0` whenever checks ran (`:146-168`).
#     Its ONLY call site is `harness.ts:304`, where `collected.architectureLabels` and
#     `collected.secretScanLabels` are already in scope. This is a wire, not a mechanism.
#   * The gate is where it ends. `no_architecture_violations` is `destructive: false`
#     (`src/judge/rubric.ts:42-47`), so it never triggers CONTRACTS.md §4 rule 1, and
#     `agent-loop.ts:1047-1105` treats EVERY non-destructive failure identically: one bounded
#     completion-review fix step, then `return seal("SUCCESS", "completion review: design
#     findings recorded — …")` (`:1099-1105`) **regardless of whether the retry cleared it**.
#     MEASURED on `run-83bf691d`: passes #2, #3 and #5 failed the item; the run sealed SUCCESS.
#   * `destructive: true` is NOT the repair, it is trap A. `computeVerdict`
#     (`src/judge/verdict.ts:77-84`) returns `ROLLBACK` before any other rule for a failing
#     destructive item, which RESTORES the workspace — destroying the good work along with the
#     bad import, on a run whose acceptance criteria all pass.
#   * Live runner scenarios boot Temporal through the vitest global setup
#     (`test/runner/global-setup.ts`, address injected via `inject`); `test/runner/helpers.ts`
#     supplies `initSourceRepo`, `makeJudgedSpec`, `startFakeJudgeWire` (per-step forms and a
#     SEPARATE `reviewForms` list), `TERMINAL_STATUSES` and `waitFor`. `scriptedRegistry`'s
#     adapter writes only `step-<n>.txt` at the workspace root, which maps to NO layer — so AC-2
#     writes its own ~25-line adapter to add a `src/`-pathed file. The evidence pipeline diffs the
#     real workspace, so that file makes the real scan emit a real label. A full live file
#     runs ~11 s.
#   * `judge.rubric_extra` shipped last run (WP-604, dogfood-133): spec-authored items are
#     `destructive: false` by construction and are MODEL judgments. They must never join the
#     deterministic set — a spec cannot promote its own prose to a machine-settled fact.
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. **Flipping `no_architecture_violations` to `destructive: true`.** The one-line "fix" that
#      makes the seal stop. It fires CONTRACTS.md §4 rule 1, ROLLS BACK the workspace and throws
#      away every good change the run made alongside the bad import — the exact harm WP-605
#      (a heal must not throw away work nobody condemned) was built to prevent. AC-1 requires the
#      item to STAY non-destructive and `computeVerdict` to keep returning non-ROLLBACK for it;
#      AC-2 requires that NO verdict in the gated run is `ROLLBACK` and that the run's own file
#      is still on disk when it ends.
#   B. **Parking the run for a human.** Blocking the seal by escalating and awaiting an operator
#      violates the F-107 discipline (never park a run whose acceptance criteria all pass) and
#      makes an unattended run hang forever. AC-2 requires a TERMINAL status with no operator
#      input, reached inside the wait budget.
#   C. **Gating every non-destructive item.** Promoting `design_serves_overall_goal` /
#      `cumulative_design_coherent` — a model's taste — to a seal blocker would make any review
#      opinion able to fail a run whose criteria pass. AC-1 requires those ids to be EXCLUDED
#      from the deterministic set and AC-2's third scenario requires a run failing only those to
#      still seal SUCCESS with the finding recorded, exactly as today.
#   D. **Trusting the model's answer on a machine-settled item.** Leaving the label as prompt
#      decoration means a judge that scores `no_architecture_violations` ✓ on a violating diff
#      still ships it — the same run, one model-mood away. AC-2's first scenario scripts the
#      judge to answer the item ✓ on a genuinely violating workspace: only a delivery that lets
#      the SCAN settle the item can pass it.
#   E. **A classifier nothing consults.** Exporting `DETERMINISTIC_RUBRIC_IDS` and never reading
#      it in the seal path is the F-283 shape. AC-2 drives the REAL Temporal workflow to a REAL
#      terminal state and reads the REAL journal.
#   F. **Removing the bounded heal.** Blocking the seal on the FIRST deterministic failure, with
#      no repair attempt, wastes the loop's whole self-correction premise (WP-519/DX-9). AC-2
#      requires the gated run to still execute its bounded completion-review repair step before
#      it reaches its terminal state.
#
# NOT IN SCOPE: the `LAYER_ORDER` table itself (`scan-layering.ts:13-24` is unchanged — this run
# does not relitigate which layers exist); `no_secrets_introduced`'s destructive flag (it is
# already hard-gated by §4 rule 1 and stays exactly as it is); the chain-side plan gate and node
# heal tiers (WP-542/543/544, untouched); the executor-asks-permission defect (F-311 → WP-608,
# a separate run); `judge.rubric_extra`'s semantics (WP-604 shipped, do not change them).

name: dogfood-134-wp607-deterministic-findings-gate
wp: WP-607
goal: >
  A quality finding a machine can SETTLE must stop the run from reporting success, and it must
  do so without destroying the work or handing the run to a human.

  The judge already runs deterministic programs over the diff: `scanDiffForLayeringViolations`
  reports forbidden layer dependencies, scanDiffForSecrets reports credentials. Their output
  is rendered into the judge prompt as evidence and the MODEL is then asked to answer the
  matching rubric item in its own words. Nothing reconciles the two, and a failing
  non-destructive rubric item is advisory: the run gets ONE bounded completion-review fix step
  and then seals SUCCESS whether or not the fix happened. dogfood-133 paid the bill in this
  repo — its own delivery introduced a forbidden `core→judge` import, the scan proved it, the
  judge failed the item at three of five passes including the final review, and the run sealed
  🟢 SUCCESS with the breach on disk.

  Make these true:

    * **The rubric declares which items a machine settles.** A `DETERMINISTIC_RUBRIC_IDS` value
      is on the SDK's public surface and names exactly the standing items whose answer comes
      from a deterministic scan: `no_architecture_violations` and `no_secrets_introduced`. The
      model-judgment items — `no_unrelated_deletions`, `scope_matches_instruction`,
      `design_serves_overall_goal`, `cumulative_design_coherent` — are NOT in it, and neither is
      any spec-authored `judge.rubric_extra` item.

    * **The scan wins over the model's opinion, both ways.** For a machine-settled item the
      recorded answer is derived from the scan output, not from what the model wrote, and the
      justification names the offending label. This is the JD-4 discipline `tests_pass` already
      follows, applied to the evidence the judge already computes.

    * **A live machine-settled failure blocks the SUCCESS seal.** A run whose acceptance criteria
      all pass but whose cumulative diff still carries a proven violation at the final completion
      review must NOT report SUCCESS. Its terminal state names the failing item.

    * **The work survives and no human is required.** Blocking is not rolling back: the item
      stays NON-destructive, no `ROLLBACK` verdict is opened for it, the run's files stay on
      disk, and the run reaches its terminal state unattended — a passing-criteria run is never
      parked for an operator (the F-107 discipline).

    * **The bounded repair still runs first.** The run still gets its one completion-review fix
      step before anything blocks; only a violation that is still live after that repair stops
      the seal.

    * **A model's design opinion still only advises.** A run failing solely
      `design_serves_overall_goal` or `cumulative_design_coherent` at the final review continues
      to seal SUCCESS with the finding recorded, exactly as it does today.

  The seams already exist and should be used rather than rebuilt: applyCheckOverrides
  (src/judge/harness.ts:106) already rebuilds `rubricResults` from the rubric list and already
  overrides one item from executed evidence, and its single call site (:304) already holds
  collected.architectureLabels and collected.secretScanLabels. The completion-review gate
  (src/workflow/agent-loop.ts:1047-1105) already grants and re-reviews one bounded fix step.

  Everything already proven stays proven: LAYER_ORDER and both scan primitives are unchanged;
  a destructive STANDING failure still returns ROLLBACK (CONTRACTS.md §4 rule 1); the
  judge-executed-check override of `tests_pass` still wins over the model (JD-4); a form missing
  a declared item is still an error, not a pass; `judge.rubric_extra` keeps exactly the semantics
  WP-604 landed; and the chain-side gate repair and node heal tiers (WP-542/543/544) are
  untouched. If an existing test pins the old shape, update its expectation and say plainly in
  the step summary that you did — do not delete it, and do not weaken it into a tautology.

  Constraints: TypeScript stays strict ESM with named exports and no `any`; no new dependency, no
  provider SDK, no API key, no global install. Workflow code stays deterministic and replay-safe.
  A contract that crosses into the workflow must survive its schema round-trip (src/schemas.ts),
  not only src/taskspec.ts, and `src/types.ts` is the CORE layer — it must not import from
  src/judge/, src/workflow/ or src/runner/ (this run's own subject matter: run the scan on
  your own diff before you finish). Project commands run sequentially inside the already-activated
  Devbox environment, so invoke pinned tools directly and never nest `devbox run`. Every existing
  test remains green, `eslint` stays clean, and the repo's own typecheck gate — `pnpm run
  typecheck`, which compiles the TEST project too, not just `src` — stays clean; run all three,
  not only the type-checker and the tests.


        criterionResults: [{ id: "AC-1", pass: acPass, justification: "scripted judge" }],
        rubricResults: [
          ...STANDING_RUBRIC.map((r) => ({
            id: r.id, pass: true, justification: "scripted — the model says this is fine",
          })),
          { id: RUBRIC_PRE_EXISTING_SUITE_GREEN, pass: true, justification: "model says fine" },
        ],
        concerns: [],
      });
      const reviewForm = (designPass: boolean): JudgeForm => ({
        criterionResults: [],
        rubricResults: [
          ...COMPLETION_REVIEW_RUBRIC.map((r) => ({
            id: r.id,
            pass: r.id === "design_serves_overall_goal" ? designPass : true,
            justification: "scripted review",
          })),
          { id: RUBRIC_PRE_EXISTING_SUITE_GREEN, pass: true, justification: "model says fine" },
        ],
        concerns: [],
      });

      describe.skipIf(address === null)("AC-2 — the repair brief and the honest rubric", () => {
        const cleanups: Array<() => Promise<void>> = [];
        afterEach(async () => { while (cleanups.length > 0) await cleanups.pop()!(); });

        async function runOne(
          command: string | undefined, designPass: boolean,
        ) {
          const seen: string[] = [];
          const wire = await startFakeJudgeWire(
            [stepForm(false), stepForm(true), stepForm(true), stepForm(true)],
            { reviewForms: [reviewForm(designPass), reviewForm(designPass)] },
          );
          cleanups.push(() => wire.close());
          const tmp = await mkdtemp(join(tmpdir(), "ac2-brief-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const repoUrl = await initSourceRepo(join(tmp, "src"), {});
          const dataDir = join(tmp, "data");
          const taskQueue = "tq-" + randomUUID();
          const worker = await createRunnerWorker({
            adapters: writingRegistry(seen), address: address!, taskQueue, dataDir,
            workflowBundlePath: bundlePath!,
            routerOptions: { baseUrls: { "openai-compat": wire.url } },
          });
          const workerDone = worker.run();
          const runner = createTemporalRunner({ address: address!, taskQueue, dataDir });
          cleanups.push(async () => {
            worker.shutdown(); await workerDone; await runner.close();
          });
          const spec = {
            ...makeJudgedSpec({ repoUrl, cadence: 1, maxSteps: 4 }),
            ...(command === undefined ? {} : { regressionSuite: command }),
          } as unknown as Parameters<typeof runner.start>[0];
          const handle = await runner.start(spec);
          const report = await waitFor(async () => {
            const r: RunStatusReport = await handle.status();
            return TERMINAL_STATUSES.includes(r.status) ? r : undefined;
          }, { what: "terminal status", timeoutMs: 120_000, intervalMs: 1000 });
          const j = new Journal(journalPath(dataDir, handle.runId));
          let entries: { verdicts: string[]; steps: number };
          try {
            entries = {
              verdicts: j.entries("verdict").map((e) => JSON.stringify(e.payload)),
              steps: j.entries("step").length,
            };
          } finally { j.close(); }
          return { report, ...entries, seen, runId: handle.runId, dataDir };
        }

        test("scenario 1 — a RED suite briefs the repair with the failing output, not a design note", async () => {
          const tmp = await mkdtemp(join(tmpdir(), "ac2-marker-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const marker = join(tmp, "runs.txt");
          const token = "SUITEFAIL" + randomUUID().replace(/-/g, "");
          // The token lives ONLY in the command OUTPUT — never in the command string,
          // which the justification already quotes.
          const failFile = join(tmp, "suite-output.txt");
          await writeFile(
            failFile, "FAILED test/widget.test.ts > it does the thing\\n" + token + "\\n");
          const r = await runOne(countingCommand(marker, failFile, 1), true);

          const briefs = r.seen.filter((b) => b.length > 0);
          const carrying = briefs.filter((b) => b.includes(token));
          // F-319: the repair must SEE what broke — the command output, not just its exit code.
          expect(carrying.length).toBeGreaterThan(0);
          // trap A: a repair for broken tests must not be told to change only the design.
          for (const brief of carrying) expect(DESIGN_ONLY.test(brief)).toBe(false);
          // trap E: the finding itself survives alongside the excerpt.
          for (const brief of carrying) {
            expect(brief).toContain(RUBRIC_PRE_EXISTING_SUITE_GREEN);
          }
          // WP-609 must still hold, in full.
          expect(r.report.status).not.toBe("SUCCESS");
          expect(TERMINAL_STATUSES).toContain(r.report.status);
          expect(r.verdicts.some((v) => v.includes("\\"ROLLBACK\\""))).toBe(false);
          expect(r.steps).toBeGreaterThan(1);
          const kept = await readFile(
            join(r.dataDir, "runs", r.runId, "workspace", "src", "feature.ts"), "utf8");
          expect(kept).toContain("feature");
          const runs = (await readFile(marker, "utf8")).trim().split("\\n").filter(Boolean);
          expect(runs.length).toBeGreaterThanOrEqual(1);
          expect(runs.length).toBeLessThanOrEqual(2);
        }, 240_000);

        test("scenario 2 — a GREEN suite seals SUCCESS, runs once, and scores the row only at the review", async () => {
          const tmp = await mkdtemp(join(tmpdir(), "ac2-marker-"));
          cleanups.push(() => rm(tmp, { recursive: true, force: true }));
          const marker = join(tmp, "runs.txt");
          const r = await runOne(countingCommand(marker, undefined, 0), true);
          expect(r.report.status).toBe("SUCCESS");
          expect(r.steps).toBeGreaterThan(1);
          const runs = (await readFile(marker, "utf8")).trim().split("\\n").filter(Boolean);
          expect(runs).toHaveLength(1);
          // The row is scored exactly where the command ran: once, at the completion review.
          const scored = r.verdicts.filter((v) => v.includes(RUBRIC_PRE_EXISTING_SUITE_GREEN));
          expect(scored).toHaveLength(1);
        }, 240_000);

        test("scenario 3 — no declared suite: a design brief keeps its wording and no row is recorded", async () => {
          const r = await runOne(undefined, false);
          expect(r.report.status).toBe("SUCCESS");
          const briefs = r.seen.filter((b) => b.length > 0);
          // trap B: the WP-537/F-196 design path must keep exactly its instruction.
          expect(briefs.some((b) => DESIGN_ONLY.test(b))).toBe(true);
          // F-321: nothing measured the suite, so nothing may claim it is green.
          for (const v of r.verdicts) {
            expect(v).not.toContain(RUBRIC_PRE_EXISTING_SUITE_GREEN);
          }
        }, 240_000);

      });
      `;
      writeFileSync(target, SRC);
      const res=spawnSync("pnpm",["exec","vitest","run",
        "test/runner/ac2-repair-brief.generated.test.ts"],{stdio:"inherit"});
      // Clean up BEFORE asserting — A() exits the process, which would skip a finally
      // block and leave the generated file behind to poison the next pass.
      rmSync(target,{force:true});
      A(res.status===0,
        "trap F: these scenarios read the brief off the CONTEXT THE EXECUTOR IS HANDED and the "+
        "rows off the REAL journal of a REAL Temporal run — a fix delivered to the judge prompt, "+
        "or a rubric row nothing measured, cannot satisfy them. vitest exited "+res.status);
      console.log("AC-2 OK: a red suite briefs the repair with its own failing output and without "+
        "the design-only instruction, a green one still seals SUCCESS with exactly one execution "+
        "and one scored row, and a run with no declared suite records no row at all");
      '

budget_usd: 20
max_steps: 6

agent_classes:
  executor: executor-default
  judge: judge-default

judge:
  cadence: 1

# F-322 (dogfood-135): a converged out-of-rubric escalation — every criterion and every rubric item
# passing — auto-seals SUCCESS with this policy present, instead of parking overnight for a human.
unattended:
  escalation: seal_resumable_failed

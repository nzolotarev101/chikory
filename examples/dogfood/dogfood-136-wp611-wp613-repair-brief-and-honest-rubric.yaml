      const green=settle({criterionId:NEW,command:"exit 0",exitCode:0,output:"ok",durationMs:5,
        infraFailed:false});
      A(green!==undefined&&green.pass===true,
        "WP-609 regression: a ZERO-exit suite must settle "+NEW+" as PASS, got "+
        JSON.stringify(green));
      const killed=settle({criterionId:NEW,command:"sleep 600",exitCode:1,

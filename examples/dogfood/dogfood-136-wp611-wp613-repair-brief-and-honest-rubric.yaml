# Plain: last run made the repository's own test suite a gate — a delivery that breaks an existing
# test can no longer report success. Two things about that gate are still wrong. When it blocks, the
# single repair step it grants is told "do NOT change behavior, only design" and is handed no failing
# test names, so the repair is set up to fail. And on every run that declares no suite, the gate still
# writes down "the pre-existing suite is still green" — a green nothing measured. This run fixes both.
# WP: WP-611 (a gate that blocks on a red suite must brief its one repair with the failing tests) +
#     WP-613 (a gate must not record a green it never measured)
# Ladder-rung: 0 (OFF-LADDER by necessity — rung 5 is operator-gated today; see WHY)
# Thesis-KPI: judge true-positives pre-land, and the FIRST LIVE PROOF of the WP-609 gate — this spec
#   declares `regression_suite:` itself, so the run must show `pre_existing_suite_still_green`
#   settled from a real exit code in its OWN journal (dogfood-135 could not: F-197)
# Format: loose — the outcomes are fixed, the wiring is the executor's
#
# Launch mode: RUN (single node — two halves of one gate, proven pure and then on the real loop).
#   CHIKORY_PREFLIGHT_ONLY=1 devbox run run-dogfood
#   devbox run run-dogfood
#
# WHY THIS AND NOT THE LADDER RUNG (dogfood-135 review, 2026-08-12):
#   Progression gate: ✅ PROGRESSING — dogfood-135's 4-step horizon moved the trailing-3 max steps
#   from 3 to 4, so the STALLED bind that governed the last five specs is LIFTED and the default
#   headline (the phase ladder rung) is now a judgment call rather than a rule. The default is still
#   P3-rung-5, the phase exit gate. Its two blockers were RE-MEASURED AGAIN this review (not
#   re-litigated) and both still stand, both OPERATOR work rather than product gaps:
#     1. `brownfield-001`'s zod v3 → v4 gold patch. MEASURED 2026-08-12: `find benchmarks/tasks -name
#        '*brownfield-001*'` returns ONLY
#        `benchmarks/tasks/brownfield-001-dependency-major-upgrade.yaml`, whose only status line is
#        `status: pinned` (:24) with no `fix_ref` and no gold artifact. 3–6 h of operator research.
#     2. A re-run of BOTH arms so stored per-task results carry `repoRef`. MEASURED 2026-08-12:
#        `grep -rl repoRef benchmarks/results/ | wc -l` = **0**. Hours of quota, and dogfood-122
#        proved an LLM executor must not supervise a quota-bound multi-hour suite.
#
#   This is the SIXTH consecutive off-ladder headline, and it is not a new detour — it finishes the
#   one the loop is already standing in. A control plane cannot publish a reliability number (which
#   is what rung 5 exists to do) while its own freshly-built regression gate (a) cannot brief the
#   repair it demands and (b) records a green it never measured. Both defects are MEASURED below.
#
# THE MEASURED PREMISE (re-measure before building; do not re-litigate):
#   * **F-319 — the repair is misinstructed AND blind.** `buildCompletionReviewBrief`
#     (`src/workflow/completion-review.ts:113-126`) opens with the fixed line *"do NOT change
#     behavior, only design"* and renders each failing item as `id: justification`. For a red suite
#     the justification is the whole payload: ``regression suite command `X` exited 1`` — no failing
#     test names, no output, no file. So the ONE bounded repair WP-609 grants
#     (`src/workflow/agent-loop.ts:1087-1097`) is told not to do the only thing that would help.
#   * **The evidence already exists and is thrown away.** `collectEvidence` keeps the full `CheckRun`
#     on `regressionSuiteRun` (`src/judge/evidence.ts:331-341`), `output` included and already
#     bounded to 64 KiB by `runCheck`. Nothing carries it to the executor.
#   * **F-321 — a green nobody measured.** With no `regressionSuite`, `applyCheckOverrides` records
#     `pass: true, "no regression suite command executed for this pass"`
#     (`src/judge/harness.ts:211-216`), and the item sits unconditionally in `STANDING_RUBRIC`
#     (`src/judge/rubric.ts:64`) and `COMPLETION_REVIEW_RUBRIC` (`:96`). MEASURED on dogfood-135
#     itself, which declared no suite: every one of its judge passes carries the row. A self-reported
#     green is the exact shape WP-609 abolished for the executor; the gate must not commit it.
#   * **The membership fix has a HARD constraint the obvious version violates.** A form missing a
#     declared item is an error (`src/judge/harness.ts:174-177`), and the deterministic branches run
#     AFTER that lookup. So the item may only be in the rubric of a pass where the command actually
#     ran — the RUN-COMPLETION REVIEW of a run that declared one. Put it on per-step passes and every
#     per-step judge call errors. The composition seam already exists: `effectiveRubric`
#     (`src/runner/activities.ts:1687-1691`) already builds a per-run rubric for `judge.rubric_extra`.
#   * **dogfood-135 measured the wrong-shape attempt LIVE, and it cost a step.** Its step 3 built
#     conditional inclusion and turned BOTH acceptance criteria red, because that spec's AC-1
#     asserted STATIC rubric-array membership. Step 4 reverted to the unconditional shape. The design
#     was right and the oracle was wrong — which is why THIS spec asserts the inverse.
#   * **`COMPLETION_REVIEW_RUBRIC` is built by lookup into `STANDING_RUBRIC`**
#     (`src/judge/rubric.ts:94-97` uses `STANDING_RUBRIC.find(...)!`). Removing the item from
#     `STANDING_RUBRIC` without fixing that line yields `undefined!` in an exported array — a crash
#     the type-checker will not catch. Decide it deliberately.
#   * **The brief has a budget.** `COMPLETION_BRIEF_MAX_CHARS` clamps the whole brief
#     (`src/workflow/completion-review.ts:127-130`); a 64 KiB suite log pasted in whole would push
#     the findings out of the string entirely. The excerpt must be bounded BEFORE the clamp.
#   * **The `unattended:` block below is not decoration.** dogfood-135 omitted it and parked
#     11h 59m 31s in `AWAITING_APPROVAL` on a converged out-of-rubric escalation that
#     `src/workflow/agent-loop.ts:1213-1224` auto-seals SUCCESS when the policy is present (F-322).
#
# Designed traps — the plausible-but-wrong deliveries the acceptance criteria exist to reject:
#   A. **Appending the suite output and keeping the design-only framing.** The brief gains the
#      failing tests and still commands *"do NOT change behavior, only design"*. The repair remains
#      forbidden from making the change that would fix it. AC-2 scenario 1 requires the brief the
#      executor actually receives to carry the output AND to be free of that instruction.
#   B. **Rewriting the framing for EVERY brief.** A design finding must keep today's wording — the
#      WP-537/F-196 completion-review semantics are proven and must not regress. AC-2 scenario 3
#      drives a design-only finding and requires the design instruction to still be there.
#   C. **Conditional membership at the runner only, leaving the override permissive.** If
#      `applyCheckOverrides` still answers the item without evidence, the F-321 green survives for
#      every other caller and every future call site. AC-1 requires an ERROR naming the id.
#   D. **Dropping the item.** Deleting it from the rubrics without conditionally re-adding it makes
#      WP-609 inert — the cheapest way to pass a membership assertion. AC-2 scenarios 1–2 require the
#      full WP-609 behavior to survive: a red suite still blocks the seal, a green one still seals.
#   E. **Blowing the brief bound, or starving the findings to fit the log.** AC-2 scenario 1 requires
#      the brief to name the failing item AND stay within the existing clamp.
#   F. **Putting the suite output in the JUDGE prompt instead of the executor brief** (the F-283 /
#      dogfood-135 trap-F shape: the fix worn as a costume by the wrong consumer). AC-2 reads the
#      brief off the CONTEXT THE EXECUTOR IS HANDED, not off the judge messages.
#   G. **Proving membership with a unit test the executor writes.** AC-1 owns the oracle against the
#      real built artifact; AC-2 reads the REAL journal of a REAL Temporal run.
#
# NOT IN SCOPE: making `regression_suite` required (track-B); a launcher precheck for a missing
# `unattended:` block (track-B, F-322); the per-check cap or the infra-kill SEAL semantics
# (🟡 F-320 → WP-612, a separate run — this spec must not change what a cap kill does); `tests_pass`
# and its JD-4 override (`src/judge/harness.ts:148-171` unchanged); the WP-607 items.

name: dogfood-136-wp611-wp613-repair-brief-and-honest-rubric
wp: WP-611
goal: >
  A gate that blocks a run must tell the repair step what to fix, and must never record a result it
  did not measure.

  dogfood-135 built the regression-suite gate: a spec names the repository verification command, the
  run executes it once before sealing, and a red result blocks SUCCESS. Reviewing it measured two
  defects in the gate itself. First, when it blocks, the single bounded repair step it grants is
  briefed *"do NOT change behavior, only design"* and is handed the string
  ``regression suite command `X` exited 1`` — no failing test names, no output — so the repair is
  instructed away from the fix and blinded to the problem. Second, on a run that declares no suite,
  the gate still writes a passing row that reads "the pre-existing suite is still green" when
  nothing ran at all.

  Make these true:

    * **A blocked run is told what broke, in the words of the command that broke.** When the
      run-completion review blocks on the machine-settled regression-suite item, the brief the
      EXECUTOR receives for its one bounded repair step carries a bounded excerpt of that command's
      OWN output — enough to name the failing tests — and names the failing item. The excerpt is
      bounded before the existing whole-brief clamp, so the findings can never be squeezed out.

    * **A repair for broken tests is not briefed as a design review.** For that failure the brief
      must not carry the standing design-only instruction; it must direct a behavior fix. A brief
      raised for an ordinary DESIGN finding keeps exactly today's wording and shape — that path is
      WP-537/F-196 behavior and must not regress.

    * **A rubric row exists only where the command ran.** `pre_existing_suite_still_green` appears
      on the run-completion review pass of a run whose spec declares `regression_suite`, and NOWHERE
      else: not on a per-step judge pass, and on no pass of a run that declares no suite. Neither
      `STANDING_RUBRIC` nor `COMPLETION_REVIEW_RUBRIC` carries it by default; the per-run
      composition seam that already exists for judge.rubric_extra is the place to add it.

    * **The override refuses to answer without evidence.** If the item ever reaches
      `applyCheckOverrides` with no regression-suite CheckRun, that is a wiring error and must be
      returned as an error naming the item — never a passing row, never the model's answer.

  Everything WP-609 proved stays proven, and the acceptance criteria re-assert it: the command runs
  at the seal and never on a per-step pass, exactly ONCE on a clean run and at most twice with the
  repair; its exit code settles the row and the justification names the command; a red suite blocks
  SUCCESS while staying NON-destructive (no `ROLLBACK` verdict, files left on disk, terminal state
  reached unattended); a cap kill still records `infraFailed` and is never a pass; `regression_suite`
  still parses and survives the `src/schemas.ts` round-trip. `tests_pass` keeps its JD-4 meaning and
  its override unchanged; `no_architecture_violations` and `no_secrets_introduced` keep the WP-607
  behavior; a destructive standing failure still returns ROLLBACK (CONTRACTS.md §4 rule 1).

  Note that `COMPLETION_REVIEW_RUBRIC` is currently built by looking items up in `STANDING_RUBRIC`
  with a non-null assertion — removing an item from one array silently affects the other. If an
  existing test pins the old shape, update its expectation and say plainly in the step summary that
  you did — do not delete it, and do not weaken it into a tautology.

  Constraints: TypeScript stays strict ESM with named exports and no `any`; no new dependency, no
  provider SDK, no API key, no global install. Workflow code stays deterministic and replay-safe.
  src/types.ts is the CORE layer — it must not import from src/judge/, src/workflow/ or
  src/runner/. Project commands run sequentially inside the already-activated Devbox environment, so
  invoke pinned tools directly and never nest `devbox run`.

  VERIFY YOUR OWN WORK: before you finish, run `pnpm run build`, `pnpm run lint`,
  `pnpm run typecheck` (which compiles the TEST project too) and the FULL test suite, and report the
  ACTUAL command you ran and the ACTUAL counts it printed. The full sdk-ts suite takes ~51 s. Do not
  write that the suite passed unless you invoked it and read its total line. This run also declares
  its own `regression_suite`, so a red judge/workflow test will block the seal whatever your summary
  says.


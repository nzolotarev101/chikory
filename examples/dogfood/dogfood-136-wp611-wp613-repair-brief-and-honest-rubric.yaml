      A(killed!==undefined&&killed.pass!==true&&killed.infraFailed===true,
        "WP-609 regression: a cap-killed suite is neither green nor a plain code red, got "+
        JSON.stringify(killed));

      // 6. blocking is still not rolling back, and the destructive lever still works.
      const form=(failIds)=>({criterionResults:[{id:"AC-1",pass:true,justification:"ok"}],
        rubricResults:rubric.map((r)=>({id:r.id,pass:!failIds.includes(r.id),
          justification:"scripted"})),concerns:[]});
      const v=computeVerdict(form([NEW]),{},rubric);
      A(v.kind!=="ROLLBACK","a failing "+NEW+" must NEVER produce ROLLBACK, got "+
        JSON.stringify(v));
      A(String(v.rationale).includes(NEW),"the verdict rationale must NAME the failing item, got "+
        JSON.stringify(v));
      A(computeVerdict({criterionResults:[{id:"AC-1",pass:true,justification:"ok"}],
        rubricResults:STANDING_RUBRIC.map((r)=>({id:r.id,
          pass:r.id!=="no_secrets_introduced",justification:"scripted"})),concerns:[]},
        {},STANDING_RUBRIC).kind==="ROLLBACK",
        "a failing DESTRUCTIVE standing item must still return ROLLBACK (CONTRACTS.md §4 rule 1)");

      console.log("AC-1 OK: the suite item is machine-settled and non-destructive but belongs to "+
        "no default rubric, the override refuses to answer it without evidence, and every WP-609 "+
        "and WP-607 guarantee still holds");
      '


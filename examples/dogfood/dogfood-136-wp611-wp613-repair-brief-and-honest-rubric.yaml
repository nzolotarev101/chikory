acceptance_criteria:
  - id: AC-1
    description: >
      THIS CHECK OWNS ITS ORACLE — RED on HEAD, green only once the rubric stops carrying the item
      by default and the override refuses to answer without evidence. Every input family and every
      expected answer is written HERE: the id stays machine-settled and non-destructive; NEITHER
      exported rubric array carries it (trap D is answered by AC-2, not by this one); the two WP-607
      ids are untouched and still in the standing rubric; the override ERRORS when the item is
      declared with no evidence (trap C) and still settles RED / GREEN / cap-killed exactly as
      WP-609 proved; a failing item still yields a NON-ROLLBACK verdict naming it while a failing
      destructive item still rolls back; and `regression_suite` still parses and round-trips. Runs
      in seconds against the real built artifact.
    check: |
      cd packages/sdk-ts && pnpm run typecheck && pnpm exec tsc && \
      OPENAI_COMPAT_BASE_URL=http://127.0.0.1:9 node --input-type=module -e '
      import {pathToFileURL} from "node:url";
      import {join} from "node:path";
      const A=(c,m)=>{if(!c){console.error("FAIL: "+m);process.exit(1);}};
      const mod=await import(pathToFileURL(join(process.cwd(),"dist/index.js")).href);
      const {parseTaskSpec,computeVerdict,STANDING_RUBRIC,COMPLETION_REVIEW_RUBRIC,
             DETERMINISTIC_RUBRIC_IDS,TaskSpecSchema,applyCheckOverrides,
             RUBRIC_PRE_EXISTING_SUITE_GREEN,RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM}=mod;
      A(typeof parseTaskSpec==="function"&&typeof computeVerdict==="function"&&
        Array.isArray(STANDING_RUBRIC)&&Array.isArray(COMPLETION_REVIEW_RUBRIC)&&
        DETERMINISTIC_RUBRIC_IDS!==undefined&&TaskSpecSchema!==undefined&&
        typeof applyCheckOverrides==="function"&&
        typeof RUBRIC_PRE_EXISTING_SUITE_GREEN==="string"&&
        RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM!==undefined,
        "the WP-609 public surface must stay intact, item export included");
      const NEW=RUBRIC_PRE_EXISTING_SUITE_GREEN;
      A(NEW==="pre_existing_suite_still_green",
        "the rubric id is a public contract read by DOGFOODING and every run record; it must "+
        "stay pre_existing_suite_still_green, got "+JSON.stringify(NEW));

      // 1. WP-609 regression guard — the spec field still parses and round-trips.
      const CMD="echo regression-suite-probe";
      const base=["name: probe","goal: do a thing","repos:","  - url: /tmp/probe-repo",
        "    writable: true","acceptance_criteria:","  - id: AC-1","    description: d",
        "    check: \"true\"","budget_usd: 1","max_steps: 1","agent_classes:",
        "  executor: executor-default","  judge: judge-default","judge:","  cadence: 1"];
      const withSuite=parseTaskSpec([...base,"regression_suite: "+CMD].join("\n"));
      A(JSON.stringify(withSuite).includes(CMD),
        "WP-609 regression: regression_suite must still survive parseTaskSpec");
      A(JSON.stringify(TaskSpecSchema.parse(JSON.parse(JSON.stringify(withSuite)))).includes(CMD),
        "WP-609 regression: it must still survive the src/schemas.ts round-trip");

      // 2. the id stays machine-settled and non-destructive, and WP-607 is untouched.
      const det=new Set(Array.from(DETERMINISTIC_RUBRIC_IDS));
      A(det.has(NEW),"the suite item must STAY machine-settled: "+JSON.stringify([...det]));
      for(const id of ["no_architecture_violations","no_secrets_introduced"]){
        A(det.has(id),"WP-607 regression: "+id+" must stay machine-settled");
        A(STANDING_RUBRIC.some((r)=>r.id===id),
          "WP-607 regression: "+id+" must stay in STANDING_RUBRIC");
      }
      A(!det.has("tests_pass")&&STANDING_RUBRIC.some((r)=>r.id==="tests_pass"),
        "tests_pass keeps its JD-4 meaning: a standing item overridden from the judge-executed "+
        "checks, NOT a member of the machine-settled set. Got "+JSON.stringify([...det]));
      A(RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM.destructive===false,
        "trap E lineage: the suite item must stay NON-destructive, got "+
        JSON.stringify(RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM));

      // 3. THE F-321 FIX — no default rubric may carry an item nothing ran.
      A(!STANDING_RUBRIC.some((r)=>r.id===NEW),
        "F-321: STANDING_RUBRIC must NOT carry "+NEW+" — it is scored on every per-step pass of "+
        "every run, including runs that declare no suite, where nothing measured it. Got "+
        JSON.stringify(STANDING_RUBRIC.map((r)=>r.id)));
      A(!COMPLETION_REVIEW_RUBRIC.some((r)=>r.id===NEW),
        "F-321: COMPLETION_REVIEW_RUBRIC must NOT carry "+NEW+" by default — a run that declares "+
        "no regression_suite still runs this review. Got "+
        JSON.stringify(COMPLETION_REVIEW_RUBRIC.map((r)=>r.id)));
      A(COMPLETION_REVIEW_RUBRIC.every((r)=>r!==undefined&&typeof r.id==="string"),
        "COMPLETION_REVIEW_RUBRIC is built by lookup into STANDING_RUBRIC — removing an item "+
        "without fixing that lookup leaves an undefined hole. Got "+
        JSON.stringify(COMPLETION_REVIEW_RUBRIC));

      // 4. trap C — the override must REFUSE to answer the item without evidence.
      const rubric=[...COMPLETION_REVIEW_RUBRIC,RUBRIC_PRE_EXISTING_SUITE_GREEN_ITEM];
      const crit=[{id:"AC-1",description:"d",check:"true"}];
      const modelForm=()=>({criterionResults:[{id:"AC-1",pass:true,justification:"m"}],
        rubricResults:rubric.map((r)=>({id:r.id,pass:true,justification:"model says fine"})),
        concerns:[]});
      const noEvidence=applyCheckOverrides(modelForm(),crit,rubric,[],[],[],undefined);
      A("error" in noEvidence,
        "trap C: the item declared with NO regression-suite evidence is a WIRING ERROR and must "+
        "be returned as one — never a passing row (F-321) and never the model answer. Got "+
        JSON.stringify(noEvidence));
      A(String(noEvidence.error).includes(NEW),
        "the error must NAME the item, got "+JSON.stringify(noEvidence.error));

      // 5. WP-609 semantics survive, all three evidence families.
      const settle=(run)=>{
        const out=applyCheckOverrides(modelForm(),crit,rubric,[],[],[],run);
        A(!("error" in out),"applyCheckOverrides must accept the regression-suite run, got "+
          JSON.stringify(out));
        return out.form.rubricResults.find((r)=>r.id===NEW);
      };
      const red=settle({criterionId:NEW,command:"exit 1",exitCode:1,output:"boom",durationMs:5,
        infraFailed:false});
      A(red!==undefined&&red.pass===false,
        "WP-609 regression: a NONZERO suite must settle "+NEW+" as FAILED over a model PASS, got "+

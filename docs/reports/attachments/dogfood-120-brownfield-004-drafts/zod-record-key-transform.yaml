id: brownfield-004
class: brownfield
status: pinned
repo:
  url: https://github.com/colinhacks/zod
  ref: 195e86962b5156012a4cdcfbff87dffddce87b78
base_verification_command: npx -y pnpm@10.12.1 install --frozen-lockfile && npx -y pnpm@10.12.1 exec vitest run --project zod
horizon: 3-6h
goal: |
  Starting from the issue report only (`z.record()` with finite-key schemas such as
  `z.literal()` or `z.enum()` ignores `.transform()` and `.refine()` validations on
  the key schema), write a failing regression test that reproduces the key-schema
  transform and validation dropping bug, then fix the root cause in `z.record()`.
  The fix must ensure key schema transforms and refinements execute properly for all
  finite key types without breaking existing record semantics or required-key checks.
requirements:
  - id: R1
    description: dependencies install clean (pnpm workspace, frozen lockfile)
    check: npx -y pnpm@10.12.1 install --frozen-lockfile
  - id: R2
    description: a new or modified test reproduces the key-schema transform bug in z.record() and passes on the final code
    prerequisites: [R1]
    check: |
      set -e
      git add -A -N .
      NEW=$(git diff --name-only 195e86962b5156012a4cdcfbff87dffddce87b78 -- '*.test.ts')
      test -n "$NEW"
      grep -q -E 'z\.record|record\(' $NEW
      grep -q -E 'transform|refine' $NEW
      for f in $NEW; do npx -y pnpm@10.12.1 exec vitest run --project zod "$f"; done
  - id: R3
    description: full pre-existing zod test suite is green (no other observable behavior changed)
    prerequisites: [R1]
    check: npx -y pnpm@10.12.1 exec vitest run --project zod
  - id: R4
    description: the fix is root-cause, not a narrow transform-only patch — key-schema refinement failures are independently verified to surface invalid_key errors on finite-key records
    prerequisites: [R1]
    check: |
      set -e
      mkdir -p packages/zod/src/v4/classic/tests
      cat > packages/zod/src/v4/classic/tests/__root-cause-check.test.ts <<'TESTEOF'
      import { expect, test } from "vitest";
      import { z } from "zod/v4";

      test("root-cause check: key schema refinements surface invalid_key errors in z.record()", () => {
        const schema = z.record(
          z.literal(["a", "b"]).refine((k) => k === "a", { message: "only 'a' is allowed" }),
          z.string()
        );
        const result = schema.safeParse({ a: "ok", b: "nope" });
        expect(result.success).toBe(false);
        if (!result.success) {
          expect(result.error.issues[0]?.code).toBe("invalid_key");
        }
      });
      TESTEOF
      npx -y pnpm@10.12.1 exec vitest run --project zod packages/zod/src/v4/classic/tests/__root-cause-check.test.ts
metrics_notes: |
  Cost/time distribution split between diagnosis (tracing $ZodRecord fast-path
  vs slow-path execution in packages/zod/src/v4/core/schemas.ts) and edit phases;
  false-fix rate (R1-R3 green but R4 red — the classic "fixed key transform, but
  missed surfacing key-refinement invalid_key issues") is the judge's headline catch
  opportunity. R4 is a mechanical root-cause proxy that does NOT depend on the agent's
  chosen test file layout or name — it writes and runs its own probe directly.
tags: [bug-archaeology, regression, key-schema-transform, zod]
